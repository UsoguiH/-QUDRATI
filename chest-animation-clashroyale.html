<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فتح الصندوق — استنساخ حركة Duolingo</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Standalone clone of the Duolingo monthly-challenge chest opening,
   rebuilt frame-by-frame from "chest animation.mp4" (480×1044).
   Every coordinate below is in that reference frame; #stage is
   scaled uniformly to fit whatever viewport opens it.
   ============================================================ */
:root {
  --snow: #FCFCFC; --macaw: #1CB0F6; --macaw-dk: #1899D6; --sky: #54C4FC;
  --eel: #4B4B4B; --line: #E5E5E5;
  --wood: #C87800; --wood-dk: #B46800; --peach: #FCCCA4; --peach-dk: #ECB080; --latch: #FFEBDE;
  --tan: #ECC898; --plate: #E4E4E4;
  --bee: #FCC400; --bee-hi: #F8E46C; --bee-dk: #E6A800; --lid: #209CEC; --lid-dk: #1B8FE0; --lid-hi: #3AB0F4;
  --plate-blue: #48B0F0; --used-blue: #2494E4;
  --spark: #F8EC98; --comet: #F8E46C;
  --font: 'Baloo Bhaijaan 2', 'Segoe UI', Tahoma, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  background: var(--snow); font-family: var(--font); color: var(--eel);
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
  transition: background .32s ease;
}
body.bg-rare { background: var(--sky); }
body.bg-cr { background: #0B1230; }
#viewport { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
#stage { position: relative; width: 480px; height: 1044px; overflow: hidden; flex-shrink: 0; transform-origin: 50% 50%; }

/* ---- screens: Android-style push, new one slides in from the right ---- */
.scr { position: absolute; inset: 0; background: var(--snow); transform: translateX(100%); visibility: hidden; }
.scr.on { transform: none; visibility: visible; }
.scr.push-in  { visibility: visible; animation: pushIn  .32s cubic-bezier(.2,.7,.2,1) both; }
.scr.push-out { visibility: visible; animation: pushOut .32s cubic-bezier(.2,.7,.2,1) both; }
@keyframes pushIn  { from { transform: translateX(100%); } to { transform: none; } }
@keyframes pushOut { from { transform: none; } to { transform: translateX(-100%); } }

h1, h2, h3, p { margin: 0; }
button { font-family: var(--font); cursor: pointer; border: 0; background: none; padding: 0; color: inherit; }

/* Duolingo's 3D button: face + 4px lip */
.btn {
  display: block; width: 440px; height: 56px; margin: 0 auto; border-radius: 16px;
  background: var(--macaw); color: #fff; font-size: 17px; font-weight: 700;
  box-shadow: 0 4px 0 var(--macaw-dk); transition: transform .06s, box-shadow .06s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--macaw-dk); }

/* ============================================================
   Start screen — the monthly-challenge card the video begins on
   ============================================================ */
#s-start .qtitle { position: absolute; top: 178px; left: 0; right: 0; text-align: center; font-size: 26px; font-weight: 800; color: var(--macaw); }
.card { position: absolute; left: 20px; right: 20px; border: 2px solid var(--line); border-radius: 16px; background: #fff; }
#s-start .quests { top: 268px; }
.qrow { display: flex; align-items: center; gap: 14px; padding: 18px 16px; border-bottom: 2px solid var(--line); }
.qrow:last-child { border-bottom: 0; }
.qrow svg { width: 56px; height: 52px; flex-shrink: 0; overflow: visible; }
.qrow .qtxt { flex: 1; }
.qrow b { display: block; font-size: 16px; font-weight: 700; margin-bottom: 8px; }
.bar { position: relative; height: 18px; border-radius: 9px; background: var(--line); overflow: hidden; }
.bar i { position: absolute; top: 0; bottom: 0; right: 0; border-radius: 9px; background: var(--macaw); }
.bar i::after { content: ""; position: absolute; top: 4px; left: 8px; right: 8px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.35); }
.bar span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; }
.bar.low span { color: #AFAFAF; }
#s-start .month { top: 680px; height: 128px; display: flex; align-items: center; gap: 16px; padding: 0 16px; }
.avatar { width: 84px; height: 84px; border-radius: 50%; border: 3px solid var(--macaw); background: #DDF4FF; display: flex; align-items: center; justify-content: center; }
.avatar svg { width: 46px; height: 46px; }
.month b { display: block; font-size: 17px; margin-bottom: 4px; }
.month span { color: var(--macaw); font-weight: 700; font-size: 15px; }
#s-start .btn { position: absolute; bottom: 84px; left: 20px; }

/* ============================================================
   Chest screen
   ============================================================ */
#s-chest { cursor: pointer; }
#s-chest.rare { background: var(--sky); }
.ttl {
  position: absolute; top: 222px; left: 0; right: 0; text-align: center;
  font-size: 26px; font-weight: 800; color: var(--wood); line-height: 1.2;
  transition: opacity .22s ease;
}
.rare .ttl { color: #fff; }
.ttl.hide { opacity: 0; }

/* the chest lives in a 260×290 box; its plate's bottom is the floor */
.chestwrap { position: absolute; left: 110px; top: 285px; width: 260px; height: 290px; z-index: 2; }
.body { position: absolute; inset: 0; transform-origin: 50% 98%; will-change: transform; }
.plate { position: absolute; left: 15px; top: 235px; width: 232px; height: 46px; border-radius: 14px; background: var(--plate); }
.rare .plate { left: 12px; top: 222px; width: 236px; height: 63px; border-radius: 16px; background: var(--plate-blue); }
.box { position: absolute; inset: 0; will-change: transform; }
.box svg { position: absolute; left: 0; top: 0; width: 260px; height: 290px; overflow: visible; }
.box svg.open { display: none; }
.opened .box svg.closed { display: none; }
.opened .box svg.open { display: block; }

/* light pouring out of the open chest: a soft pool at the mouth + a cone */
.glow {
  position: absolute; left: 130px; top: 150px; width: 320px; height: 240px; transform: translate(-50%,-50%);
  background: radial-gradient(closest-side, rgba(255,255,255,.95), rgba(255,255,255,.55) 42%, rgba(255,255,255,0) 100%);
  opacity: 0; pointer-events: none; z-index: 3;
}
.cone {
  position: absolute; left: 130px; bottom: 130px; width: 380px; height: 560px; transform: translateX(-50%);
  clip-path: polygon(32% 100%, 68% 100%, 100% 0, 0 0);
  background: linear-gradient(to top, rgba(255,240,190,.5), rgba(255,240,190,.22) 40%, rgba(255,240,190,0) 100%);
  opacity: 0; pointer-events: none; z-index: 1;
}
.rare .cone { background: linear-gradient(to top, rgba(255,255,255,.92), rgba(255,255,255,.4) 40%, rgba(255,255,255,0) 100%); }
.opened .glow { animation: glowIn .25s ease-out forwards; }
.opened .cone { animation: coneIn .3s ease-out forwards, conePulse 1.1s ease-in-out .3s infinite; }
@keyframes glowIn { to { opacity: 1; } }
@keyframes coneIn { to { opacity: 1; } }
@keyframes conePulse { 0%, 100% { opacity: 1; } 50% { opacity: .78; } }

/* idle sparkles ringing the chest (4-point stars + tiny dots) */
.sparks { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
.sp { position: absolute; width: var(--s); height: var(--s); margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2); opacity: 0; animation: twinkle var(--d) ease-in-out var(--o) infinite; }
.sp svg { display: block; width: 100%; height: 100%; }
.sp.dot { border-radius: 50%; background: #fff; }
@keyframes twinkle {
  0%, 100% { opacity: 0; transform: scale(.25) rotate(-12deg) translateY(4px); }
  45%      { opacity: 1; transform: scale(1) rotate(8deg) translateY(-2px); }
  70%      { opacity: .9; transform: scale(.92) rotate(14deg) translateY(-6px); }
}

/* burst stars and rising motes (spawned by JS into .fx) */
.fx { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
.burst { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; animation: burstPop .46s cubic-bezier(.2,.8,.3,1) var(--o) both; }
.burst svg { display: block; width: 100%; height: 100%; }
@keyframes burstPop {
  0%   { opacity: 0; transform: translate(0,0) scale(0) rotate(0); }
  35%  { opacity: 1; transform: translate(calc(var(--dx) * .7), calc(var(--dy) * .7)) scale(1.25) rotate(20deg); }
  100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.4) rotate(45deg); }
}
.mote { position: absolute; width: 10px; height: 26px; margin: -13px 0 0 -5px; animation: moteRise var(--d) cubic-bezier(.15,.7,.3,1) both; }
.mote svg { display: block; width: 100%; height: 100%; }
@keyframes moteRise {
  0%   { opacity: 0; transform: translateY(0) scale(.5); }
  12%  { opacity: 1; transform: translateY(calc(var(--dy) * .12)) scale(1); }
  75%  { opacity: .9; }
  100% { opacity: 0; transform: translateY(var(--dy)) scale(.55); }
}

/* the comet arc that orbits the chest on every tap */
.arc { position: absolute; left: 0; top: 0; width: 480px; height: 1044px; pointer-events: none; z-index: 5; }

/* three chances: pale discs with an arrow; the live one is dark and hovers over its shadow */
.dots { position: absolute; top: 676px; left: 0; right: 0; height: 70px; display: flex; justify-content: center; gap: 38px; transition: opacity .28s ease; }
.dots.hide { opacity: 0; }
.dot { position: relative; width: 44px; height: 44px; }
.dot i {
  position: absolute; inset: 0; border-radius: 50%; background: var(--tan);
  display: flex; align-items: center; justify-content: center;
  transition: background .12s ease;
}
.dot i svg { width: 22px; height: 22px; }
.dot i svg path { stroke: #fff; }
.dot .sh { position: absolute; left: 9px; right: 9px; bottom: -14px; height: 8px; border-radius: 50%; background: #E4E4E1; opacity: 0; transition: opacity .15s; }
.dot.active i { background: var(--wood); animation: dotBob 1.1s ease-in-out infinite; }
.dot.active .sh { opacity: 1; animation: dotShade 1.1s ease-in-out infinite; }
.dot.active.pop i { animation: dotPop .18s cubic-bezier(.3,1.6,.5,1), dotBob 1.1s ease-in-out .18s infinite; }
.dot.used i svg { display: none; }
@keyframes dotBob   { 0%, 100% { transform: translateY(-8px); } 50% { transform: translateY(-11px); } }
@keyframes dotShade { 0%, 100% { transform: scaleX(1); opacity: 1; } 50% { transform: scaleX(.85); opacity: .8; } }
@keyframes dotPop   { 0% { transform: translateY(-8px) scale(.7); } 100% { transform: translateY(-8px) scale(1); } }
.rare .dot i { background: var(--used-blue); }
.rare .dot.active i { background: #fff; }
.rare .dot.active i svg path { stroke: var(--macaw); }
.rare .dot .sh { background: #3EAFF0; }

.cap { position: absolute; top: 782px; left: 0; right: 0; height: 40px; text-align: center; font-size: 20px; font-weight: 700; color: var(--eel); }
.rare .cap { color: #fff; }
.cap span { position: absolute; left: 0; right: 0; top: 0; transition: opacity .16s ease; }
.cap span.hide { opacity: 0; }

/* the white wash that sweeps down over the open chest */
.wash {
  position: absolute; left: 0; right: 0; top: 0; height: 1044px; pointer-events: none; z-index: 8;
  background: linear-gradient(to bottom, #fff 0%, #fff 62%, rgba(255,255,255,0) 100%);
  transform: translateY(-110%);
}
.wash.go { transition: transform .45s linear; transform: translateY(0); }

/* ============================================================
   Reward screen — the pile of gems
   ============================================================ */
#s-reward { background: var(--snow); }
.counter { position: absolute; top: 82px; left: 22px; display: flex; align-items: center; gap: 6px; direction: rtl; font-size: 16px; font-weight: 800; color: var(--macaw); }
.counter svg { width: 20px; height: 22px; }
.rtitle { position: absolute; top: 246px; left: 0; right: 0; text-align: center; font-size: 26px; font-weight: 800; color: var(--macaw); opacity: 0; transition: opacity .28s ease; }
#s-reward.told .rtitle { opacity: 1; }
.pile { position: absolute; left: 240px; top: 555px; width: 0; height: 0; }
.pshadow { position: absolute; left: -105px; top: 18px; width: 210px; height: 30px; border-radius: 50%; background: var(--line); transform: scale(0); transition: transform .3s cubic-bezier(.3,1.4,.5,1); }
#s-reward.piled .pshadow { transform: scale(1); }
.gem { position: absolute; width: 104px; height: 104px; margin: -52px 0 0 -52px; transform: scale(0) rotate(var(--r)); }
.gem svg { display: block; width: 100%; height: 100%; }
.gem.pop { animation: gemPop .3s cubic-bezier(.3,1.5,.5,1) var(--o) forwards; }
.gem.jig { animation: gemJig .32s cubic-bezier(.3,1.3,.5,1) var(--o) both; }
@keyframes gemPop { 0% { transform: scale(0) rotate(var(--r)); } 100% { transform: scale(1) rotate(var(--r)); } }
@keyframes gemJig { 0% { transform: scale(1) translateY(0) rotate(var(--r)); } 40% { transform: scale(1.1) translateY(-14px) rotate(var(--r)); } 100% { transform: scale(1) translateY(0) rotate(var(--r)); } }
.rfoot { position: absolute; left: 0; right: 0; bottom: 0; height: 240px; opacity: 0; pointer-events: none; transition: opacity .3s ease; }
#s-reward.told .rfoot { opacity: 1; pointer-events: auto; }
.rfoot .ad { position: absolute; top: 22px; left: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; }
.rfoot .ad svg { width: 22px; height: 22px; }
.rfoot .ad.gone { opacity: 0; pointer-events: none; transition: opacity .25s; }
.rfoot .link { position: absolute; top: 108px; left: 0; right: 0; text-align: center; font-size: 15px; font-weight: 700; color: var(--macaw); }
.rfoot .cont { position: absolute; top: 100px; left: 20px; }
#s-reward.rare12 .ad, #s-reward.rare12 .link { display: none; }
#s-reward:not(.rare12) .cont { display: none; }


/* ============================================================
   Clash Royale-style chest — dark arena, light wheel, rattle →
   lid burst → coins to the counter → cards rising one by one
   ============================================================ */
#s-cr { background: radial-gradient(120% 80% at 50% 42%, #2C4380 0%, #172452 55%, #0B1230 100%); cursor: pointer; }
.cr-arena { position: absolute; inset: 0; }
#s-cr.jolt .cr-arena { animation: scrJolt .4s linear; }
@keyframes scrJolt { 0%, 100% { transform: none; } 12% { transform: translate(-7px, 5px); } 28% { transform: translate(7px, -5px); } 44% { transform: translate(-5px, -3px); } 60% { transform: translate(4px, 3px); } 80% { transform: translate(-2px, 1px); } }
.cr-rays {
  position: absolute; left: 50%; top: 520px; width: 1200px; height: 1200px; margin: -600px 0 0 -600px; border-radius: 50%;
  background: repeating-conic-gradient(rgba(255,236,170,.9) 0 8deg, transparent 8deg 22.5deg);
  -webkit-mask-image: radial-gradient(closest-side, #000 8%, transparent 62%); mask-image: radial-gradient(closest-side, #000 8%, transparent 62%);
  opacity: .12; animation: raysSpin 36s linear infinite; transition: opacity .35s ease;
}
#s-cr.cr-open .cr-rays { opacity: .55; }
@keyframes raysSpin { to { transform: rotate(360deg); } }
.cr-vignette { position: absolute; inset: 0; background: radial-gradient(90% 70% at 50% 50%, rgba(0,0,0,0) 40%, rgba(5,8,25,.75) 100%); pointer-events: none; }
.cr-title, .cr-prompt, .cr-cardname, .cr-goldpop, .cr-gold {
  color: #fff; font-weight: 800; -webkit-text-stroke: 1.2px #141A38; paint-order: stroke fill;
  text-shadow: 0 3px 0 #141A38, 0 6px 14px rgba(0,0,0,.55);
}
.cr-title { position: absolute; top: 132px; left: 0; right: 0; text-align: center; font-size: 36px; transition: opacity .25s; }
.cr-prompt { position: absolute; top: 772px; left: 0; right: 0; text-align: center; font-size: 22px; opacity: 0; transition: opacity .25s; }
.cr-prompt.on { opacity: 1; animation: promptPulse 1.3s ease-in-out infinite; }
@keyframes promptPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.cr-gold { position: absolute; top: 78px; left: 22px; display: flex; align-items: center; gap: 8px; font-size: 22px; }
.cr-gold svg { width: 30px; height: 30px; filter: drop-shadow(0 2px 0 rgba(0,0,0,.4)); }
.cr-gold.bump svg { animation: coinBump .18s ease-out; }
@keyframes coinBump { 50% { transform: scale(1.35); } }
.cr-floor { position: absolute; left: 50%; top: 616px; width: 360px; height: 70px; margin-left: -180px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.6), rgba(0,0,0,0)); }
.cr-chest { position: absolute; left: 90px; top: 356px; width: 300px; height: 290px; perspective: 760px; transform-origin: 50% 100%; }
.cr-chest.idle { animation: crBreath 2.6s ease-in-out infinite; }
@keyframes crBreath { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.012, .985); } }
.cr-chest.rattle { animation: crRattle .72s linear both; }
@keyframes crRattle {
  0% { transform: translate(0, 0) rotate(0); } 8% { transform: translate(-2px, 0) rotate(-.6deg); } 16% { transform: translate(2px, 0) rotate(.6deg); }
  24% { transform: translate(-3px, 1px) rotate(-1.2deg); } 32% { transform: translate(3px, -1px) rotate(1.2deg); } 40% { transform: translate(-5px, 1px) rotate(-2deg); }
  48% { transform: translate(5px, -1px) rotate(2deg); } 56% { transform: translate(-7px, 2px) rotate(-3deg); } 64% { transform: translate(7px, -2px) rotate(3deg); }
  72% { transform: translate(-9px, 2px) rotate(-4deg); } 80% { transform: translate(9px, -2px) rotate(4deg); } 88% { transform: translate(-10px, 3px) rotate(-5deg); }
  96% { transform: translate(10px, -3px) rotate(5deg); } 100% { transform: translate(0, 0) rotate(0); }
}
.cr-chest.kick { animation: crKick .5s cubic-bezier(.3,1.5,.5,1) both; }
@keyframes crKick { 0% { transform: translateY(0) scale(1, 1); } 30% { transform: translateY(-26px) scale(.94, 1.08); } 60% { transform: translateY(4px) scale(1.06, .94); } 100% { transform: translateY(0) scale(1, 1); } }
.cr-lid { position: absolute; left: 0; top: 0; width: 300px; height: 150px; transform-origin: 50% 100%; transform: rotateX(0); transition: transform .42s cubic-bezier(.3,1.35,.5,1); z-index: 3; }
.cr-lid svg, .cr-body svg, .cr-lock svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.cr-lock { position: absolute; left: 0; top: 150px; width: 300px; height: 140px; z-index: 4; pointer-events: none; }
#s-cr.cr-open .cr-lid { transform: rotateX(112deg); z-index: 0; }
/* the lid's underside, seen behind the body once it has swung back */
.cr-lidin { position: absolute; left: 20px; top: 96px; width: 260px; height: 60px; z-index: 1; opacity: 0; transform: translateY(30px) scaleY(.3); transform-origin: 50% 100%; transition: opacity .2s ease .18s, transform .45s cubic-bezier(.3,1.4,.5,1) .18s; }
.cr-lidin svg { position: absolute; inset: 0; width: 100%; height: 100%; }
#s-cr.cr-open .cr-lidin { opacity: 1; transform: none; }
.cr-body { position: absolute; left: 0; top: 150px; width: 300px; height: 140px; z-index: 2; }
.cr-seam { position: absolute; left: 40px; right: 64px; top: 150px; height: 6px; border-radius: 3px; background: #FFF0B0; box-shadow: 0 0 16px 8px rgba(255,222,120,.85); opacity: 0; z-index: 4; }
.cr-chest.rattle .cr-seam { animation: seamGlow .72s ease-in both; }
@keyframes seamGlow { 0% { opacity: 0; } 100% { opacity: 1; } }
.cr-mouth { position: absolute; left: 50%; top: 150px; width: 340px; height: 160px; margin-left: -170px; border-radius: 50%; filter: blur(8px); opacity: 0; z-index: 1;
  background: radial-gradient(closest-side, #FFF7CF 0%, rgba(255,214,90,.9) 30%, rgba(255,180,40,0) 100%); transition: opacity .3s ease, background .3s ease; }
#s-cr.cr-open .cr-mouth { opacity: 1; }
.cr-mouth.common { background: radial-gradient(closest-side, #FFFFFF 0%, rgba(210,225,240,.9) 30%, rgba(180,200,220,0) 100%); }
.cr-mouth.rare { background: radial-gradient(closest-side, #FFF0C8 0%, rgba(255,170,60,.95) 30%, rgba(255,140,20,0) 100%); }
.cr-mouth.epic { background: radial-gradient(closest-side, #F3DBFF 0%, rgba(190,90,255,.95) 30%, rgba(150,60,230,0) 100%); }
.cr-mouth.legendary { background: radial-gradient(closest-side, #FFFFFF 0%, rgba(255,214,90,.95) 25%, rgba(120,220,255,.6) 55%, rgba(255,120,220,0) 100%); }
.cr-flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 40; }
#s-cr.cr-open .cr-flash { animation: crFlash .55s ease-out; }
@keyframes crFlash { 0% { opacity: 1; } 100% { opacity: 0; } }
.cr-ring { position: absolute; left: 50%; top: 506px; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; border: 10px solid rgba(255,240,180,.95); opacity: 0; pointer-events: none; z-index: 6; }
#s-cr.cr-open .cr-ring { animation: crRing .6s cubic-bezier(.1,.7,.3,1) both; }
@keyframes crRing { 0% { opacity: 1; transform: scale(.3); } 100% { opacity: 0; transform: scale(9); border-width: 1px; } }
.cr-canvas { position: absolute; left: 0; top: 0; width: 480px; height: 1044px; pointer-events: none; z-index: 12; }
.cr-goldpop { position: absolute; top: 300px; left: 0; right: 0; text-align: center; font-size: 46px; display: flex; align-items: center; justify-content: center; gap: 12px; opacity: 0; z-index: 8; }
.cr-goldpop svg { width: 48px; height: 48px; filter: drop-shadow(0 3px 0 rgba(0,0,0,.4)); }
.cr-goldpop.on { animation: goldPop .55s cubic-bezier(.3,1.7,.5,1) both; }
.cr-goldpop.off { animation: goldOff .35s ease-in both; }
@keyframes goldPop { 0% { opacity: 0; transform: translateY(90px) scale(.3); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes goldOff { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translate(-150px, -190px) scale(.3); } }
/* the beam a card rides on */
.cr-beam { position: absolute; left: 50%; bottom: 520px; width: 150px; height: 620px; margin-left: -75px; opacity: 0; z-index: 5; pointer-events: none;

  <circle cx="31" cy="112" r="2.5" fill="#fff" opacity=".7"/><circle cx="221" cy="112" r="2.5" fill="#fff" opacity=".7"/>
</svg>`;
const CR_LOCK = `<svg viewBox="0 0 300 140"><defs>

    <linearGradient id="kGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFDC55"/><stop offset=".5" stop-color="#F2AE1F"/><stop offset="1" stop-color="#B9720E"/></linearGradient>
    <linearGradient id="kGoldD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D6931B"/><stop offset="1" stop-color="#8A5207"/></linearGradient>
    <linearGradient id="kGoldV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE06A"/><stop offset=".45" stop-color="#F2AE1F"/><stop offset="1" stop-color="#A9660A"/></linearGradient>
  </defs>
  <g transform="translate(137 8) scale(1.22) translate(-137 -8)">

  <path d="M102-30h70q7 0 8 7l6 58q1 7-5 11l-38 23q-6 3-12 0L93 46q-6-4-5-11l6-58q1-7 8-7Z" fill="url(#kGold)"/>
  <path d="M108-22h58q4 0 5 5l5 50q1 5-4 8l-31 19q-4 2-8 0L102 41q-5-3-4-8l5-50q1-5 5-5Z" fill="#F7BE2C"/>
  <path d="M108-22h58q4 0 5 5l2 19H101l2-19q1-5 5-5Z" fill="#FFD84A" opacity=".85"/>

  </g>
</svg>`;
const ICONS = {
  gem: GEM,
  heart: `<svg viewBox="0 0 100 100"><path d="M50 88C22 68 10 54 10 36c0-13 10-23 22-23 7 0 14 4 18 10 4-6 11-10 18-10 12 0 22 10 22 23 0 18-12 32-40 52Z" fill="#FF4B4B"/><path d="M28 30c-6 2-9 8-8 13" stroke="#FFB2B2" stroke-width="6" stroke-linecap="round" fill="none"/></svg>`,
  ice: `<svg viewBox="0 0 100 100"><g stroke="#5FD1FF" stroke-width="9" stroke-linecap="round" fill="none"><path d="M50 8v84M14 29l72 42M14 71l72-42"/><path d="M50 8l-10 12M50 8l10 12M50 92l-10-12M50 92l10-12M14 29l15-2M14 29l2 15M86 71l-15 2M86 71l-2-15M14 71l15 2M14 71l2-15M86 29l-15-2M86 29l-2 15"/></g><circle cx="50" cy="50" r="9" fill="#DDF4FF"/></svg>`,
  bolt: `<svg viewBox="0 0 100 100"><path d="M58 6 18 58h24l-8 36 44-56H54Z" fill="#FFC800" stroke="#E6A000" stroke-width="5" stroke-linejoin="round"/><path d="M52 16 30 46h14" stroke="#FFF1B0" stroke-width="5" stroke-linecap="round" fill="none"/></svg>`
};
const CR_CARDS = [
  { r: "common", c: "#C3CFDD", name: "جواهر", n: 50, icon: "gem" },
  { r: "rare", c: "#FF9F1C", name: "قلب إضافي", n: 1, icon: "heart" },
  { r: "epic", c: "#B14CFF", name: "تجميد الوقت", n: 2, icon: "ice" },
  { r: "legendary", c: "#FFD24D", name: "تعزيز ×٢", n: 1, icon: "bolt" }
];
const CR_GOLD = 350;
$$("svg[data-coin]").forEach(e => { e.outerHTML = COIN; });

const crEl = $("#s-cr"), crChest = $(".cr-chest", crEl), crMouth = $(".cr-mouth", crEl), crPrompt = $(".cr-prompt", crEl),
      crGold = $(".cr-gold", crEl), crGoldNum = $(".cr-gold .num", crEl), crGoldPop = $(".cr-goldpop", crEl), crCards = $(".cr-cards", crEl),
      crName = $(".cr-cardname", crEl), crBeam = $(".cr-beam", crEl), crRays = $(".cr-crays", crEl), crOk = $(".cr-ok", crEl), crTitle = $(".cr-title", crEl),
      crCv = $(".cr-canvas", crEl), crCtx = crCv.getContext("2d");
crCtx.scale(2, 2);
$(".cr-lid", crEl).innerHTML = CR_LID; $(".cr-body", crEl).innerHTML = CR_BODY; $(".cr-lock", crEl).innerHTML = CR_LOCK;
$(".cr-lidin", crEl).innerHTML = `<svg viewBox="0 0 260 70"><path d="M4 70V40Q4 2 42 2h176q38 0 38 38v30Z" fill="#B9720E"/><path d="M12 70V42Q12 10 44 10h172q32 0 32 32v28Z" fill="#0E5478"/><path d="M22 70V44Q22 20 46 20h168q24 0 24 24v26Z" fill="#146C97"/><path d="M4 60h252v10H4Z" fill="#F2AE1F"/></svg>`;

const cr = { stage: "off", idx: 0, gold: 0, parts: [], raf: 0, timer: 0, last: 0, coinsLeft: 0 };
const crTimers = [];
const later = (fn, ms) => { const id = setTimeout(fn, ms); crTimers.push(id); return id; };

function showCR() {
  crTimers.forEach(clearTimeout); crTimers.length = 0;
  cr.stage = "idle"; cr.idx = 0; cr.gold = 0; cr.parts = []; cr.coinsLeft = 0;
  crEl.classList.remove("cr-open", "jolt"); crChest.className = "cr-chest idle";
  crMouth.className = "cr-mouth"; crGoldNum.textContent = "٠"; crGoldPop.className = "cr-goldpop";
  crCards.innerHTML = ""; crName.className = "cr-cardname"; crBeam.className = "cr-beam"; crRays.className = "cr-crays";
  crOk.className = "cr-ok"; crTitle.style.opacity = 1; crPrompt.textContent = "اضغط للفتح"; crPrompt.classList.add("on");
  $$(".cr-slot", crEl).forEach(sl => { sl.innerHTML = ""; });
  crCtx.clearRect(0, 0, 480, 1044);
  cancelAnimationFrame(cr.raf); cr.last = now(); cr.raf = requestAnimationFrame(crLoop);
}
function stopCR() { cr.stage = "off"; cancelAnimationFrame(cr.raf); crTimers.forEach(clearTimeout); crTimers.length = 0; }

/* ---- particles: sparks, coins, confetti on one canvas ---- */
function spark(x, y, n, colors, speed, gravity, life) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, Math.PI * 2), v = rnd(speed * .35, speed);
    cr.parts.push({ t: "spark", x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - speed * .25, g: gravity, life, age: 0, r: rnd(2.5, 6), c: colors[Math.floor(Math.random() * colors.length)], star: Math.random() < .4, rot: rnd(0, 6.3) });
  }
}
function coin(delay) {
  const sx = 240 + rnd(-40, 40), sy = 496;
  cr.parts.push({ t: "coin", x: sx, y: sy, sx, sy, tx: 40, ty: 94, cx: rnd(60, 200), cy: rnd(120, 240), age: -delay, life: .75, r: 13 });
}
function crLoop() {
  if (cr.stage === "off") return;
  const t = now(), dt = Math.min(.05, t - cr.last); cr.last = t;
  crCtx.clearRect(0, 0, 480, 1044);
  const keep = [];
  for (const p of cr.parts) {
    p.age += dt;
    if (p.age < 0) { keep.push(p); continue; }
    if (p.t === "spark") {
      p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += dt * 6;
      const k = 1 - p.age / p.life; if (k <= 0) continue;
      crCtx.globalAlpha = Math.min(1, k * 1.6); crCtx.fillStyle = p.c;
      if (p.star) { crCtx.save(); crCtx.translate(p.x, p.y); crCtx.rotate(p.rot); const r = p.r * 2.2 * k + 1; crCtx.beginPath(); crCtx.moveTo(0, -r); crCtx.quadraticCurveTo(0, 0, r, 0); crCtx.quadraticCurveTo(0, 0, 0, r); crCtx.quadraticCurveTo(0, 0, -r, 0); crCtx.quadraticCurveTo(0, 0, 0, -r); crCtx.fill(); crCtx.restore(); }
      else { crCtx.beginPath(); crCtx.arc(p.x, p.y, p.r * k + .5, 0, 6.3); crCtx.fill(); }
      keep.push(p);
    } else if (p.t === "coin") {
      const u = p.age / p.life;
      if (u >= 1) { cr.gold += CR_GOLD / 14; crGoldNum.textContent = toAr(Math.round(cr.gold)); crGold.classList.remove("bump"); void crGold.offsetWidth; crGold.classList.add("bump"); Snd.clink(); spark(p.tx, p.ty, 4, ["#FFE07A", "#fff"], 120, 300, .35); continue; }
      const e = u * u * (3 - 2 * u), m = 1 - e;
      p.x = m * m * p.sx + 2 * m * e * p.cx + e * e * p.tx; p.y = m * m * p.sy + 2 * m * e * p.cy + e * e * p.ty;
      const sq = Math.abs(Math.cos(p.age * 14)) * .7 + .3;
      crCtx.globalAlpha = 1; crCtx.fillStyle = "#C98E1C"; crCtx.beginPath(); crCtx.ellipse(p.x, p.y + 1.5, p.r * sq, p.r, 0, 0, 6.3); crCtx.fill();
      crCtx.fillStyle = "#FFD75A"; crCtx.beginPath(); crCtx.ellipse(p.x, p.y, p.r * sq, p.r, 0, 0, 6.3); crCtx.fill();
      crCtx.fillStyle = "#E5B33A"; crCtx.beginPath(); crCtx.ellipse(p.x, p.y, p.r * sq * .55, p.r * .55, 0, 0, 6.3); crCtx.fill();
      keep.push(p);
    }
  }
  cr.parts = keep; crCtx.globalAlpha = 1;
  cr.raf = requestAnimationFrame(crLoop);
}

/* ---- the sequence ---- */
function crTap() {
  if (cr.stage === "idle") { crOpen(); }
  else if (cr.stage === "card") { crNextCard(); }
}
function crOpen() {
  cr.stage = "opening"; crPrompt.classList.remove("on"); crTitle.style.opacity = 0;
  crChest.className = "cr-chest rattle"; Snd.rumble();
  later(() => {
    crEl.classList.add("cr-open", "jolt"); crChest.className = "cr-chest kick"; Snd.boom();
    spark(240, 506, 34, ["#FFE07A", "#FFD75A", "#FFF7CF", "#fff"], 620, 900, 1.1);
    spark(240, 506, 18, ["#FFF", "#FFF0B0"], 260, 500, .7);
    later(() => crEl.classList.remove("jolt"), 450);
    later(crGoldPhase, 380);
  }, 720);
}
function crGoldPhase() {
  cr.stage = "gold";
  crGoldPop.querySelector("span").textContent = "×" + toAr(CR_GOLD); crGoldPop.className = "cr-goldpop on"; Snd.goldPop();
  later(() => { crGoldPop.className = "cr-goldpop off"; for (let i = 0; i < 14; i++) coin(i * .045); }, 650);
  later(() => crCard(0), 1900);
}
function crCard(i) {
  cr.idx = i; const c = CR_CARDS[i];
  crCards.innerHTML = ""; crName.className = "cr-cardname"; crRays.className = "cr-crays"; crBeam.className = "cr-beam"; crPrompt.classList.remove("on");
  crMouth.className = "cr-mouth " + c.r;
  const rise = () => {
    cr.stage = "rising";
    crBeam.style.setProperty("--rc", c.c); crBeam.classList.add("on"); Snd.whoosh();
    const card = document.createElement("div"); card.className = "cr-card rise"; card.style.setProperty("--rc", c.c);
    card.innerHTML = `<div class="cr-back"><b>ق</b></div><div class="cr-face ${c.r}"><span class="ic">${ICONS[c.icon]}</span></div><span class="cr-count">×${toAr(c.n)}</span>`;
    crCards.appendChild(card);
    later(() => {
      card.className = "cr-card flip"; crRays.style.setProperty("--rc", c.c); crRays.className = "cr-crays on " + c.r; Snd.reveal(i);
      spark(240, 395, c.r === "legendary" ? 40 : 14 + i * 6, c.r === "legendary" ? ["#FF5E5E", "#FFD24D", "#5CFF8E", "#4DC9FF", "#C24DFF", "#fff"] : [c.c, "#fff"], c.r === "legendary" ? 520 : 300 + i * 60, 420, .9);
      if (c.r === "legendary") { crEl.classList.add("jolt"); later(() => crEl.classList.remove("jolt"), 450); }
      later(() => { card.className = "cr-card shown"; crName.textContent = c.name; crName.className = "cr-cardname on"; crPrompt.textContent = "اضغط للمتابعة"; crPrompt.classList.add("on"); cr.stage = "card"; cr.timer = later(crNextCard, 1500); }, 320);
    }, 480);
  };
  if (c.r === "legendary" || c.r === "epic") { crChest.className = "cr-chest rattle"; Snd.rumble(); later(rise, c.r === "legendary" ? 760 : 500); }
  else rise();
}
function crNextCard() {
  if (cr.stage !== "card") return;
  clearTimeout(cr.timer); cr.stage = "docking";
  const i = cr.idx, card = crCards.querySelector(".cr-card"), slots = $$(".cr-slot", crEl), slot = slots[i];
  const sr = slot.getBoundingClientRect(), cr0 = card.getBoundingClientRect(), k = 480 / stage.getBoundingClientRect().width;
  card.style.setProperty("--dx", ((sr.left + sr.width / 2 - (cr0.left + cr0.width / 2)) * k).toFixed(0) + "px");
  card.style.setProperty("--dy", ((sr.top + sr.height / 2 - (cr0.top + cr0.height / 2)) * k).toFixed(0) + "px");
  card.className = "cr-card dock"; crName.className = "cr-cardname"; crRays.className = "cr-crays"; crBeam.className = "cr-beam"; crPrompt.classList.remove("on");
  later(() => {
    slot.innerHTML = `<div class="cr-card shown" style="--rc:${CR_CARDS[i].c};position:relative;left:auto;top:auto;width:150px;height:190px;transform:scale(.54);transform-origin:0 0;margin:-1px 0 0 -1px;opacity:1">${card.innerHTML}</div>`;
    slot.style.borderStyle = "solid"; slot.style.overflow = "visible";
    crCards.innerHTML = "";
    if (i + 1 < CR_CARDS.length) crCard(i + 1);
    else { cr.stage = "done"; crMouth.className = "cr-mouth"; crOk.className = "cr-ok on"; Snd.gems(); }
  }, 430);
}
crEl.addEventListener("pointerdown", e => { if (e.target.closest(".cr-ok") || e.target.closest("#mute")) return; crTap(); });
crOk.addEventListener("click", () => { stopCR(); go($("#s-start")); });

/* ---- deep links for screenshots: #common #rare #open #reward #reward12 ---- */
const h = location.hash.slice(1);
if (h === "common" || h === "rare") { chestEl.classList.add("on"); $("#s-start").classList.remove("on"); cur = chestEl; showChest(h); setBg(chestEl); }
else if (h === "open") { chestEl.classList.add("on"); $("#s-start").classList.remove("on"); cur = chestEl; showChest("common"); ch.taps = 3; dotsRow.classList.add("hide"); setTimeout(openChest, 300); }
else if (h === "reward" || h === "reward12") { ch.kind = h === "reward12" ? "rare" : "common"; $("#s-start").classList.remove("on"); showReward(); }
else if (h === "cr" || h === "autocr") {
  crEl.classList.add("on"); $("#s-start").classList.remove("on"); cur = crEl; setBg(crEl); showCR();
  if (h === "autocr") { setTimeout(crTap, 1000); [5.2, 7.4, 9.9, 13.0].forEach(t => setTimeout(crTap, t * 1000)); }
}
else if (h === "auto" || h === "autorare") {
  /* scripted run for frame captures: three taps a second apart, then press and release */
  chestEl.classList.add("on"); $("#s-start").classList.remove("on"); cur = chestEl; showChest(h === "auto" ? "common" : "rare"); setBg(chestEl);
  [1.0, 1.9, 2.7].forEach(t => setTimeout(tap, t * 1000));
  setTimeout(() => { ch.pressed = true; ttl.classList.add("hide"); }, 3600);
