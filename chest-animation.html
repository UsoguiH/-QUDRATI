<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فتح الصندوق — أربع درجات</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Chest opening in four tiers. The first («عادي») is the Duolingo
   monthly-challenge chest rebuilt frame-by-frame from "chest
   animation.mp4" (480×1044); the other three share its grammar but
   own their design, their ceremony and their surprise.
   Every coordinate is in that 480×1044 reference frame; #stage is
   scaled uniformly to fit whatever viewport opens it.
   ============================================================ */
:root {
  --snow: #FCFCFC; --macaw: #1CB0F6; --macaw-dk: #1899D6; --sky: #54C4FC;
  --eel: #4B4B4B; --line: #E5E5E5;
  --wood: #C87800; --tan: #ECC898;
  --font: 'Baloo Bhaijaan 2', 'Segoe UI', Tahoma, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  background: var(--snow); font-family: var(--font); color: var(--eel);
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
  transition: background .32s ease;
}
#viewport { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
#stage { position: relative; width: 480px; height: 1044px; overflow: hidden; flex-shrink: 0; transform-origin: 50% 50%; }

/* ---- screens: Android-style push, new one slides in from the right ---- */
.scr { position: absolute; inset: 0; background: var(--snow); transform: translateX(100%); visibility: hidden; }
.scr.on { transform: none; visibility: visible; }
.scr.push-in  { visibility: visible; animation: pushIn  .32s cubic-bezier(.2,.7,.2,1) both; }
.scr.push-out { visibility: visible; animation: pushOut .32s cubic-bezier(.2,.7,.2,1) both; }
@keyframes pushIn  { from { transform: translateX(100%); } to { transform: none; } }
@keyframes pushOut { from { transform: none; } to { transform: translateX(-100%); } }

h1, h2, h3, p { margin: 0; }
button { font-family: var(--font); cursor: pointer; border: 0; background: none; padding: 0; color: inherit; }

/* Duolingo's 3D button: face + 4px lip */
.btn {
  display: block; width: 440px; height: 56px; margin: 0 auto; border-radius: 16px;
  background: var(--macaw); color: #fff; font-size: 17px; font-weight: 700;
  box-shadow: 0 4px 0 var(--macaw-dk); transition: transform .06s, box-shadow .06s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--macaw-dk); }

/* ============================================================
   Start screen — the monthly-challenge card the video begins on
   ============================================================ */
#s-start .qtitle { position: absolute; top: 150px; left: 0; right: 0; text-align: center; font-size: 26px; font-weight: 800; color: var(--macaw); }
.card { position: absolute; left: 20px; right: 20px; border: 2px solid var(--line); border-radius: 16px; background: #fff; }
#s-start .quests { top: 232px; }
.qrow { display: flex; align-items: center; gap: 14px; padding: 16px 16px; border-bottom: 2px solid var(--line); }
.qrow:last-child { border-bottom: 0; }
.qrow svg { width: 56px; height: 52px; flex-shrink: 0; overflow: visible; }
.qrow .qtxt { flex: 1; }
.qrow b { display: block; font-size: 16px; font-weight: 700; margin-bottom: 8px; }
.bar { position: relative; height: 18px; border-radius: 9px; background: var(--line); overflow: hidden; }
.bar i { position: absolute; top: 0; bottom: 0; right: 0; border-radius: 9px; background: var(--macaw); }
.bar i::after { content: ""; position: absolute; top: 4px; left: 8px; right: 8px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.35); }
.bar span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; }
.bar.low span { color: #AFAFAF; }
#s-start .month { top: 712px; height: 128px; display: flex; align-items: center; gap: 16px; padding: 0 16px; }
.avatar { width: 84px; height: 84px; border-radius: 50%; border: 3px solid var(--macaw); background: #DDF4FF; display: flex; align-items: center; justify-content: center; }
.avatar svg { width: 46px; height: 46px; }
.month b { display: block; font-size: 17px; margin-bottom: 4px; }
.month span { color: var(--macaw); font-weight: 700; font-size: 15px; }
#s-start .btn { position: absolute; bottom: 84px; left: 20px; }

/* ============================================================
   Chest screen — one set of tokens per tier, nothing else keyed on the tier
   ============================================================ */
#s-chest {
  cursor: pointer;
  --bg: var(--snow); --plate: #E4E4E4; --ttl: var(--wood); --cap: var(--eel);
  --dot: var(--tan); --dot-live: var(--wood); --dot-arrow: #fff; --dot-sh: #E4E4E1;
  --cone: 255,240,190; --cone-a: .5; --halo: transparent; --flash: #fff; --prize: rgba(255,255,255,.9);
}
#s-chest.t-rare {
  --bg: #54C4FC; --plate: #3FAEF0; --ttl: #fff; --cap: #fff;
  --dot: #2494E4; --dot-live: #fff; --dot-arrow: #1CB0F6; --dot-sh: #3EAFF0;
  --cone: 255,255,255; --cone-a: .92; --flash: #fff;
}
#s-chest.t-epic {
  --bg: #8B5CF6; --plate: #6B3DD9; --ttl: #FFD54A; --cap: #fff;
  --dot: #6B3DD9; --dot-live: #FFC800; --dot-arrow: #5B21B6; --dot-sh: #6A3BD0;
  --cone: 255,230,160; --cone-a: .9; --halo: rgba(255,213,74,.5); --flash: #F3E8FF; --prize: rgba(255,225,140,.95);
}
#s-chest.t-legendary {
  --bg: #FF9600; --plate: #E07F00; --ttl: #fff; --cap: #fff;
  --dot: #D97800; --dot-live: #fff; --dot-arrow: #FF9600; --dot-sh: #DE7E00;
  --cone: 255,236,170; --cone-a: 1; --halo: rgba(255,240,180,.6); --flash: #FFF1C2; --prize: rgba(255,240,180,1);
}
#s-chest { background: var(--bg); transition: background .32s ease; }
/* a lightning flicker lights the chest itself, never the room */
.flicker .chestwrap { filter: brightness(1.5); }
.c3 .box, .cracking .box { animation: innerGlow .36s ease-in-out infinite alternate; }
/* the ruby is the chest's heart: it beats, and races with every tap; the crown on the lid hops on each tap */
.jewel { transform-box: fill-box; transform-origin: center; }
.t-legendary .jewel { animation: heartbeat var(--hb, 1.4s) ease-in-out infinite; filter: drop-shadow(0 0 var(--hg, 0px) #FF4D6D); }
#s-chest.c1 { --hb: 1s; --hg: 4px; } #s-chest.c2 { --hb: .66s; --hg: 8px; } #s-chest.c3 { --hb: .4s; --hg: 14px; }
@keyframes heartbeat { 0%, 100% { transform: scale(1); } 14% { transform: scale(1.22); } 28% { transform: scale(1); } 42% { transform: scale(1.12); } 56% { transform: scale(1); } }
.crownArt { transform-box: fill-box; transform-origin: 50% 100%; }
.tapped .crownArt { animation: crownPop .45s cubic-bezier(.3,1.6,.5,1); }
@keyframes crownPop { 0% { transform: scale(1) rotate(0); } 40% { transform: scale(1.3,.8) rotate(-9deg); } 70% { transform: scale(.92,1.14) rotate(5deg); } 100% { transform: scale(1) rotate(0); } }
@keyframes innerGlow { from { filter: brightness(1); } to { filter: brightness(1.4) drop-shadow(0 0 16px rgba(255,220,120,.9)); } }
.slam {
  position: absolute; top: 640px; left: 0; right: 0; text-align: center; font-size: 50px; font-weight: 800; line-height: 1.2;
  color: #FFF4CC; text-shadow: 0 5px 0 #D97800; opacity: 0; transform: scale(.3) rotate(-6deg); z-index: 6; pointer-events: none;
}
.slam.go { animation: slamIn .6s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes slamIn { 0% { opacity: 0; transform: scale(.3) rotate(-9deg); } 100% { opacity: 1; transform: scale(1) rotate(-3deg); } }
.t-legendary .flash.go { animation-duration: .85s; }
.ttl {
  position: absolute; top: 222px; left: 0; right: 0; text-align: center;
  font-size: 26px; font-weight: 800; color: var(--ttl); line-height: 1.2;
  transition: opacity .22s ease;
}
.ttl.hide { opacity: 0; }

/* the chest lives in a 260×290 box; its plate's bottom is the floor */
.chestwrap { position: absolute; left: 110px; top: 285px; width: 260px; height: 290px; z-index: 2; }
.body { position: absolute; inset: 0; transform-origin: 50% 98%; will-change: transform; }
.plate { position: absolute; left: 15px; top: 235px; width: 232px; height: 46px; border-radius: 14px; background: var(--plate); transform-origin: 50% 50%; }
.t-rare .plate, .t-epic .plate, .t-legendary .plate { left: 12px; top: 222px; width: 236px; height: 63px; border-radius: 16px; }
.box { position: absolute; inset: 0; will-change: transform; }
.box svg { position: absolute; left: 0; top: 0; width: 260px; height: 290px; overflow: visible; }
.box svg.open { display: none; }
.opened .box svg.closed { display: none; }
.opened .box svg.open { display: block; }
/* launch: the lid flies off the closed art while the open base shows underneath */
.launch .box svg.open { display: block; }
.launch .box svg.closed { display: block; z-index: 3; }
.launch .box svg.closed .base { display: none; }
.box svg .lid { transform-box: view-box; transform-origin: 130px 180px; }
.t-epic.launch .box svg.closed .lid { animation: lidDrift .85s cubic-bezier(.2,.5,.3,1) forwards; }
.t-legendary.launch .box svg.closed .lid { animation: lidBlast 1.7s linear forwards; }
@keyframes lidDrift {
  0%   { transform: translate(0,0) rotate(0); opacity: 1; }
  18%  { transform: translate(-6px,-90px) rotate(-10deg); opacity: 1; }
  85%  { opacity: 1; }
  100% { transform: translate(-150px,-640px) rotate(-70deg); opacity: 0; }
}
@keyframes lidBlast {
  0%   { transform: translate(0,0) rotate(0) scale(1); animation-timing-function: cubic-bezier(.1,.7,.3,1); }
  32%  { transform: translate(80px,-860px) rotate(200deg) scale(1); animation-timing-function: cubic-bezier(.5,0,.8,.4); }
  72%  { transform: translate(30px,470px) rotate(352deg) scale(1.1,.86); animation-timing-function: cubic-bezier(.2,.8,.4,1); }
  80%  { transform: translate(30px,428px) rotate(356deg) scale(1); animation-timing-function: cubic-bezier(.5,0,.8,.4); }
  88%  { transform: translate(30px,470px) rotate(358deg) scale(1.04,.95); animation-timing-function: cubic-bezier(.2,.8,.4,1); }
  93%  { transform: translate(30px,458px) rotate(359deg) scale(1); animation-timing-function: cubic-bezier(.5,0,.8,.4); }
  100% { transform: translate(30px,470px) rotate(360deg) scale(1); }
}

/* a soft light spill on the floor under the higher tiers */
.halo {
  position: absolute; left: 130px; top: 262px; width: 320px; height: 100px; transform: translate(-50%,-50%);
  border-radius: 50%; background: radial-gradient(closest-side, var(--halo), transparent); opacity: 0; pointer-events: none; z-index: 0;
  transition: opacity .4s ease;
}
.t-epic .halo, .t-legendary .halo { opacity: .8; animation: haloBreathe 2.2s ease-in-out infinite; }
.c2 .halo { opacity: .6; --hs: 1.15; }
.c3 .halo { opacity: .9; --hs: 1.35; animation: haloBreathe .8s ease-in-out infinite; }
.cracking .halo { opacity: 1; --hs: 1.6; animation: haloBreathe .45s ease-in-out infinite; }
@keyframes haloBreathe { 0%, 100% { transform: translate(-50%,-50%) scale(var(--hs, 1)); } 50% { transform: translate(-50%,-50%) scale(calc(var(--hs, 1) * 1.14)); } }

/* glossy sweep across the chest silhouette on every tap (rare and up) */
.sheen { position: absolute; inset: 0; clip-path: path(var(--sil)); pointer-events: none; }
.sheen i {
  position: absolute; top: -60px; bottom: -60px; left: -110px; width: 80px; transform: skewX(-18deg);
  background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.62) 50%, rgba(255,255,255,0));
}
.sheen.go i { animation: sheenGo .5s cubic-bezier(.3,.5,.3,1) both; }
@keyframes sheenGo { from { left: -110px; } to { left: 320px; } }

/* light pouring out of the open chest: a soft pool at the mouth + a cone */
.glow {
  position: absolute; left: 130px; top: 150px; width: 320px; height: 240px; transform: translate(-50%,-50%);
  background: radial-gradient(closest-side, rgba(255,255,255,.95), rgba(255,255,255,.55) 42%, rgba(255,255,255,0) 100%);
  opacity: 0; pointer-events: none; z-index: 3;
}
.cone {
  position: absolute; left: 130px; bottom: 130px; width: 380px; height: 560px; transform: translateX(-50%);
  clip-path: polygon(32% 100%, 68% 100%, 100% 0, 0 0);
  background: linear-gradient(to top, rgba(var(--cone),var(--cone-a)), rgba(var(--cone),calc(var(--cone-a) * .44)) 40%, rgba(var(--cone),0) 100%);
  opacity: 0; pointer-events: none; z-index: 1;
}
.lit .glow { animation: glowIn .25s ease-out forwards; }
.lit .cone { animation: coneIn .3s ease-out forwards, conePulse 1.1s ease-in-out .3s infinite; }
@keyframes glowIn { to { opacity: 1; } }
@keyframes coneIn { to { opacity: 1; } }
@keyframes conePulse { 0%, 100% { opacity: 1; } 50% { opacity: .78; } }

/* legendary only: gold light cracks through the seams while the lights are out */
.cracks path, .floorcracks path { fill: none; stroke: #FFE680; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0; filter: drop-shadow(0 0 6px #FFD54A) drop-shadow(0 0 14px rgba(255,180,60,.7)); }
/* the legendary cracks a stage further on each tap (.c1 .c2 .c3); the release (.cracking) opens every seam */
.c1 .cracks path.s1, .c2 .cracks path.s2, .c3 .cracks path.s3, .c3 .floorcracks path,
.cracking .box .cracks path, .cracking .floorcracks path { opacity: 1; animation: crackGrow .55s ease-out var(--o) forwards, crackPulse .22s ease-in-out calc(var(--o) + .55s) infinite alternate; }
@keyframes crackGrow { to { stroke-dashoffset: 0; } }
@keyframes crackPulse { from { stroke-width: 3; stroke: #FFE680; } to { stroke-width: 6; stroke: #FFFBE0; } }
.floorcracks { position: absolute; left: 0; top: 0; width: 260px; height: 290px; overflow: visible; z-index: 0; pointer-events: none; }
.rays { position: absolute; left: 130px; top: 182px; width: 0; height: 0; pointer-events: none; z-index: 2; opacity: 0; }
.ray {
  position: absolute; left: -9px; top: -600px; width: 18px; height: 600px; transform-origin: 50% 100%;
  transform: rotate(var(--a)) scaleY(0);
  background: linear-gradient(to top, rgba(255,232,140,1), rgba(255,232,140,.45) 45%, rgba(255,232,140,0));
}
.c2 .rays, .c3 .rays, .cracking .rays { opacity: 1; animation: raysSway 1.1s ease-in-out infinite alternate; }
@keyframes raysSway { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
.c2 .ray, .c3 .ray, .cracking .ray { animation: rayGrow .8s cubic-bezier(.2,.8,.3,1) var(--o) forwards, rayFlicker .12s ease-in-out calc(var(--o) + .8s) infinite alternate; }
@keyframes rayGrow { to { transform: rotate(var(--a)) scaleY(var(--len, 1)); } }
#s-chest.c2 { --len: .4; } #s-chest.c3 { --len: .72; } #s-chest.cracking { --len: 1; }
@keyframes rayFlicker { from { opacity: 1; } to { opacity: .7; } }

/* idle sparkles ringing the chest (4-point stars + tiny dots) */
.sparks { position: absolute; inset: 0; pointer-events: none; z-index: 1; transition: opacity .35s ease; }
.sp { position: absolute; width: var(--s); height: var(--s); margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2); opacity: 0; animation: twinkle var(--d) ease-in-out var(--o) infinite; }
.sp svg { display: block; width: 100%; height: 100%; }
.sp.dot { border-radius: 50%; background: #fff; }
@keyframes twinkle {
  0%, 100% { opacity: 0; transform: scale(.25) rotate(-12deg) translateY(4px); }
  45%      { opacity: 1; transform: scale(1) rotate(8deg) translateY(-2px); }
  70%      { opacity: .9; transform: scale(.92) rotate(14deg) translateY(-6px); }
}

/* burst stars, rising motes, flying gems and the prize (spawned by JS into .fx) */
.fx { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
.burst { position: absolute; width: var(--s, 34px); height: var(--s, 34px); margin: calc(var(--s, 34px) / -2) 0 0 calc(var(--s, 34px) / -2); animation: burstPop .46s cubic-bezier(.2,.8,.3,1) var(--o) both; }
.burst svg { display: block; width: 100%; height: 100%; }
@keyframes burstPop {
  0%   { opacity: 0; transform: translate(0,0) scale(0) rotate(0); }
  35%  { opacity: 1; transform: translate(calc(var(--dx) * .7), calc(var(--dy) * .7)) scale(1.25) rotate(20deg); }
  100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.4) rotate(45deg); }
}
.mote { position: absolute; width: 10px; height: 26px; margin: -13px 0 0 -5px; animation: moteRise var(--d) cubic-bezier(.15,.7,.3,1) both; }
.mote svg { display: block; width: 100%; height: 100%; }
@keyframes moteRise {
  0%   { opacity: 0; transform: translateY(0) scale(.5); }
  12%  { opacity: 1; transform: translateY(calc(var(--dy) * .12)) scale(1); }
  75%  { opacity: .9; }
  100% { opacity: 0; transform: translateY(var(--dy)) scale(.55); }
}
.fgem { position: absolute; left: 0; top: 0; width: 64px; height: 64px; margin: -32px 0 0 -32px; will-change: transform; }
.fgem svg { display: block; width: 100%; height: 100%; }
.prize { position: absolute; left: 130px; top: 150px; width: 170px; height: 170px; margin: -85px 0 0 -85px; z-index: 6; will-change: transform; transform: scale(0); }
.prize::before { content: ""; position: absolute; inset: -60px; border-radius: 50%; background: radial-gradient(closest-side, var(--prize), transparent 72%); animation: prizeGlow .5s ease-in-out infinite alternate; }
@keyframes prizeGlow { from { transform: scale(1); opacity: .85; } to { transform: scale(1.2); opacity: 1; } }
.prize svg { position: relative; display: block; width: 100%; height: 100%; }

/* the comet arc that orbits the chest on every tap */
.arc { position: absolute; left: 0; top: 0; width: 480px; height: 1044px; pointer-events: none; z-index: 5; }

/* a full-screen light flash and a screen kick for the bigger moments */
.flash { position: absolute; inset: 0; background: var(--flash); opacity: 0; pointer-events: none; z-index: 7; }
.flash.go { animation: flashGo .55s ease-out both; }
@keyframes flashGo { 0% { opacity: 0; } 10% { opacity: .96; } 100% { opacity: 0; } }
#s-chest.kick { animation: kick .3s cubic-bezier(.2,.9,.3,1) both; }
#s-chest.kick.big { animation: kickBig .42s cubic-bezier(.2,.9,.3,1) both; }
@keyframes kick { 0% { transform: none; } 30% { transform: scale(1.018) translateY(-3px); } 100% { transform: none; } }
@keyframes kickBig { 0% { transform: none; } 20% { transform: scale(1.035) translateY(-6px); } 45% { transform: scale(1.01) translateY(2px); } 100% { transform: none; } }

/* three chances: pale discs with an arrow; the live one is dark and hovers over its shadow */
.dots { position: absolute; top: 676px; left: 0; right: 0; height: 70px; display: flex; justify-content: center; gap: 38px; transition: opacity .28s ease; }
.dots.hide { opacity: 0; }
.dot { position: relative; width: 44px; height: 44px; }
.dot i {
  position: absolute; inset: 0; border-radius: 50%; background: var(--dot);
  display: flex; align-items: center; justify-content: center;
  transition: background .12s ease;
}
.dot i svg { width: 22px; height: 22px; }
.dot i svg path { stroke: var(--dot-arrow); }
.dot .sh { position: absolute; left: 9px; right: 9px; bottom: -14px; height: 8px; border-radius: 50%; background: var(--dot-sh); opacity: 0; transition: opacity .15s; }
.dot.active i { background: var(--dot-live); animation: dotBob 1.1s ease-in-out infinite; }
.dot.active .sh { opacity: 1; animation: dotShade 1.1s ease-in-out infinite; }
.dot.active.pop i { animation: dotPop .18s cubic-bezier(.3,1.6,.5,1), dotBob 1.1s ease-in-out .18s infinite; }
.dot.used i svg { display: none; }
@keyframes dotBob   { 0%, 100% { transform: translateY(-8px); } 50% { transform: translateY(-11px); } }
@keyframes dotShade { 0%, 100% { transform: scaleX(1); opacity: 1; } 50% { transform: scaleX(.85); opacity: .8; } }
@keyframes dotPop   { 0% { transform: translateY(-8px) scale(.7); } 100% { transform: translateY(-8px) scale(1); } }

.cap { position: absolute; top: 782px; left: 0; right: 0; height: 40px; text-align: center; font-size: 20px; font-weight: 700; color: var(--cap); transition: opacity .25s ease; }
.cap span { position: absolute; left: 0; right: 0; top: 0; transition: opacity .16s ease; }
.cap span.hide { opacity: 0; }

/* the white wash that sweeps down over the open chest */
.wash {
  position: absolute; left: 0; right: 0; top: 0; height: 1044px; pointer-events: none; z-index: 8;
  background: linear-gradient(to bottom, #fff 0%, #fff 62%, rgba(255,255,255,0) 100%);
  transform: translateY(-110%);
}
.wash.go { transition: transform .45s linear; transform: translateY(0); }

/* ============================================================
   Reward screen — the pile of gems
   ============================================================ */
#s-palette .ptitle { position: absolute; top: 64px; left: 0; right: 0; text-align: center; font-size: 24px; font-weight: 800; color: var(--eel); }
#s-palette .psub { position: absolute; top: 104px; left: 0; right: 0; text-align: center; font-size: 15px; font-weight: 600; color: #AFAFAF; }
#s-palette { overflow-y: auto; }
.pal { position: absolute; top: 150px; left: 20px; right: 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding-bottom: 40px; }
.pcard { border: 2px solid var(--line); border-radius: 16px; background: #fff; padding: 12px 6px 10px; text-align: center; cursor: pointer; transition: transform .12s; }
.pcard:hover { transform: translateY(-2px); }
.pcard.cur { border-color: var(--macaw); box-shadow: 0 0 0 2px var(--macaw) inset; }
.pcard svg { width: 100px; height: 112px; display: block; margin: 0 auto 6px; overflow: visible; }
.pcard b { display: block; font-size: 15px; font-weight: 800; color: var(--ttl-c); }
.pcard span { font-size: 12px; font-weight: 700; color: #AFAFAF; }
#s-reward { background: var(--snow); --stamp: var(--macaw); }
#s-reward.t-rare { --stamp: #1CB0F6; }
#s-reward.t-epic { --stamp: #8B5CF6; }
#s-reward.t-legendary { --stamp: #FF9600; }
.counter { position: absolute; top: 82px; left: 22px; display: flex; align-items: center; gap: 6px; direction: rtl; font-size: 16px; font-weight: 800; color: var(--macaw); }
.counter svg { width: 20px; height: 22px; }
.counter.bump { animation: bump .22s cubic-bezier(.3,1.5,.5,1); }
@keyframes bump { 50% { transform: scale(1.18); } }
.stamp { position: absolute; top: 232px; left: 0; right: 0; text-align: center; font-size: 36px; font-weight: 800; color: var(--stamp); opacity: 0; transform: scale(.4) rotate(-6deg); }
#s-reward.told .stamp.show { animation: stampIn .55s cubic-bezier(.2,1.5,.4,1) both; }
@keyframes stampIn { 0% { opacity: 0; transform: scale(.4) rotate(-8deg); } 100% { opacity: 1; transform: scale(1) rotate(-3deg); } }
.rtitle { position: absolute; top: 246px; left: 0; right: 0; text-align: center; font-size: 26px; font-weight: 800; color: var(--macaw); opacity: 0; transition: opacity .28s ease; }
#s-reward.told .rtitle { opacity: 1; }
.pile { position: absolute; left: 240px; top: 555px; width: 0; height: 0; --gs: 104px; }
.pshadow { position: absolute; left: -105px; top: 18px; width: 210px; height: 30px; border-radius: 50%; background: var(--line); transform: scale(0); transition: transform .3s cubic-bezier(.3,1.4,.5,1); }
#s-reward.piled .pshadow { transform: scale(1); }
.gem { position: absolute; width: var(--gs); height: var(--gs); margin: calc(var(--gs) / -2) 0 0 calc(var(--gs) / -2); transform: scale(0) rotate(var(--r)); }
.gem svg { display: block; width: 100%; height: 100%; }
.gem.pop { animation: gemPop .3s cubic-bezier(.3,1.5,.5,1) var(--o) forwards; }
.gem.jig { animation: gemJig .32s cubic-bezier(.3,1.3,.5,1) var(--o) both; }
@keyframes gemPop { 0% { transform: scale(0) rotate(var(--r)); } 100% { transform: scale(1) rotate(var(--r)); } }
@keyframes gemJig { 0% { transform: scale(1) translateY(0) rotate(var(--r)); } 40% { transform: scale(1.1) translateY(-14px) rotate(var(--r)); } 100% { transform: scale(1) translateY(0) rotate(var(--r)); } }
.rfoot { position: absolute; left: 0; right: 0; bottom: 0; height: 240px; opacity: 0; transition: opacity .3s ease; }
#s-reward.told .rfoot { opacity: 1; }
.rfoot .ad { position: absolute; top: 22px; left: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; }
.rfoot .ad svg { width: 22px; height: 22px; }
.rfoot .ad.gone { opacity: 0; pointer-events: none; transition: opacity .25s; }
.rfoot .link { position: absolute; top: 108px; left: 0; right: 0; text-align: center; font-size: 15px; font-weight: 700; color: var(--macaw); }
.rfoot .cont { position: absolute; top: 100px; left: 20px; }
#s-reward.big .ad, #s-reward.big .link { display: none; }
#s-reward:not(.big) .cont { display: none; }

/* tiny sound toggle, kept inside the empty status-bar band */
#mute { position: absolute; top: 18px; right: 18px; z-index: 20; width: 40px; height: 40px; border-radius: 50%; font-size: 18px; opacity: .55; }
#mute:hover { opacity: 1; }
</style>
</head>
<body>

<script>
(() => {
"use strict";
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const AR = "٠١٢٣٤٥٦٧٨٩";
const toAr = n => String(n).replace(/\d/g, d => AR[d]);
const now = () => performance.now() / 1000;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const easeOut = (t, p) => 1 - Math.pow(1 - clamp(t, 0, 1), p || 2.3);
const elastic = t => { t = clamp(t, 0, 1); return 1 - Math.pow(2, -9 * t) * Math.cos(t * 3.4 * Math.PI); };
const rnd = (a, b) => a + Math.random() * (b - a);

/* ---------------- fit the 480×1044 reference frame to the viewport ---------------- */
const stage = $("#stage");
function fit() { stage.style.transform = `scale(${Math.min(innerWidth / 480, innerHeight / 1044)})`; }
addEventListener("resize", fit); fit();

/* ============================================================
   Artwork. Box space is 260×290: the plate's floor sits at y≈283.
   The common chest is traced from the reference frames; the other
   three keep its proportions (posts, band, round latch) but each has
   its own lid line, metal and stone. Closed art is split into a
   .base and a .lid group so a lid can rattle or fly off on its own.
   No ids in closed art: it is also stamped four times on the start screen.
   ============================================================ */
const STAR = '<svg viewBox="0 0 24 24"><path d="M12 0C13 8 16 11 24 12 16 13 13 16 12 24 11 16 8 13 0 12 8 11 11 8 12 0Z" fill="currentColor"/></svg>';
const MOTE = '<svg viewBox="0 0 10 26"><path d="M5 0C7.5 8 9.5 11 10 13 9.5 15 7.5 18 5 26 2.5 18 .5 15 0 13 .5 11 2.5 8 5 0Z" fill="#fff"/></svg>';
const MOTE_GOLD = MOTE.replace('fill="#fff"', 'fill="#FFE066"');
const ARROW = '<svg viewBox="0 0 24 24"><path d="M12 19.5V5.5M5.5 12l6.5-6.5 6.5 6.5" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const GEM = `<svg viewBox="0 0 100 100">
  <path d="M31 16h44l20 38-20 38H31L11 54Z" transform="translate(6 6)" fill="#0F9BE8" stroke="#0F9BE8" stroke-width="10" stroke-linejoin="round"/>
  <path d="M28 12h44l20 38-20 38H28L8 50Z" fill="#3CC0FA" stroke="#3CC0FA" stroke-width="10" stroke-linejoin="round"/>
  <path d="M72 12l20 38-20 38H56l6-38-4-38Z" fill="#24B2F6"/>
  <path d="M37 18h26l-4 16H41Z" fill="#B4E8FF"/>
</svg>`;
const recolor = (svg, map) => Object.keys(map).reduce((s, k) => s.split(k).join(map[k]), svg);
const GEM_DARK = recolor(GEM, { "#3CC0FA": "#1CA4EE", "#24B2F6": "#1798E4", "#B4E8FF": "#7CCDF6" });
const GEM_AMETHYST = recolor(GEM, { "#0F9BE8": "#6A2FD0", "#3CC0FA": "#B57BFF", "#24B2F6": "#9A5CF5", "#B4E8FF": "#EBDBFF" });
const GEM_GOLD = recolor(GEM, { "#0F9BE8": "#C98A00", "#3CC0FA": "#FFC800", "#24B2F6": "#F0B000", "#B4E8FF": "#FFF0A8" });

/* the common chest's colours are a palette: body + trims + latch, the open lid's inside and the interior. Five ship;
   ?c=1…18 picks one (default 1; 11 is the video's wood; 12–18 are two-tone) and #palette shows them all, scrolling. */
const COMMON_COLORS = [
  { name: "أخضر",          body: "#58CC02", bodyDk: "#46A302", trim: "#E1F5CF", trimDk: "#BFE79B", latch: "#F4FCEA", lidIn: "#6FD927", lidInDk: "#5BBE12", intA: "#C9E7B4", intB: "#F1F8EA", title: "#58CC02", dot: "#C9EFA9" },

  { name: "جوز ونحاس",     body: "#6B4423", bodyDk: "#56361B", trim: "#E6C15A", trimDk: "#C9A03C", latch: "#FFF1B8", lidIn: "#7E5230", lidInDk: "#6A4325", intA: "#D8C4A8", intB: "#F3ECE2", title: "#A0763D", dot: "#EED9A0" },
  { name: "فيروزي",        body: "#14B8A6", bodyDk: "#0F9C8C", trim: "#D3F5EF", trimDk: "#A8E6DC", latch: "#F0FCFA", lidIn: "#2CCDB9", lidInDk: "#1EB5A2", intA: "#BFE6E0", intB: "#EFF9F7", title: "#14B8A6", dot: "#BDEDE5" },
  { name: "وردي",          body: "#F0559A", bodyDk: "#D1397D", trim: "#FFD9E8", trimDk: "#FFB8D3", latch: "#FFF0F6", lidIn: "#F76DAB", lidInDk: "#E45896", intA: "#EBCBD9", intB: "#FBF1F5", title: "#F0559A", dot: "#FFD0E2" },
  { name: "ذهبي",          body: "#F0B429", bodyDk: "#D99A12", trim: "#FFF0C2", trimDk: "#F7DC8C", latch: "#FFFBEA", lidIn: "#F7C74A", lidInDk: "#E4AF2C", intA: "#EBD9A6", intB: "#FBF6E6", title: "#D99A12", dot: "#FFE9A8" },

  { name: "فحمي",          body: "#3C3C46", bodyDk: "#2C2C34", trim: "#9A9AAE", trimDk: "#7C7C90", latch: "#E8E8F0", lidIn: "#4A4A56", lidInDk: "#3A3A44", intA: "#B0B0BE", intB: "#E9E9EF", title: "#55556A", dot: "#C9C9D6" },
  { name: "طوبي",          body: "#C8643C", bodyDk: "#A94F2C", trim: "#F2D2B6", trimDk: "#E4B48E", latch: "#FCF0E6", lidIn: "#D9764C", lidInDk: "#C2623A", intA: "#E4C7B0", intB: "#F8EFE8", title: "#C8643C", dot: "#F2D2B6" },
  /* the video's own wooden chest, as it was in the first version */
  { name: "خشبي (الأصلي)", body: "#C87800", bodyDk: "#B46800", trim: "#FCCCA4", trimDk: "#ECB080", latch: "#FFEBDE", lidIn: "#D89A3A", lidInDk: "#C58428", intA: "#DCCBB0", intB: "#F3F0E8", title: "#C87800", dot: "#ECC898" },
  /* two-tone: a contrasting metal on the body instead of a tint of the same hue */
  { name: "بحري وذهبي",    body: "#1E3A8A", bodyDk: "#172C6B", trim: "#FFC800", trimDk: "#E6A800", latch: "#FFF1B8", lidIn: "#2A4AA6", lidInDk: "#1E3A8A", intA: "#B8C2E0", intB: "#EEF1FA", title: "#1E3A8A", dot: "#FFE9A8" },
  { name: "أسود وذهبي",    body: "#23232B", bodyDk: "#17171D", trim: "#FFC800", trimDk: "#E6A800", latch: "#FFF1B8", lidIn: "#2F2F3A", lidInDk: "#23232B", intA: "#A8A8B4", intB: "#E9E9EF", title: "#E6A800", dot: "#FFE9A8" },
  { name: "غابة وذهبي",    body: "#1B6B3A", bodyDk: "#145230", trim: "#FFC800", trimDk: "#E6A800", latch: "#FFF1B8", lidIn: "#23804A", lidInDk: "#1B6B3A", intA: "#B3CFBD", intB: "#EEF5F1", title: "#1B6B3A", dot: "#FFE9A8" },
  { name: "تركوازي وذهبي", body: "#0FA3B1", bodyDk: "#0C8592", trim: "#FFC800", trimDk: "#E6A800", latch: "#FFF1B8", lidIn: "#1DB5C3", lidInDk: "#0FA3B1", intA: "#B4DDE1", intB: "#EEF8F9", title: "#0FA3B1", dot: "#FFE9A8" },
  { name: "نعناعي ومرجاني", body: "#5FD3A8", bodyDk: "#46BF93", trim: "#FF8A80", trimDk: "#F26E63", latch: "#FFF0EE", lidIn: "#74DDB6", lidInDk: "#52C49B", intA: "#C6EBDD", intB: "#F0FAF6", title: "#2BB58C", dot: "#FFD5D0" },

const commonIdx = clamp(parseInt(new URLSearchParams(location.search).get("c") || "1", 10) - 1 || 0, 0, COMMON_COLORS.length - 1);
const commonArt = c => ({
  closed: `<svg class="closed" viewBox="0 0 260 290">

  open: `<svg class="open" viewBox="0 0 260 290">

      </defs>
      <rect x="24" y="42" width="41" height="64" rx="10" fill="${c.trim}"/><rect x="195" y="42" width="41" height="64" rx="10" fill="${c.trim}"/>
      <rect x="65" y="48" width="130" height="58" fill="${c.lidIn}"/><rect x="65" y="74" width="130" height="4" fill="${c.lidInDk}"/>
      <rect x="34" y="150" width="192" height="66" fill="url(#cInt)"/>

      <circle cx="130" cy="118" r="22" fill="#FFFFFF"/>

});

const ART = {
  common: commonArt(COMMON_COLORS[commonIdx]),

  /* نادر — steel-blue lacquer, brushed silver, a sapphire under the latch */
  rare: {
    closed: `<svg class="closed" viewBox="0 0 260 290">
      <g class="base">
        <rect x="18" y="176" width="32" height="92" rx="10" fill="#B7C7D6"/><rect x="210" y="176" width="32" height="92" rx="10" fill="#B7C7D6"/>
        <rect x="50" y="176" width="160" height="92" fill="#1F66B8"/>
        <rect x="50" y="176" width="160" height="10" fill="#2E7FD6"/>
        <rect x="50" y="248" width="160" height="6" fill="#174F92"/>
        <rect x="24" y="230" width="20" height="6" rx="3" fill="#DCE6F0"/><rect x="216" y="230" width="20" height="6" rx="3" fill="#DCE6F0"/>
      </g>
      <g class="lid">
        <path d="M18 178V122Q18 68 66 62H194Q242 68 242 122V178Z" fill="#2E7FD6"/>
        <path d="M30 178V122Q30 78 66 76H194Q230 78 230 122V178Z" fill="#3B8FE8"/>
        <path d="M66 92Q130 82 194 92" fill="none" stroke="#6DB7F8" stroke-width="6" stroke-linecap="round"/>
        <rect x="58" y="62" width="16" height="118" rx="6" fill="#DCE6F0"/><rect x="186" y="62" width="16" height="118" rx="6" fill="#DCE6F0"/>
        <rect x="70" y="62" width="4" height="118" rx="2" fill="#B7C7D6"/><rect x="198" y="62" width="4" height="118" rx="2" fill="#B7C7D6"/>
        <rect x="8" y="168" width="244" height="30" rx="8" fill="#DCE6F0"/>

  cur = rewardEl; setBg(rewardEl);
  chestEl.classList.remove("on");
  setTimeout(() => rewardEl.classList.add("piled"), 60);
  const last = 0.05 + (spots.length - 1) * stagger + 0.3;
  setTimeout(() => { countTo(from, from + n, n <= 4 ? 0.3 : n <= 12 ? 0.4 : 0.8); ch.total = from + n; rewardEl.classList.add("told"); Snd.gems(); }, (last + 0.2) * 1000);
  setTimeout(() => $$(".gem", pile).forEach((g, i) => { g.classList.remove("pop"); g.style.transform = "scale(1) rotate(var(--r))"; g.style.setProperty("--o", (i * .03).toFixed(2) + "s"); g.classList.add("jig"); }), (last + 0.35) * 1000);
  setTimeout(showChest.reset, 400);
}
showChest.reset = () => {
  chestEl.classList.remove("opened", "lit", "launch", "cracking", "flicker", "kick", "big", "c1", "c2", "c3", "tapped"); chestEl.style.transform = ""; chestEl.style.transformOrigin = ""; slam.classList.remove("go");
  body.style.transform = ""; box.style.transform = ""; plate.style.transform = ""; plate.style.opacity = ""; glow.style.transform = ""; fx.innerHTML = ""; ch.prize = null; ch.fg = [];
};
/* the counter climbs in discrete ticks, bumping on each */
function countTo(a, b, dur) {
  const t0 = now(), steps = Math.min(b - a, 12); let shown = a;
  (function step() {
    const u = clamp((now() - t0) / dur, 0, 1), n = a + Math.round(Math.floor(u * steps + 1e-6) * (b - a) / steps);
    if (n !== shown) { shown = n; numEl.textContent = toAr(n); retrigger(counter, "bump"); if (steps > 4) Snd.tick(); }
    if (u < 1) requestAnimationFrame(step); else numEl.textContent = toAr(b);
  })();
}
$(".ad", rewardEl).addEventListener("click", e => {
  const b = e.currentTarget; if (b.classList.contains("gone")) return;
  b.classList.add("gone"); countTo(ch.total, ch.total + 15, 0.4); ch.total += 15; Snd.gems();
});
const next = () => { const i = ORDER.indexOf(ch.kind); if (i < ORDER.length - 1) { go(chestEl); showChest(ORDER[i + 1]); } else go($("#s-start")); };
$(".link", rewardEl).addEventListener("click", next);
$(".cont", rewardEl).addEventListener("click", next);
$("#b-start").addEventListener("click", () => { ctx(); go(chestEl); showChest("common"); });

/* ---- deep links: #<tier> · #open<tier> · #reward<tier> · #auto<tier> (tier omitted = common; #reward12 etc. still work) ---- */
/* the palette screen: every colourway of the common chest, the live one outlined; a tap reloads with that colour */
const palEl = $("#s-palette");
$(".pal", palEl).innerHTML = COMMON_COLORS.map((c, i) => `<div class="pcard${i === commonIdx ? " cur" : ""}" data-i="${i + 1}" style="--ttl-c:${c.title}">${commonArt(c).closed.replace('class="closed"', 'class="mini"')}<b>${c.name}</b><span>اللون ${toAr(i + 1)}</span></div>`).join("");
$$(".pcard", palEl).forEach(el => el.addEventListener("click", () => { location.href = location.pathname + "?c=" + el.dataset.i + "#common"; }));

const h = location.hash.slice(1);
const tierOf = s => ORDER.includes(s) ? s : ({ "": "common", "4": "common", "12": "rare", "24": "epic", "40": "legendary" })[s] || null;
const jump = kind => { chestEl.classList.add("on"); $("#s-start").classList.remove("on"); cur = chestEl; showChest(kind); };
if (h === "palette") { palEl.classList.add("on"); $("#s-start").classList.remove("on"); cur = palEl; }
else if (h && ORDER.includes(h)) jump(h);
else if (h.startsWith("open") && tierOf(h.slice(4))) { jump(tierOf(h.slice(4))); ch.taps = 3; dotsRow.classList.add("hide"); setTimeout(openChest, 300); }
else if (h.startsWith("reward") && tierOf(h.slice(6))) { ch.kind = tierOf(h.slice(6)); $("#s-start").classList.remove("on"); showReward(); }
else if (h.startsWith("auto") && tierOf(h.slice(4))) {
  /* scripted run for frame captures: three taps a second apart, then press and release */
  jump(tierOf(h.slice(4)));
  [1.0, 1.9, 2.7].forEach(t => setTimeout(tap, t * 1000));
  setTimeout(() => { ch.pressed = true; ttl.classList.add("hide"); }, 3600);
  setTimeout(release, 3900);
}
})();
</script>
