<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Icon Flips</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  /* dev page for tools/starflip.html: every lesson's sign on its own current
     node, each playing the star flip — the app's own code, read out of
     js/app.js at load, so this page can never drift from the app */
  html, body { background: #fff; margin: 0; overflow-x: hidden; }
  .unit { padding: 6px 12px 2px; }
  .unit h3 { margin: 10px 0 0; font-size: 16px; color: var(--ink); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 4px 6px; }
  .cell { display: flex; flex-direction: column; align-items: center; padding: 8px 0 10px; }
  .cell .node-col { margin-top: 2px; }
  .cell .nm { font-size: 12.5px; font-weight: 700; color: var(--gray); text-align: center; line-height: 1.3; margin-top: 8px; min-height: 2.6em; padding: 0 4px; }
  .err { color: #c00; padding: 12px; font-family: monospace; }
</style>
<script>
/* ?speed= slows the whole page: timers and every animation */
(() => {
  const r = +(new URLSearchParams(location.search).get("speed") || 1); if (r === 1) return;
  const st = setTimeout, si = setInterval, an = Element.prototype.animate;
  window.setTimeout = (f, ms, ...a) => st(f, (ms || 0) / r, ...a);
  window.setInterval = (f, ms, ...a) => si(f, (ms || 0) / r, ...a);
  Element.prototype.animate = function (k, o) { const x = an.call(this, k, o); x.playbackRate = r; return x; };
})();
</script>
<script src="../js/data/skills.js"></script>
<script src="../js/data/numbers.js"></script>
<script src="../js/data/ratios.js"></script>
<script src="../js/data/geometry.js"></script>
</head>
<body>
<div id="root"></div>
<script>
(async () => {
  const root = document.getElementById("root");
  try {
    const src = await (await fetch("../js/app.js?t=" + Date.now())).text();
    /* the pieces we need, cut straight out of the app */
    const cut = (from, to, incl) => { const a = src.indexOf(from), b = src.indexOf(to, a + from.length); if (a < 0 || b < 0) throw new Error("not found: " + from); return src.slice(a, incl ? b + to.length : b); };
    const code = [
      cut("const UNIT_COLORS = {", "};", true),
      cut("const LESSON_ICON = {", "\n};", true),
      cut("const LESSON_ICON_STAR =", "\n", false),
      cut("function roundPoly(", "const NODE_SHAPE", false),
      cut("const NODE_SHAPE =", "\n", false),
      cut("const STAR_FLIP = [", "let flipT", false),
      cut("function nodeFlip(ic) {", "\n}\n", true)
    ].join("\n");
    const api = new Function(code + "\nreturn { UNIT_COLORS, LESSON_ICON, LESSON_ICON_STAR, NODE_SHAPE, nodeFlip };")();
    const units = ["skills", "numbers", "ratios", "geometry"].map(k => window.QBANK[k]).filter(Boolean);
    root.innerHTML = units.map(u => {
      const c = api.UNIT_COLORS[u.color] || api.UNIT_COLORS.green;
      return `<section class="unit"><h3>${u.title}</h3><div class="grid">${u.lessons.map(l => `
        <div class="cell"><div class="node-col bob" style="animation:none">
          <button class="node" style="--node-c:${c.c};--node-s:${c.s};--node-h:${c.h};animation:none" tabindex="-1">${api.NODE_SHAPE}
            <svg class="node-ic" viewBox="0 0 40 40" aria-hidden="true">${api.LESSON_ICON[l.key] || api.LESSON_ICON_STAR}</svg>
          </button></div><span class="nm">${l.title}</span></div>`).join("")}</div></section>`;
    }).join("");
    /* every sign flips together, once every two seconds, as the current node does */
    const go = () => document.querySelectorAll(".node-ic:not(.node-ic-sh)").forEach(ic => api.nodeFlip(ic));
    setTimeout(() => { go(); setInterval(go, 2000); }, 600);
  } catch (e) { root.innerHTML = `<div class="err">${e.message}</div>`; }
})();
</script>
</body>
</html>
