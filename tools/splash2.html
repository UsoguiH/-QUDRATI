<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>شاشة التحميل — ٣ أفكار جديدة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root { --ink: #3C3C3C; --gray: #777; --line: #E5E5E5; --blue: #1CB0F6; --blue-dk: #1899D6; --green: #58CC02; --green-lip: #478700; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #F7F7F7; color: var(--ink); font-family: "Baloo Bhaijaan 2", system-ui, sans-serif; }
header { max-width: 1100px; margin: 0 auto; padding: 24px 16px 8px; text-align: center; }
h1 { margin: 0; font-size: 26px; font-weight: 800; }
header p { margin: 4px 0 0; color: var(--gray); font-size: 15px; }
.bar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; padding: 14px 16px; }
.btn { font: inherit; font-weight: 800; font-size: 16px; border: 0; border-radius: 14px; padding: 10px 22px; color: #fff; background: var(--green);
  box-shadow: 0 4px 0 var(--green-lip); cursor: pointer; }
.btn:active { transform: translateY(4px); box-shadow: none; }
.seg { display: inline-flex; background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 3px; }
.seg button { font: inherit; font-weight: 700; font-size: 14px; border: 0; background: none; color: var(--gray); padding: 6px 14px; border-radius: 10px; cursor: pointer; }
.seg button.on { background: #DDF4FF; color: var(--blue-dk); }
.tabs { display: none; gap: 6px; justify-content: center; padding: 0 16px 10px; }
.tabs button { font: inherit; font-weight: 800; font-size: 15px; border: 2px solid var(--line); border-bottom-width: 4px; background: #fff; color: var(--ink);
  border-radius: 12px; padding: 6px 14px; cursor: pointer; }
.tabs button.on { border-color: #84D8FF; background: #DDF4FF; color: var(--blue-dk); }
.row { display: flex; gap: 28px; justify-content: center; padding: 8px 16px 40px; flex-wrap: wrap; }
.card { display: flex; flex-direction: column; align-items: center; width: 290px; }
.card h2 { margin: 0; font-size: 22px; font-weight: 800; }
.card .why { margin: 2px 0 12px; color: var(--gray); font-size: 14px; line-height: 1.5; text-align: center; min-height: 66px; }
.phone { position: relative; width: 266px; height: 552px; border-radius: 34px; background: #1F1F1F; padding: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.12); }
.screen { position: relative; width: 246px; height: 532px; border-radius: 26px; overflow: hidden; background: #fff; }
.screen iframe { position: absolute; left: 0; top: 0; width: 390px; height: 844px; border: 0; transform-origin: 0 0; transform: scale(.6308); }
.again { margin-top: 12px; font: inherit; font-weight: 700; font-size: 14px; color: var(--blue-dk); background: none; border: 0; cursor: pointer; }
.again a { color: inherit; }
@media (max-width: 700px) {
  .tabs { display: flex; }
  .row { padding-top: 0; }
  .card { display: none; width: 100%; }
  .card.on { display: flex; }
  .phone { width: min(330px, 86vw); height: calc((min(330px, 86vw) - 20px) * 844 / 390 + 20px); }
  .screen { width: calc(min(330px, 86vw) - 20px); height: calc((min(330px, 86vw) - 20px) * 844 / 390); }
}
</style>
</head>
<body>
<header>
  <h1>شاشة التحميل: ٣ أفكار جديدة</h1>
  <p>شعارك نفسه، والفكرة كل مرة مختلفة. كل وحدة تحمّل ثم تسلّم لشاشة الترحيب الحقيقية.</p>
</header>
<div class="bar">
  <button class="btn" id="all">شغّل الكل</button>
  <span class="seg" id="spd"><button data-v="1" class="on">عادي</button><button data-v="4">أبطأ ٤ مرات</button></span>
  <span class="seg" id="ld"><button data-v="3500" class="on">تحميل بطيء</button><button data-v="300">تحميل سريع</button></span>
</div>
<div class="tabs" id="tabs"><button data-i="0" class="on">صح!</button><button data-i="1">المخطط</button><button data-i="2">الأعمدة</button></div>
<div class="row" id="row"></div>
<script>
const IDEAS = [
  { k: "tiles", name: "صح!", why: "الشعار مقسوم على بطاقات إجابة تنخلط وقت التحميل، ثم ترتّب نفسها وتجاوب صح بقفزة التطبيق الخضراء." },
  { k: "plan", name: "المخطط", why: "الشعار يترسم على ورقة مخطط هندسي بخطوط قياس، وليزر يلف حوله وقت التحميل، ثم يتعبّى والترحيب يطلع من تحت." },
  { k: "bars", name: "الأعمدة", why: "خطوط الشعار العمودية رسم بياني يتراقص وقت التحميل، ثم يصير الحروف والنقاط تنزل ذهب، والبنفسجي يطيح أعمدة." }
];
let slow = 1, load = 3500;
const row = document.getElementById("row");
const frames = IDEAS.map((d, i) => {
  const c = document.createElement("div");
  c.className = "card" + (i === 0 ? " on" : "");
  c.innerHTML = `<h2>${d.name}</h2><p class="why">${d.why}</p>
    <div class="phone"><div class="screen"><iframe src="splash2/${d.k}.html?load=${load}" title="${d.name}"></iframe></div></div>
    <button class="again">أعد هذي</button>
    <span class="again"><a href="splash2/${d.k}.html" target="_blank">افتحها بملء الشاشة</a></span>`;
  row.appendChild(c);
  const f = c.querySelector("iframe");
  c.querySelector("button.again").onclick = () => play(f);
  return f;
});
function fitFrames() {
  frames.forEach(f => { const w = f.parentNode.clientWidth; if (w) f.style.transform = `scale(${w / 390})`; });
}
addEventListener("resize", fitFrames); fitFrames();
function play(f) { f.contentWindow.postMessage({ replay: true, load, slow }, "*"); }
document.getElementById("all").onclick = () => frames.forEach(play);
function seg(id, set) {
  const s = document.getElementById(id);
  s.onclick = e => { const b = e.target.closest("button"); if (!b) return;
    s.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); set(+b.dataset.v); frames.forEach(play); };
}
seg("spd", v => { slow = v; });
seg("ld", v => { load = v; });
document.getElementById("tabs").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".card").forEach((c, i) => c.classList.toggle("on", i === +b.dataset.i));
  fitFrames(); play(frames[+b.dataset.i]);
};
</script>
</body>
</html>
