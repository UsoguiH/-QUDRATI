<!DOCTYPE html>
<!-- استوديو المعاينة: the app in a real-size phone (preview.html or the app itself in an iframe at the device's exact width),
     with every unit, level and short lesson, every screen grouped, two phones side by side, and live reload. The new version
     of mobile.html (the user, 2026-11-16: «create a new version of the whole preview … very nice UI … more organizing», then
     «make the UI better for the buttons … add a button for showing the right panel or not») -->
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استوديو المعاينة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<!-- the lessons, read for the lesson tree -->
<script src="../js/data/skills.js"></script>
<script src="../js/data/numbers.js"></script>
<script src="../js/data/ratios.js"></script>
<script src="../js/data/geometry.js"></script>
<script src="../js/data/learn.js"></script>
<style>
  /* the app's own paint: white faces on a 2px rim with a lip, Duolingo's green, blue for what is chosen */
  :root {
    --green: #58CC02; --green-dk: #58A700; --green-bg: #D7FFB8;
    --blue: #1CB0F6; --blue-dk: #1899D6; --blue-light: #DDF4FF; --blue-border: #84D8FF;
    --purple: #CE82FF; --purple-dk: #A568CC; --purple-light: #F3E6FF; --purple-border: #E0BFFF;
    --gold: #FFC800; --orange: #FF9600; --red: #FF4B4B;
    --ink: #3C3C3C; --ink2: #4B4B4B; --gray: #777; --gray-icon: #AFAFAF; --line: #E5E5E5; --line2: #D7DBE0;
    --snow: #FFFFFF; --polar: #F7F7F7; --well: #F1F3F6; --stage: #EDF0F4; --dot: #D3D9E1;
    --sw: 352px;
    --font: 'Baloo Bhaijaan 2', 'Segoe UI', Tahoma, sans-serif;
    --spring: cubic-bezier(.3, 1.35, .5, 1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--stage); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; overflow: hidden;
    display: grid; grid-template-columns: var(--sw) minmax(0, 1fr); transition: grid-template-columns .32s cubic-bezier(.4, 0, .2, 1); }
  body.collapsed { grid-template-columns: 0px minmax(0, 1fr); }
  button, input { font-family: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  svg { flex: none; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #D5D9DF; border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ───────── buttons: Duolingo's face on its lip ───────── */
  .btn { position: relative; height: 42px; padding: 0 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--snow); color: var(--ink2); border: 2px solid var(--line); border-radius: 14px; box-shadow: 0 4px 0 var(--line);
    font-size: 14.5px; font-weight: 800; white-space: nowrap; transition: background .15s, border-color .15s, box-shadow .15s, transform .08s, color .15s; }
  .btn:hover { background: var(--polar); }
  .btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--line); }
  .btn svg { width: 19px; height: 19px; }
  .btn.ic { width: 42px; padding: 0; }
  .btn.blue { background: var(--blue); border-color: var(--blue); color: #fff; box-shadow: 0 4px 0 var(--blue-dk); }
  .btn.blue:hover { background: #3FBDF8; }
  .btn.blue:active { box-shadow: 0 0 0 var(--blue-dk); }
  .btn:disabled { background: var(--well); border-color: var(--line); color: var(--gray-icon); box-shadow: 0 4px 0 var(--line); pointer-events: none; }
  .btn:focus-visible, .tb:focus-visible { outline: 3px solid rgba(28, 176, 246, .45); outline-offset: 2px; }

  /* a tooltip under anything with data-tip */
  [data-tip] { position: relative; }
  [data-tip]::after { content: attr(data-tip); position: absolute; top: calc(100% + 10px); left: 50%; z-index: 40; transform: translate(-50%, -4px);
    padding: 3px 10px 5px; border-radius: 9px; background: var(--ink); color: #fff; font-size: 12.5px; font-weight: 700; white-space: nowrap;
    opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; }
  [data-tip]:hover::after { opacity: 1; transform: translate(-50%, 0); transition-delay: .35s; }

  /* ───────── the side panel ───────── */
  .side { position: relative; z-index: 6; min-width: 0; overflow: hidden; background: var(--snow); box-shadow: inset 1px 0 0 var(--line); }
  .side-in { width: var(--sw); height: 100%; display: flex; flex-direction: column; }
  .head { display: flex; align-items: center; gap: 12px; padding: 18px 18px 16px; }
  .head .logo { width: 44px; height: 41px; }
  .head .ht { flex: 1; min-width: 0; }
  .head b { display: block; font-size: 19.5px; font-weight: 800; line-height: 1.15; }
  .head span { display: block; font-size: 12.5px; font-weight: 700; color: var(--gray); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .search { position: relative; margin: 0 16px 14px; }
  .search input { width: 100%; height: 48px; border: 2px solid var(--line); border-radius: 16px; background: var(--polar); padding: 0 44px 2px 44px;
    font-size: 15.5px; font-weight: 700; color: var(--ink); outline: 0; transition: border-color .15s, background .15s, box-shadow .15s; }
  .search input::placeholder { color: var(--gray-icon); }
  .search input::-webkit-search-cancel-button { display: none; }
  .search input:focus { border-color: var(--blue-border); background: var(--snow); box-shadow: 0 0 0 4px rgba(28, 176, 246, .12); }
  .search .ic { position: absolute; top: 50%; right: 15px; width: 19px; height: 19px; margin-top: -9.5px; color: var(--gray-icon); pointer-events: none; }
  .search kbd { position: absolute; top: 50%; left: 11px; transform: translateY(-50%); }
  .search input:focus ~ kbd, .search.has kbd { display: none; }
  .search .clear { position: absolute; top: 50%; left: 9px; transform: translateY(-50%); width: 30px; height: 30px; border: 0; border-radius: 10px; background: var(--well);
    color: var(--gray); display: none; place-items: center; }
  .search .clear svg { width: 14px; height: 14px; }
  .search.has .clear { display: grid; }
  kbd { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; font: 800 12px var(--font); color: var(--gray); background: var(--snow);
    border: 1.5px solid var(--line); border-bottom-width: 3px; border-radius: 7px; }

  /* a segmented switch: a white thumb on its lip over a grey well */
  .seg { display: flex; gap: 4px; padding: 4px; background: var(--well); border-radius: 16px; }
  .seg > button { flex: 1; min-width: 0; height: 38px; display: flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 12px;
    background: none; font-size: 13.5px; font-weight: 800; color: var(--gray); white-space: nowrap; transition: background .18s, color .18s, box-shadow .18s; }
  .seg > button svg { width: 16px; height: 16px; }
  .seg > button:hover { color: var(--ink); }
  .seg > button.on { background: var(--snow); color: var(--ink); box-shadow: 0 0 0 2px var(--line), 0 3px 0 var(--line); }
  .seg > button b { font-size: 11.5px; font-weight: 800; color: var(--gray-icon); background: var(--snow); border-radius: 7px; padding: 0 6px; line-height: 18px; }
  .seg > button.on b { color: var(--blue-dk); background: var(--blue-light); }
  .src { margin: 0 16px 14px; }

  .recent-w { margin: 0 0 12px; }
  .recent-w[hidden] { display: none; }
  .recent-h { display: flex; align-items: center; justify-content: space-between; margin: 0 18px 6px; font-size: 12.5px; font-weight: 800; color: var(--gray); }
  .recent-h button { border: 0; background: none; padding: 0 4px; font-size: 12px; font-weight: 800; color: var(--gray-icon); }
  .recent-h button:hover { color: var(--blue); }
  .recent { display: flex; gap: 6px; padding: 2px 16px 6px; overflow-x: auto; scrollbar-width: none;
    -webkit-mask-image: linear-gradient(to left, #000 88%, transparent); mask-image: linear-gradient(to left, #000 88%, transparent); }
  .recent::-webkit-scrollbar { display: none; }
  .rc { flex: none; display: inline-flex; align-items: center; gap: 7px; max-width: 190px; height: 32px; padding: 0 11px; border: 2px solid var(--line);
    border-radius: 11px; box-shadow: 0 2px 0 var(--line); background: var(--snow); font-size: 12.5px; font-weight: 800; color: var(--ink2); white-space: nowrap; }
  .rc span { overflow: hidden; text-overflow: ellipsis; }
  .rc i { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--c, var(--gray-icon)); }
  .rc:hover { border-color: var(--blue-border); box-shadow: 0 2px 0 var(--blue-border); }
  .rc:active { transform: translateY(2px); box-shadow: none; }

  .tabs { margin: 2px 16px 4px; }
  .list { position: relative; flex: 1; min-height: 0; overflow: auto; padding: 4px 12px 28px; }
  .empty { padding: 40px 14px; text-align: center; color: var(--gray); font-weight: 700; }

  /* a unit is its banner in the unit's colour, as the path draws it */
  .unit { margin: 14px 0 18px; }
  .u-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 11px 14px 12px; border-radius: 16px; color: #fff;
    background: var(--uc); box-shadow: 0 4px 0 var(--us), 0 -6px 0 var(--snow); }
  .u-head::after { content: ""; position: absolute; left: -12px; right: -12px; top: calc(100% + 4px); height: 14px; background: linear-gradient(var(--snow), rgba(255,255,255,0)); pointer-events: none; }
  .u-head .u-t { flex: 1; min-width: 0; }
  .u-head small { display: block; font-size: 12px; font-weight: 800; opacity: .85; }
  .u-head b { display: block; font-size: 15.5px; font-weight: 800; line-height: 1.3; }
  .u-head .u-n { flex: none; font-size: 12px; font-weight: 800; background: rgba(255,255,255,.22); border-radius: 9px; padding: 1px 8px; }
  .u-yellow .u-head { color: #6B4A00; }
  .u-yellow .u-head .u-n { background: rgba(255,255,255,.45); }
  .nodes { margin-top: 10px; display: flex; flex-direction: column; gap: 2px; }
  .n-row { display: flex; align-items: center; gap: 11px; width: 100%; padding: 7px 9px; border: 2px solid transparent; border-radius: 15px; background: none; text-align: start; color: var(--ink); transition: background .15s; }
  .n-row:hover { background: var(--polar); }
  .n-row.on { background: var(--blue-light); border-color: var(--blue-border); }
  .n-row .hex { width: 38px; height: 35px; transition: transform .2s var(--spring); }
  .n-row:hover .hex { transform: translateY(-2px); }
  .n-row .n-t { flex: 1; min-width: 0; }
  .n-row .n-t b { display: block; font-size: 14.5px; font-weight: 800; line-height: 1.3; }
  .n-row .n-t span { display: block; font-size: 12px; font-weight: 700; color: var(--gray); }
  .n-row .chev { width: 26px; height: 26px; padding: 4px; border-radius: 8px; color: var(--gray-icon); transition: transform .22s var(--spring), background .15s; }
  .n-row:hover .chev { background: var(--snow); }
  .node.open > .n-row .chev { transform: rotate(-90deg); }
  .subs { display: none; margin: 4px 26px 10px 0; padding-inline-start: 12px; border-inline-start: 2px dashed var(--line); }
  .node.open > .subs { display: block; animation: subIn .24s ease-out; }
  @keyframes subIn { from { opacity: 0; transform: translateY(-5px); } }
  .s-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 8px; border: 2px solid transparent; border-radius: 13px; background: none; text-align: start;
    font-size: 14px; font-weight: 700; color: var(--ink2); transition: background .15s; }
  .s-row:hover { background: var(--polar); }
  .s-row.on { background: var(--blue-light); border-color: var(--blue-border); color: var(--ink); font-weight: 800; }
  .s-row .num { width: 27px; height: 27px; flex: none; display: grid; place-items: center; border-radius: 9px; font-size: 13px; font-weight: 800; color: var(--uk); background: var(--ub); }
  .s-row.on .num { background: var(--uc); color: #fff; }
  .u-yellow .s-row.on .num { color: #6B4A00; }
  .s-row.practice { color: var(--gray); }
  .s-row.practice .num { background: var(--well); color: var(--gray); }
  .s-row.practice.on .num { background: var(--gray); color: #fff; }
  .s-row .num svg { width: 15px; height: 15px; }

  /* the screens: a row of the groups to jump with, then each group as a card in its own colour */
  .jump { position: sticky; top: -4px; z-index: 3; display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; margin: 0 -12px; padding: 10px 12px;
    background: rgba(255,255,255,.96); box-shadow: 0 1px 0 var(--line); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .jump button { aspect-ratio: 1; display: grid; place-items: center; padding: 0; border: 2px solid transparent; border-radius: 13px; background: var(--gt); transition: transform .18s var(--spring), border-color .15s, box-shadow .15s; }
  .jump button img { width: 68%; height: 68%; }
  .jump button:hover { transform: translateY(-2px); }
  .jump button.on { border-color: var(--gc); box-shadow: 0 3px 0 var(--gc); }
  .jump [data-tip]::after { top: calc(100% + 6px); }
  .g { margin: 14px 0; border-radius: 22px; background: var(--gt); border: 2px solid var(--gr); padding: 4px 8px 10px; scroll-margin-top: 70px; }
  .g-h { display: flex; align-items: center; gap: 11px; width: 100%; padding: 8px 6px 10px; border: 0; background: none; text-align: start; color: var(--ink); }
  .g-h img { width: 38px; height: 38px; flex: none; transition: transform .25s var(--spring); }
  .g-h:hover img { transform: rotate(-8deg) scale(1.08); }
  .g-t { flex: 1; min-width: 0; }
  .g-t b { display: block; font-size: 16.5px; font-weight: 800; line-height: 1.25; }
  .g-t small { display: block; font-size: 12px; font-weight: 700; color: var(--gray); }
  .g-n { flex: none; min-width: 28px; height: 24px; padding: 0 8px; display: grid; place-items: center; border-radius: 9px; background: var(--gc); color: #fff; font-size: 13px; font-weight: 800; }
  .g.dark .g-n { color: #6B4A00; }
  .g-h .chev { width: 26px; height: 26px; padding: 4px; color: var(--gray-icon); transform: rotate(-90deg); transition: transform .22s var(--spring); }
  .g.shut .g-h .chev { transform: none; }
  .g.shut .g-items { display: none; }
  .g.shut { padding-bottom: 4px; }
  .g-items { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; animation: subIn .24s ease-out; }
  .c-row { display: flex; align-items: center; gap: 9px; min-height: 50px; padding: 6px 9px 6px 8px; border: 2px solid var(--line); border-radius: 15px; box-shadow: 0 3px 0 var(--line);
    background: var(--snow); text-align: start; font-size: 13px; font-weight: 800; line-height: 1.3; color: var(--ink2); transition: border-color .15s, box-shadow .15s, background .15s, color .15s; }
  .c-row img { width: 28px; height: 28px; flex: none; transition: transform .22s var(--spring); }
  .c-row:hover { border-color: var(--gr); box-shadow: 0 3px 0 var(--gr); }
  .c-row:hover img { transform: scale(1.12); }
  .c-row:active { transform: translateY(3px); box-shadow: 0 0 0 var(--line); }
  .c-row.on { background: var(--gc); border-color: var(--gc); box-shadow: 0 3px 0 var(--gd); color: #fff; }
  .g.dark .c-row.on { color: #5A3E00; }
  .c-row.on img { background: rgba(255,255,255,.92); border-radius: 9px; padding: 3px; width: 32px; height: 32px; margin: -2px; }
  .rc img { width: 18px; height: 18px; flex: none; }

  .keys { flex: none; display: flex; flex-wrap: wrap; gap: 6px 12px; padding: 11px 16px 13px; border-top: 1px solid var(--line); font-size: 12px; font-weight: 700; color: var(--gray); }
  .keys span { display: inline-flex; align-items: center; gap: 4px; }
  .keys kbd { min-width: 20px; height: 20px; font-size: 11px; }

  /* ───────── the main area ───────── */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .top { display: flex; align-items: center; gap: 14px; padding: 14px 22px; background: var(--snow); box-shadow: 0 1px 0 var(--line); position: relative; z-index: 4; }
  .open-side { display: none; }
  body.collapsed .open-side { display: inline-flex; }
  .crumb { flex: 1; min-width: 0; }
  .cp { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 800; color: var(--gray); white-space: nowrap; overflow: hidden; }
  .cp .pill { color: #fff; background: var(--c, var(--gray-icon)); border-radius: 8px; padding: 0 8px; line-height: 20px; }
  .cp .pill.dark { color: #6B4A00; }
  .cp svg { width: 10px; height: 10px; color: var(--gray-icon); }
  .cp .src-note { color: var(--orange); }
  .crumb h1 { margin: 2px 0 0; font-size: 22px; font-weight: 800; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stepper { display: flex; align-items: center; gap: 10px; flex: none; }
  .count { min-width: 64px; text-align: center; font-size: 14px; font-weight: 800; color: var(--gray); font-variant-numeric: tabular-nums; }
  .count b { color: var(--ink); }

  /* the stage: a dotted board, a floating dock, the phones */
  .stage { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px 22px 18px;
    background-color: var(--stage); background-image: radial-gradient(var(--dot) 1.1px, transparent 1.4px); background-size: 22px 22px; container-type: inline-size; }
  .dock { position: relative; z-index: 3; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; max-width: 100%; padding: 6px;
    background: rgba(255,255,255,.94); border: 1.5px solid var(--line); border-radius: 20px; box-shadow: 0 10px 30px -8px rgba(16,24,40,.16), 0 2px 0 var(--line);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .dock .sep { width: 2px; height: 28px; border-radius: 2px; background: var(--well); margin: 0 3px; }
  .tb { position: relative; height: 40px; min-width: 40px; padding: 0 11px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 0; border-radius: 13px;
    background: none; color: var(--ink2); font-size: 13.5px; font-weight: 800; white-space: nowrap; transition: background .15s, color .15s, box-shadow .15s, transform .08s; }
  .tb svg { width: 19px; height: 19px; }
  .tb:hover { background: var(--well); }
  .tb:active { transform: scale(.94); }
  .tb.on { background: var(--blue-light); color: var(--blue-dk); box-shadow: inset 0 0 0 2px var(--blue-border); }
  .tb.ic { padding: 0; width: 40px; }
  /* the devices: each a phone outline drawn at its own proportions */
  .devs { display: flex; gap: 2px; padding: 3px; background: var(--well); border-radius: 15px; }
  .dv { height: 38px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 12px; background: none; color: var(--gray);
    font-size: 12.5px; font-weight: 800; white-space: nowrap; transition: background .18s, color .18s, box-shadow .18s; }
  .dv svg { width: 18px; height: 22px; }
  .dv:hover { color: var(--ink); }
  .dv.on { background: var(--snow); color: var(--blue-dk); box-shadow: 0 0 0 2px var(--blue-border), 0 3px 0 var(--blue-border); }
  .dv-more { display: none; }
  .dv-more svg { width: 13px; height: 13px; }
  @container (max-width: 1120px) { .dv:not(.on) { display: none; } .dv.on { box-shadow: none; background: none; } .devs { background: var(--blue-light); box-shadow: inset 0 0 0 2px var(--blue-border); }
    .dv-more { display: inline-flex; align-items: center; height: 38px; padding: 0 8px 0 4px; border: 0; background: none; color: var(--blue-dk); } }
  @container (max-width: 760px) { .tb .tl { display: none; } .tb:not(.ic) { padding: 0 10px; } }
  .live { gap: 8px; }
  .live i { width: 9px; height: 9px; border-radius: 50%; background: var(--gray-icon); transition: background .2s; }
  .live.on { background: #E9FAD9; color: var(--green-dk); box-shadow: inset 0 0 0 2px #B8EC8F; }
  .live.on i { background: var(--green); animation: live 1.8s infinite; }
  @keyframes live { 0% { box-shadow: 0 0 0 0 rgba(88,204,2,.55); } 70% { box-shadow: 0 0 0 7px rgba(88,204,2,0); } 100% { box-shadow: 0 0 0 0 rgba(88,204,2,0); } }
  .spin svg { animation: spin .6s ease-in-out; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .view { position: relative; flex: 1; min-height: 0; width: 100%; display: flex; overflow: hidden; }
  .view.full { overflow: auto; }
  .rig { position: relative; flex: none; margin: auto; }
  .rig-in { position: absolute; top: 0; left: 0; display: flex; align-items: flex-start; gap: 48px; transform-origin: 0 0; }
  .ph { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  /* the bezel is decoration; the iframe inside is the device's real size */
  .phone { position: relative; padding: 12px; border-radius: 50px; background: linear-gradient(155deg, #4A4D55 0%, #1D1F24 40%, #0B0C0E 100%);
    box-shadow: 0 0 0 1.5px #2B2D33, inset 0 1px 0 rgba(255,255,255,.18), inset 0 -1px 0 rgba(0,0,0,.6), 0 34px 70px -14px rgba(16,24,40,.38), 0 12px 24px rgba(16,24,40,.12); }
  .phone::before { content: ""; position: absolute; top: 4.5px; left: 50%; width: 54px; height: 4px; margin-left: -27px; border-radius: 3px; background: rgba(255,255,255,.2); }
  .phone::after { content: ""; position: absolute; bottom: 4px; left: 50%; width: 100px; height: 4px; margin-left: -50px; border-radius: 3px; background: rgba(255,255,255,.28); }
  .phone .key { position: absolute; width: 4px; border-radius: 2px; background: #2B2D33; }
  .phone .k1 { right: -4px; top: 150px; height: 72px; }

  .phone.land iframe { border-radius: 28px; }
  .ph .busy { position: absolute; inset: 12px; border-radius: 38px; background: rgba(255,255,255,.75); display: grid; place-items: center; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .ph.loading .busy { opacity: 1; }

  @keyframes hop { 40% { transform: translateY(-12px); } }
  /* the phone's own name under it, a button that changes its device */
  .cap { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px 0 10px; border: 2px solid var(--line); border-radius: 13px; box-shadow: 0 3px 0 var(--line);

  .cap .sz { color: var(--gray); font-weight: 700; direction: ltr; unicode-bidi: isolate; }
  .cap .pct { color: var(--gray-icon); font-weight: 700; }
  .cap svg { width: 13px; height: 13px; color: var(--gray-icon); }

  .pop { position: fixed; z-index: 60; width: 236px; padding: 6px; background: var(--snow); border: 2px solid var(--line); border-radius: 18px;
    box-shadow: 0 18px 40px -10px rgba(16,24,40,.25), 0 3px 0 var(--line); animation: popIn .2s var(--spring); }
  @keyframes popIn { from { opacity: 0; transform: translateY(6px) scale(.97); } }
  .pop p { margin: 4px 10px 6px; font-size: 12px; font-weight: 800; color: var(--gray); }
  .pop button { display: flex; align-items: center; gap: 10px; width: 100%; height: 40px; padding: 0 10px; border: 0; border-radius: 12px; background: none; text-align: start;
    font-size: 14px; font-weight: 800; color: var(--ink2); }

  .pop button svg { width: 18px; height: 22px; color: var(--gray-icon); }
  .pop button.on svg { color: var(--blue); }
  .pop button span { margin-inline-start: auto; font-size: 12px; font-weight: 700; color: var(--gray); direction: ltr; }

  .toast { position: fixed; left: 50%; bottom: 26px; z-index: 70; display: flex; align-items: center; gap: 8px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    background: var(--ink); color: #fff; font-size: 14px; font-weight: 800; padding: 10px 18px 12px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,.2);
    transition: opacity .2s, transform .3s var(--spring); }

    const f = p => p[0].toFixed(2) + ' ' + p[1].toFixed(2);

    for (let k = 0; k < n; k++) { const P = pts[k], A = pts[(k + n - 1) % n], B = pts[(k + 1) % n]; d += ' L' + f(at(P, A, r)) + ' Q' + f(P) + ' ' + f(at(P, B, r)); }
    return d + ' Z';
  }

  const toggleCompare = () => { S.compare = !S.compare; store.set('compare', S.compare); buildPhones(); load(); };
  $('cmp').onclick = toggleCompare;
  $('rot').onclick = () => { S.land = !S.land; drawDevs(); buildPhones(); load(); };
  const setFull = v => { S.full = v; store.set('full', v); fit(); };
  document.querySelectorAll('#zoomSeg button').forEach(b => b.onclick = () => setFull(b.dataset.z === 'real'));
  $('rel').onclick = load;
  $('tab').onclick = () => window.open(srcUrl(), '_blank');
  $('copy').onclick = () => {
    const done = () => toast('انتسخ الرابط');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(location.href).then(done, () => toast(location.href, true));
    else toast(location.href, true);
  };
  /* the stage refits whenever its room changes: a resize, the panel sliding, a font */
  let fitRaf = 0;
  new ResizeObserver(() => { cancelAnimationFrame(fitRaf); fitRaf = requestAnimationFrame(fit); }).observe($('view'));

  let tt = 0;
  const OK = '<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 9.5l3.5 3.5 7.5-8"/></svg>';
  function toast(t, plain) { const el = $('toast'); el.innerHTML = (plain ? '' : OK) + `<span>${t}</span>`; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 1700); }

  /* ───── live reload: the files that change in a session ───── */
  const WATCH = ['../css/style.css', '../css/law.css', '../css/law-core.css', '../js/app.js', '../js/law/law.js', '../js/law/law-core.js', '../js/law/law-more-bigsum.js', '../js/data/learn.js'];
  const stamps = {}; let timer = 0;
  function poll() {
    WATCH.forEach(f => fetch(f, { method: 'HEAD', cache: 'no-store' }).then(r => {
      const m = r.headers.get('last-modified'); if (!m) return;
      if (stamps[f] && stamps[f] !== m) { stamps[f] = m; load(); toast('تحدّث: ' + f.split('/').pop()); } else stamps[f] = m;
    }).catch(() => {}));
  }
  function setAuto(on) { S.auto = on; store.set('auto', on); $('auto').classList.toggle('on', on); clearInterval(timer); if (on) { poll(); timer = setInterval(poll, 1300); } }
  $('auto').onclick = () => setAuto(!S.auto);

  /* ───── keys, by their place on the keyboard so an Arabic layout works the same ───── */
  addEventListener('keydown', e => {
    const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
    if (e.key === 'Escape') { if (pop) { closePop(); return; } if (document.activeElement === $('q')) { $('q').value = ''; drawList(); $('q').blur(); return; } if (narrow()) setPanel(false); return; }
    if ((e.key === '/' || e.code === 'Slash') && !typing) { e.preventDefault(); if (!panelShown()) setPanel(true); setTimeout(() => $('q').focus(), 60); return; }
    if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); step(1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); step(-1); }
    else if (e.code === 'KeyR') load();
    else if (e.code === 'KeyC') toggleCompare();
    else if (e.code === 'KeyB') setPanel(!panelShown());
  });
  addEventListener('hashchange', () => { const h = decodeURIComponent(location.hash.slice(1)); if (h && h !== S.hash) open(h, true); });

  drawDevs(); drawSrc(); drawList(); drawRecent(); drawCrumb(); buildPhones(); load(); setAuto(S.auto);
  requestAnimationFrame(() => revealOn('auto'));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body>
