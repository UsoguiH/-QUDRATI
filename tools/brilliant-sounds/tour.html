<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Sound Tour</title>
<style>
  /* dev page, never shipped: the app's screens one at a time on a phone, each
     playable (phone.html, the real app with its sounds routed) under a bar
     that names the screen, lists the sounds that play on it — each lighting
     up as it is heard — and switches every one of them between today's and
     Brilliant's on the spot. Picks are the same "soundPicks" as compare.html,
     screens.html and live.html. The screen list is live.html's own. */
  :root {
    --bg: #FFFFFF; --ink: #3C3C3C; --mute: #777777; --line: #E5E5E5; --chip: #F2F2F2;
    --green: #58CC02; --green-dk: #478700; --green-bg: #D7FFB8;
    --purple: #8E5CF6; --purple-dk: #6A3CC9; --purple-bg: #EDE3FF;
    --blue: #1CB0F6; --blue-dk: #1899D6; --note: rgba(32,32,32,.88);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #131F24; --ink: #F1F7FB; --mute: #9AA9B1; --line: #37464F; --chip: #22343C; --green-bg: #2B4A12; --purple-bg: #3A2650; }
  }
  :root[data-theme="dark"] { --bg: #131F24; --ink: #F1F7FB; --mute: #9AA9B1; --line: #37464F; --chip: #22343C; --green-bg: #2B4A12; --purple-bg: #3A2650; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; justify-content: center; overflow: hidden; }
  .wrap { width: 100%; max-width: 480px; height: 100dvh; display: flex; flex-direction: column; border-inline: 1px solid var(--line); }
  header { flex: none; padding: 8px 10px 6px; border-bottom: 1px solid var(--line); background: var(--bg); position: relative; z-index: 6; }
  .nav { display: flex; align-items: center; gap: 8px; }
  .arw { flex: none; width: 42px; height: 42px; border-radius: 12px; border: 2px solid var(--line); border-bottom-width: 4px; background: var(--bg); color: var(--ink); font-size: 20px; font-weight: 800; cursor: pointer; display: grid; place-items: center; padding: 0; }
  .arw:active { transform: translateY(2px); border-bottom-width: 2px; }
  .arw:disabled { opacity: .35; }
  .ttl { flex: 1; min-width: 0; text-align: center; cursor: pointer; }
  .ttl small { display: block; font-size: 11.5px; font-weight: 700; color: var(--mute); }
  .ttl b { display: block; font-size: 17px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 7px; }
  .seg button { border: 2px solid var(--line); border-bottom-width: 3px; background: var(--bg); color: var(--ink); border-radius: 12px; padding: 6px 4px; font: inherit; font-size: 13.5px; font-weight: 800; cursor: pointer; }
  .seg button.on.now { background: var(--green-bg); border-color: var(--green); color: var(--green-dk); }
  .seg button.on.bri { background: var(--purple-bg); border-color: var(--purple); color: var(--purple-dk); }
  .chips { display: flex; gap: 6px; overflow-x: auto; margin-top: 7px; padding-bottom: 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 2px solid var(--line); background: var(--chip); color: var(--mute); border-radius: 99px; padding: 3px 10px; font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .chip.heard { color: var(--ink); background: var(--green-bg); border-color: var(--green); }
  .chip.heard.bri { background: var(--purple-bg); border-color: var(--purple); }
  .chip.same::after { content: " · same"; font-weight: 600; color: var(--mute); }
  .chip.pk-k::before { content: "kept · "; color: var(--green-dk); }
  .chip.pk-b::before { content: "Brilliant · "; color: var(--purple-dk); }
  .stage { flex: 1; position: relative; min-height: 0; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  .note { position: absolute; left: 50%; top: 8px; translate: -50% 0; z-index: 3; max-width: calc(100% - 20px); padding: 6px 12px; border-radius: 99px; background: var(--note); color: #fff; font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; opacity: 0; transition: opacity .2s; }
  .note.on { opacity: 1; }
  .note b { color: #C9F27B; } .note b.bri { color: #D7C2FF; }
  .pop { position: absolute; left: 10px; right: 10px; top: calc(100% + 6px); z-index: 4; background: var(--bg); border: 2px solid var(--line); border-radius: 16px; padding: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.18); display: none; }
  .pop.on { display: block; }
  .pop h4 { margin: 0 0 4px; font-size: 15px; }
  .pop p { margin: 0 0 6px; font-size: 13px; color: var(--mute); }
  .pop .pk { display: flex; gap: 6px; margin-top: 8px; }
  .pop .pk button { flex: 1; border: 2px solid var(--line); border-bottom-width: 3px; background: var(--bg); color: var(--ink); border-radius: 10px; padding: 8px; font: inherit; font-size: 13.5px; font-weight: 800; cursor: pointer; }
  .pop .pk button.on.k { background: var(--green-bg); border-color: var(--green); color: var(--green-dk); }
  .pop .pk button.on.b { background: var(--purple-bg); border-color: var(--purple); color: var(--purple-dk); }
  .pop .x { float: right; border: 0; background: var(--chip); color: var(--mute); width: 28px; height: 28px; border-radius: 50%; font-size: 16px; font-weight: 800; cursor: pointer; }
  .list { position: absolute; inset: 0; z-index: 5; background: var(--bg); overflow: auto; padding: 12px 14px 24px; display: none; }
  .list.on { display: block; }
  .list em { display: block; font-style: normal; font-size: 12px; font-weight: 800; color: var(--mute); margin: 12px 0 6px; text-transform: uppercase; letter-spacing: .04em; }
  .list .g { display: flex; flex-wrap: wrap; gap: 6px; }
  .list button { border: 2px solid var(--line); border-bottom-width: 3px; background: var(--bg); color: var(--ink); border-radius: 12px; padding: 7px 11px; font: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer; }
  .list button.cur { border-color: var(--blue); color: var(--blue-dk); }
  .list .done { margin-top: 18px; font-size: 13px; color: var(--mute); }
  .list .done a { color: var(--blue-dk); font-weight: 800; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="nav">
      <button class="arw" id="prev" aria-label="Previous screen">‹</button>
      <div class="ttl" id="ttl" role="button" aria-label="All screens"><small id="pos"></small><b id="name">Loading…</b></div>
      <button class="arw" id="next" aria-label="Next screen">›</button>
    </div>
    <div class="seg"><button class="now" data-m="now">Today's sounds</button><button class="bri" data-m="bri">Brilliant's sounds</button></div>
    <div class="chips" id="chips"></div>
    <div class="pop" id="pop"></div>
  </header>
  <div class="stage">
    <iframe id="app" title="The app"></iframe>
    <div class="note" id="note"></div>
    <div class="list" id="list"></div>
  </div>
</div>
<script>
const KEY = "soundPicks";
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const picks = () => { try { return JSON.parse(store.get(KEY, "{}")) || {}; } catch (e) { return {}; } };
const setPick = (id, v) => { const p = picks(); p[id] = v; store.set(KEY, JSON.stringify(p)); };
let FLAT = [], M = {}, cur = 0, mode = store.get("tourMode", "bri") === "now" ? "now" : "bri", heard = {}, noteT = 0;
const name = id => { const m = M[id]; if (!m) return id; const s = m.moment.split(/[:(;]| — /)[0].trim(); return s.length > 44 ? s.slice(0, 42) + "…" : s; };
const swaps = id => { const m = M[id]; return !!(m && m.brilliant && m.brilliant !== "keep" && m.brilliant !== "none"); };

function paintChips() {
  const sc = FLAT[cur], p = picks();
  $("chips").innerHTML = sc.ids.filter(id => M[id]).map(id => {
    const h = heard[id], cls = ["chip", h ? "heard" : "", h === "bri" ? "bri" : "", swaps(id) ? "" : "same", p[id] === "k" ? "pk-k" : p[id] === "b" ? "pk-b" : ""].filter(Boolean).join(" ");
    return `<button class="${cls}" data-id="${esc(id)}">${esc(name(id))}</button>`;
  }).join("");
  $("chips").querySelectorAll(".chip").forEach(c => { c.onclick = () => openPop(c.dataset.id); });
}
function openPop(id) {
  const m = M[id], p = picks(), pop = $("pop");
  const now = m.id === "correct-answer" ? "our correct sound" : m.now === "duolingo" ? "Duolingo's file" : m.now === "synth" ? "our generated sound" : "silent";
  const bri = swaps(id) ? "Brilliant's «" + m.brilliant + "»" : m.brilliant === "keep" ? "stays as it is" : "nothing from Brilliant";
  pop.innerHTML = `<button class="x" aria-label="Close">×</button><h4>${esc(name(id))}</h4>
    <p>${esc(m.moment)}</p><p><b>Today:</b> ${esc(now)} — <b>Brilliant phone:</b> ${esc(bri)}</p>
    ${swaps(id) ? `<div class="pk"><button class="k${p[id] === "k" ? " on" : ""}">Keep ours</button><button class="b${p[id] === "b" ? " on" : ""}">Brilliant</button></div>` : ""}`;
  pop.classList.add("on");
  pop.querySelector(".x").onclick = () => pop.classList.remove("on");
  const pk = pop.querySelector(".pk");
  if (pk) {
    pk.querySelector(".k").onclick = () => { setPick(id, "k"); openPop(id); paintChips(); };
    pk.querySelector(".b").onclick = () => { setPick(id, "b"); openPop(id); paintChips(); };
  }
}
function paintMode() {
  document.querySelectorAll(".seg button").forEach(b => b.classList.toggle("on", b.dataset.m === mode));
  try { $("app").contentWindow.__SMODE = mode; } catch (e) {}
}
function show(i) {
  cur = Math.max(0, Math.min(FLAT.length - 1, i));
  store.set("tourScreen", FLAT[cur].k);
  const sc = FLAT[cur];
  $("pos").textContent = `${sc.group} — screen ${cur + 1} of ${FLAT.length}`;
  $("name").textContent = sc.label;
  $("prev").disabled = cur === 0; $("next").disabled = cur === FLAT.length - 1;
  heard = {}; $("pop").classList.remove("on"); $("list").classList.remove("on");
  paintChips();
  $("app").src = `phone.html?snd=${mode}&dev=1${sc.after ? "&after=" + sc.after : ""}&r=${Date.now()}#${sc.hash}`;
}
function list() {
  const L = $("list");
  if (L.classList.contains("on")) { L.classList.remove("on"); return; }
  let html = "", g = "";
  FLAT.forEach((s, i) => {
    if (s.group !== g) { html += (g ? "</div>" : "") + `<em>${esc(s.group)}</em><div class="g">`; g = s.group; }
    html += `<button data-i="${i}" class="${i === cur ? "cur" : ""}">${esc(s.label)}</button>`;
  });
  const ids = Object.keys(M).filter(swaps), p = picks(), n = ids.filter(id => p[id] === "k" || p[id] === "b").length;
  L.innerHTML = html + `</div><p class="done">${n} of ${ids.length} sounds picked — the same picks as the <a href="compare.html">full list</a>.</p>`;
  L.querySelectorAll("button[data-i]").forEach(b => { b.onclick = () => show(+b.dataset.i); });
  L.classList.add("on");
}
addEventListener("message", e => {
  const d = e.data;
  if (!d || !d.qsnd || e.source !== $("app").contentWindow) return;
  if (d.qsnd === "ready") { paintMode(); return; }
  if (d.qsnd !== "moment") return;
  const act = String(d.act || ""), bri = act.indexOf("bri:") === 0, what = bri ? act.slice(4) : act;
  const played = act === "app" || (bri && ["silent", "muted", "once", "no-tap-yet"].indexOf(what) < 0);
  if (!played) return;
  heard[d.id] = bri ? "bri" : "now";
  paintChips();
  const n = $("note");
  n.innerHTML = `<b class="${bri ? "bri" : ""}">${bri ? "Brilliant" : "Ours"}</b> — ${esc(name(d.id))}`;
  n.classList.add("on"); clearTimeout(noteT); noteT = setTimeout(() => n.classList.remove("on"), 1600);
});
$("prev").onclick = () => show(cur - 1);
$("next").onclick = () => show(cur + 1);
$("ttl").onclick = list;
document.querySelectorAll(".seg button").forEach(b => { b.onclick = () => { mode = b.dataset.m; store.set("tourMode", mode); heard = {}; paintChips(); paintMode(); }; });
(async function () {
  try {
    const [live, moments] = await Promise.all([
      fetch("live.html?t=" + Date.now()).then(r => r.text()),
      fetch("moments.json?t=" + Date.now()).then(r => r.json())
    ]);
    (Array.isArray(moments) ? moments : moments.moments).forEach(m => { M[m.id] = m; });
    const src = live.match(/const SCREENS = (\[[\s\S]*?\n\]);/);
    const SCREENS = new Function("return " + src[1])();
    FLAT = SCREENS.flatMap(([g, l]) => l.map(s => Object.assign({ group: g }, s)));
  } catch (e) { $("name").textContent = "Could not load the screens: " + e.message; return; }
  const at = FLAT.findIndex(s => s.k === (location.hash.slice(1) || store.get("tourScreen", "")));
  paintMode();
  show(at >= 0 ? at : 0);
})();
</script>
</body>
</html>
