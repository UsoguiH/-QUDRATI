<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sound Screens</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /* dev page: one sound moment at a time, on the app screen where it plays —
     the same screen twice, side by side: today's sound on the left phone,
     the proposed Brilliant sound on the right. Picks are shared with compare.html */
  :root {
    --bg: #F7F7F7; --card: #FFFFFF; --ink: #3C3C3C; --mute: #777777; --line: #E5E5E5; --frame: #2B2B2B;
    --green: #58CC02; --green-dk: #478700; --blue: #1CB0F6; --blue-dk: #1899D6;
    --purple: #CE82FF; --purple-dk: #A568CC; --grey: #9D9D9D; --grey-dk: #777777; --gold-bg: #FFF4BF; --gold-ink: #9A6A00; --chip: #F0F0F0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #131F24; --card: #1B2B32; --ink: #F1F7FB; --mute: #9AA9B1; --line: #37464F; --frame: #0B1418; --gold-bg: #4A3B0A; --gold-ink: #FFE38A; --chip: #26363D; }
  }
  :root[data-theme="dark"] { --bg: #131F24; --card: #1B2B32; --ink: #F1F7FB; --mute: #9AA9B1; --line: #37464F; --frame: #0B1418; --gold-bg: #4A3B0A; --gold-ink: #FFE38A; --chip: #26363D; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Baloo Bhaijaan 2', 'Segoe UI', sans-serif; line-height: 1.45; }
  main { max-width: 960px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { margin: 0; font-size: 26px; }
  .lead { color: var(--mute); margin: 2px 0 0; font-size: 15px; }
  .top { display: flex; align-items: center; gap: 10px; margin: 16px 0 10px; flex-wrap: wrap; }
  .nav { font: inherit; font-weight: 800; font-size: 15px; padding: 7px 16px; border-radius: 12px; cursor: pointer; background: var(--card); color: var(--ink); border: 2px solid var(--line); border-bottom-width: 4px; }
  .nav:active { transform: translateY(2px); border-bottom-width: 2px; }
  #pos { font-weight: 800; color: var(--mute); }
  select { font: inherit; font-size: 14px; padding: 7px 10px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); color: var(--ink); max-width: 100%; flex: 1; min-width: 200px; }
  .moment { background: var(--card); border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 16px; padding: 12px 16px; }
  .moment b { font-size: 17px; display: block; }
  .moment .ar { color: var(--mute); direction: rtl; unicode-bidi: isolate; }
  .moment .why { color: var(--mute); font-size: 14px; }
  .moment .note { margin-top: 6px; font-size: 13px; font-weight: 700; color: var(--gold-ink); background: var(--gold-bg); border-radius: 10px; padding: 4px 10px; display: inline-block; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .tags span { font-size: 12px; font-weight: 800; padding: 1px 10px; border-radius: 99px; background: var(--chip); color: var(--mute); }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 16px; }
  .side { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .side h2 { margin: 0; font-size: 18px; }
  .side h2 small { display: block; text-align: center; font-size: 13px; color: var(--mute); font-weight: 500; font-family: Consolas, monospace; }
  .phone { position: relative; width: 100%; max-width: 300px; aspect-ratio: 390 / 844; border-radius: 34px; background: var(--frame); padding: 9px; cursor: pointer; border: 0; display: block; transition: transform .15s; }
  .phone img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 26px; background: #fff; }
  .phone[disabled] { cursor: default; }
  .phone[disabled] img { filter: grayscale(.6) opacity(.55); }
  .phone.ring { animation: ring .5s ease-out; }
  @keyframes ring { 0% { transform: scale(1); } 30% { transform: scale(.975); } 100% { transform: scale(1); } }
  .play { position: absolute; left: 50%; bottom: 22px; translate: -50% 0; display: flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: 99px; color: #fff; font-weight: 800; font-size: 16px; white-space: nowrap; }
  .now .play { background: var(--grey); box-shadow: 0 4px 0 var(--grey-dk); }
  .now.duo .play { background: var(--green); box-shadow: 0 4px 0 var(--green-dk); }
  .bri .play { background: var(--purple); box-shadow: 0 4px 0 var(--purple-dk); }
  .phone[disabled] .play { background: #CFCFCF; box-shadow: none; }
  .play svg { width: 14px; height: 14px; fill: #fff; }
  .phone.on .play { translate: -50% 3px; box-shadow: none; }
  .waves { display: none; gap: 3px; align-items: center; height: 14px; }
  .phone.on .waves { display: flex; }
  .phone.on .play svg { display: none; }
  .waves i { width: 3px; background: #fff; border-radius: 2px; animation: wv .6s ease-in-out infinite alternate; }
  .waves i:nth-child(2) { animation-delay: .15s; } .waves i:nth-child(3) { animation-delay: .3s; }
  @keyframes wv { from { height: 4px; } to { height: 14px; } }
  .pick { display: flex; justify-content: center; gap: 10px; margin-top: 18px; }
  .pick button { font: inherit; font-weight: 800; font-size: 16px; padding: 10px 22px; border-radius: 14px; cursor: pointer; border: 2px solid var(--line); border-bottom-width: 4px; background: var(--card); color: var(--ink); }
  .pick .k.on { background: var(--grey); border-color: var(--grey-dk); color: #fff; }
  .pick .b.on { background: var(--purple); border-color: var(--purple-dk); color: #fff; }
  .fixed { text-align: center; margin-top: 18px; font-weight: 800; color: var(--green-dk); }
  .foot { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
  #count { color: var(--mute); font-weight: 700; }
  .big { font: inherit; font-weight: 800; font-size: 15px; color: #fff; background: var(--green); border: 0; border-bottom: 4px solid var(--green-dk); border-radius: 14px; padding: 8px 18px; cursor: pointer; }
  .keys { text-align: center; color: var(--mute); font-size: 13px; margin-top: 8px; }
  @media (max-width: 560px) { .pair { gap: 10px; } .phone { border-radius: 24px; padding: 6px; } .phone img { border-radius: 19px; } .play { font-size: 13px; padding: 7px 12px; bottom: 14px; } }
</style>
</head>
<body>
<main>
  <h1>Each sound on its screen</h1>
  <p class="lead">The same app screen twice. Tap the <b>left phone</b> to hear what plays there today, the <b>right phone</b> for Brilliant's sound. Then pick, and move on with the arrows.</p>
  <div class="top">
    <button class="nav" id="prev">← Back</button>
    <button class="nav" id="next">Next →</button>
    <span id="pos"></span>
    <select id="jump" aria-label="Jump to a moment"></select>
  </div>
  <div class="moment" id="moment"></div>
  <div class="pair">
    <div class="side"><h2>Now<small id="nowName"></small></h2><button class="phone now" id="nowPhone"><img id="nowImg" alt=""><span class="play"><svg viewBox="0 0 16 16"><path d="M3 1.5v13l11-6.5z"/></svg><span class="waves"><i></i><i></i><i></i></span><span id="nowLbl">Play</span></span></button></div>
    <div class="side"><h2>Brilliant<small id="briName"></small></h2><button class="phone bri" id="briPhone"><img id="briImg" alt=""><span class="play"><svg viewBox="0 0 16 16"><path d="M3 1.5v13l11-6.5z"/></svg><span class="waves"><i></i><i></i><i></i></span><span id="briLbl">Play</span></span></button></div>
  </div>
  <div id="pickBox"></div>
  <div class="foot"><span id="count"></span><button class="big" id="copy">Copy my picks</button></div>
  <p class="keys">Keys: ← → to move, 1 plays Now, 2 plays Brilliant.</p>
</main>
<script>
const KEY = "soundPicks";
/* screens that stand in for a moment the capture could not reach */
const NOTES = {
  "lesson-failed": "Screen shown: a wrong answer. The fail screen itself could not be captured.",
  "revive": "Screen shown: a wrong answer. The revive offer is on the fail screen.",
  "time-up": "Screen shown: the question with its clock. The sound plays when the clock reaches zero.",
  "place-nudge": "Screen shown: a lesson question. The «الدرس صعب عليك؟» offer drops over it."
};
let picks = {}; try { picks = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
const savePicks = () => { try { localStorage.setItem(KEY, JSON.stringify(picks)); } catch (e) {} };
let ALL = [], MAP = {}, i = 0, SND = null, cur = null;
const esc = s => String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;");

/* the app's own sound helpers, cut out of js/app.js, so "Now" is exactly what a student hears */
async function loadSound() {
  const src = (await (await fetch("../../js/app.js?t=" + Date.now())).text()).replace(/\r\n/g, "\n");
  const cut = (from, to, incl) => { const a = src.indexOf(from), b = src.indexOf(to, a + from.length); if (a < 0 || b < 0) throw new Error("not found: " + from); return src.slice(a, incl ? b + to.length : b); };
  const code = [
    "const S = { sound: true }; const buzz = () => {};",
    cut("let AC = null;", "const sndRankUnlock", false), cut("const sndRankUnlock", "\n", true),
    cut("const CORRECT_SRC", "function playCorrect() {", false), cut("function playCorrect() {", "\n}\n", true),
    cut("function cvTone(", "let CV = null;", false),
    cut("const SFX_SRC =", "function sfxPlay(", false), cut("function sfxPlay(", "\n}\n", true),
    cut("const sndTap = ", "\n", true)
  ].join("\n").split("assets/sounds/").join("../../assets/sounds/");
  return new Function(code + "\nreturn { audioCtx, beep, cvTone, cvHiss, cvSnd, sndGood, sndBad, sndWin, sndLose, sndTick, sndFreeze, sndFifty, sndChest, sndRankUp, sndRankUnlock, sndTap, playCorrect, sfxLoad, sfxPlay, SFX_SRC, loadCorrectBuffer };")();
}
const kept = m => m.brilliant === "keep", none = m => m.brilliant === "none";
function stopAll() {
  if (cur) { try { cur.pause(); } catch (e) {} cur = null; }
  document.querySelectorAll(".phone.on").forEach(p => p.classList.remove("on"));
}
function pulse(p, ms) { p.classList.remove("ring"); void p.offsetWidth; p.classList.add("ring", "on"); setTimeout(() => p.classList.remove("on"), ms); }
function playNow() {
  const m = ALL[i], p = document.getElementById("nowPhone");
  if (!m.nowCode || p.disabled) return;
  stopAll();
  if (SND) {
    SND.audioCtx();
    try { new Function(...Object.keys(SND), m.nowCode)(...Object.values(SND)); } catch (e) { console.warn(m.id, e); }
  }
  pulse(p, 900);
}
function playBri() {
  const m = ALL[i], p = document.getElementById("briPhone");
  if (p.disabled) return;
  stopAll();
  const a = new Audio(m.brilliant + ".mp3"); cur = a;
  pulse(p, 60000);
  a.onended = () => p.classList.remove("on");
  a.play().catch(() => p.classList.remove("on"));
}
function show(k) {
  stopAll();
  i = (k + ALL.length) % ALL.length;
  const m = ALL[i], shot = "screens/" + MAP[m.id] + ".jpg";
  document.getElementById("pos").textContent = (i + 1) + " / " + ALL.length;
  document.getElementById("jump").value = i;
  document.getElementById("moment").innerHTML = `<b>${esc(m.moment)}</b>${m.ar ? `<div class="ar">${esc(m.ar)}</div>` : ""}<div class="why">${esc(m.why)}</div>
    <div class="tags"><span>${esc(m.area)}</span><span>${esc(m.freq)}</span></div>${NOTES[m.id] ? `<div class="note">${NOTES[m.id]}</div>` : ""}`;
  document.getElementById("nowImg").src = shot; document.getElementById("briImg").src = shot;
  const np = document.getElementById("nowPhone"), bp = document.getElementById("briPhone");
  np.classList.toggle("duo", m.now === "duolingo");
  np.disabled = !m.nowCode; bp.disabled = kept(m) || none(m);
  document.getElementById("nowName").textContent = m.id === "correct-answer" ? "our correct sound" : m.now === "duolingo" ? "Duolingo's file" : m.now === "synth" ? "our generated beep" : "silent now";
  document.getElementById("nowLbl").textContent = m.nowCode ? "Play now" : "Silent";
  document.getElementById("briName").textContent = kept(m) ? "stays as it is" : none(m) ? "nothing fits" : m.brilliant;
  document.getElementById("briLbl").textContent = kept(m) ? "Stays" : none(m) ? "No sound" : "Play Brilliant";
  const box = document.getElementById("pickBox");
  if (kept(m)) box.innerHTML = `<div class="fixed">This one stays as it is.</div>`;
  else if (none(m)) box.innerHTML = `<div class="fixed" style="color:var(--mute)">No Brilliant sound fits here, so it stays as it is.</div>`;
  else {
    box.innerHTML = `<div class="pick"><button class="k">Keep ours</button><button class="b">Use Brilliant's</button></div>`;
    const paint = () => { box.querySelector(".k").classList.toggle("on", picks[m.id] === "k"); box.querySelector(".b").classList.toggle("on", picks[m.id] === "b"); };
    box.querySelector(".k").onclick = () => { picks[m.id] = "k"; savePicks(); paint(); count(); };
    box.querySelector(".b").onclick = () => { picks[m.id] = "b"; savePicks(); paint(); count(); };
    paint();
  }
  try { history.replaceState(null, "", "#" + m.id); } catch (e) {}
}
function count() {
  const swap = ALL.filter(m => !kept(m) && !none(m));
  const b = swap.filter(m => picks[m.id] === "b").length, k = swap.filter(m => picks[m.id] === "k").length;
  document.getElementById("count").textContent = `${b} to Brilliant, ${k} kept as ours, ${swap.length - b - k} not chosen yet`;
}
(async () => {
  const data = await (await fetch("moments.json?t=" + Date.now())).json();
  ALL = Array.isArray(data) ? data : data.moments;
  MAP = await (await fetch("screens-map.json?t=" + Date.now())).json();
  const jump = document.getElementById("jump");
  jump.innerHTML = ALL.map((m, k) => `<option value="${k}">${esc(m.area)}: ${esc(m.moment.slice(0, 70))}</option>`).join("");
  jump.onchange = () => show(+jump.value);
  document.getElementById("prev").onclick = () => show(i - 1);
  document.getElementById("next").onclick = () => show(i + 1);
  document.getElementById("nowPhone").onclick = playNow;
  document.getElementById("briPhone").onclick = playBri;
  addEventListener("keydown", e => {
    if (e.target.tagName === "SELECT") return;
    if (e.key === "ArrowRight") show(i + 1); else if (e.key === "ArrowLeft") show(i - 1);
    else if (e.key === "1") playNow(); else if (e.key === "2") playBri();
  });
  const at = ALL.findIndex(m => "#" + m.id === location.hash);
  show(at < 0 ? 0 : at); count();
  try { SND = await loadSound(); } catch (e) { document.getElementById("count").textContent += " (could not load the app's sound code: " + e.message + ")"; }
  /* Duolingo's files and our correct sound decode on the first tap, so they play at once after */
  document.addEventListener("pointerdown", function once() {
    document.removeEventListener("pointerdown", once);
    if (!SND) return;
    SND.audioCtx(); SND.loadCorrectBuffer(); Object.keys(SND.SFX_SRC).forEach(k => SND.sfxLoad(k));
  });
  document.getElementById("copy").onclick = () => {
    const swap = ALL.filter(m => !kept(m) && !none(m));
    const txt = "Sound picks:\n" + swap.map(m => `${m.id}: ${picks[m.id] === "b" ? "Brilliant " + m.brilliant : picks[m.id] === "k" ? "keep ours" : "not chosen"}`).join("\n");
    navigator.clipboard.writeText(txt).then(() => { const c = document.getElementById("copy"); c.textContent = "Copied ✓"; setTimeout(() => c.textContent = "Copy my picks", 1500); }, () => prompt("Copy this:", txt));
  };
})();
</script>
</body>
</html>
