<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>صوت القلبة</title>
<style>
  :root { --ink: #3c3c3c; --mute: #777; --line: #e5e5e5; --bg: #f7f7f7; --card: #fff; --blue: #1cb0f6; --blue-dk: #1899d6; --blue-bg: #ddf4ff; --green: #58cc02; --gold: #ffc800; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 "Baloo Bhaijaan 2", system-ui, sans-serif; }
  .wrap { display: flex; gap: 28px; padding: 24px; justify-content: center; align-items: flex-start; flex-wrap: wrap; }
  .phone { width: 390px; height: 760px; border: 10px solid #222; border-radius: 44px; overflow: hidden; background: #fff; flex: none; box-shadow: 0 12px 40px rgba(0,0,0,.15); }
  .phone iframe { width: 100%; height: 100%; border: 0; display: block; }
  .side { width: 440px; max-width: 100%; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .lead { color: var(--mute); margin: 0 0 16px; }
  .bar { display: flex; gap: 10px; margin-bottom: 18px; }
  button { font: inherit; cursor: pointer; }
  .play { flex: 1; background: var(--green); color: #fff; border: 0; border-radius: 14px; padding: 12px; font-weight: 700; font-size: 17px; box-shadow: 0 4px 0 #58a700; }
  .play:active { transform: translateY(4px); box-shadow: none; }
  .gold { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 10px 14px; font-weight: 700; color: var(--mute); box-shadow: 0 4px 0 var(--line); }
  .gold.on { border-color: var(--gold); color: #a56c00; background: #fff8de; box-shadow: 0 4px 0 var(--gold); }
  .presets { display: grid; gap: 10px; margin-bottom: 18px; }
  .pre { text-align: right; background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 10px 14px; box-shadow: 0 4px 0 var(--line); color: var(--ink); }
  .pre b { display: block; font-size: 16px; }
  .pre span { color: var(--mute); font-size: 13px; }
  .pre.on { border-color: var(--blue); background: var(--blue-bg); box-shadow: 0 4px 0 var(--blue-dk); }
  .mix { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 18px; }
  .mix h2 { font-size: 16px; margin: 0 0 8px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .row label { flex: 1; }
  .row label small { display: block; color: var(--mute); font-size: 12px; }
  .row.lit label { color: var(--blue-dk); }
  select { font: inherit; padding: 4px 6px; border: 2px solid var(--line); border-radius: 10px; background: #fff; max-width: 210px; }
  .say { background: #fff8de; border: 2px solid var(--gold); border-radius: 14px; padding: 12px 14px; }
  .say b { display: block; margin-bottom: 4px; }
  .say code { direction: ltr; display: block; text-align: left; font-size: 13px; color: #6b4a00; word-break: break-word; }
  @media (max-width: 860px) { .wrap { padding: 16px; } .phone { width: 100%; max-width: 390px; height: 700px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="phone"><iframe id="ph" src="flip-phone.html#path" title="التطبيق"></iframe></div>
  <div class="side">
    <h1>صوت القلبة على المسار</h1>
    <p class="lead">بعد ما تخلّص درس قصير ترجع للمسار: الحلقة تمتلي، وبعدها العقدة تنط وتنقلب وتنزل. اختر صوت لكل لحظة، واضغط «شغّل القلبة» وانت تشوفها.</p>
    <div class="bar">
      <button class="play" id="go">شغّل القلبة</button>
      <button class="gold" id="gold" aria-pressed="false">آخر درس (ذهبي)</button>
    </div>
    <div class="presets" id="presets"></div>
    <div class="mix">
      <h2>أو ركّبها بنفسك</h2>
      <div id="rows"></div>
    </div>
    <div class="say"><b>إذا عجبك، قول لي رقم الخيار — أو انسخ هذا:</b><code id="pick"></code></div>
  </div>
</div>
<script>
/* dev page, never shipped: tries sounds on the path flip (pathPay → ringPay →
   coinPay). flip-phone.html hands this page the two beats the app sounds on —
   "seg", when the earned segment fills and its diamonds pop, and "coin", when
   the coin jump starts — and the page plays the picked file on each moment of
   the jump, measured off PAY_COIN: take-off 136ms, edge-on 600ms, landing
   1460ms; on a node's last lesson the gold beat plays as it comes back gold
   (663ms). */
(function () {
  const DUO = "duo:node-complete";
  const FILES = ["highlight-node", "xp-tally-1", "xp-tally-2", "xp-tally-3", "xp-tally-4", "xp-tally-5", "xp-tally-final", "level-passed", "level-mastered",
    "lesson-complete", "course-complete", "streak-charge", "streak-celebration", "drag-started", "drag-released", "diagnostic-complete", "diagnostic-answer",
    "endstate", "hint", "skip", "start-lesson", "toggle-on", "toggle-off", "continue", "lightweight-choice", "router-koji-recommendation",
    "assessment-submit", "tutor-xp-countup-start", "tutor-xp-countup-stop", "correct"];
  const BEATS = [
    ["seg", "الحلقة تمتلي", "الجزء الجديد يتلوّن ويطلع منه ٣ ماسات"],
    ["up", "العقدة تنط", "تقفز من مكانها (بعد الحلقة بربع ثانية)"],
    ["turn", "تنقلب", "وهي بالجو، تنقلب على جنبها"],
    ["land", "تنزل", "ترجع مكانها وتنضغط"],
    ["gold", "تصير ذهبية", "بس في آخر درس من العقدة"]
  ];
  const AT = { up: 136, turn: 600, land: 1460, gold: 663 };
  const PRESETS = [
    { n: "١", t: "اللي في التطبيق", d: "اختيارك: نطّة خفيفة (٦) — وفي آخر درس لمعة وحدة (٥) بدون آخر جزء منها", p: { seg: "toggle-on", up: "lightweight-choice", turn: "hint" }, pg: { land: "highlight-node", gold: "level-passed" } },
    { n: "٠", t: "القديم", d: "قبل اختيارك: صوت الحلقة، وبعده صوت دولينجو للقفزة", p: { seg: "highlight-node", up: DUO } },
    { n: "٢", t: "قفزة وهبوط", d: "نقرة للحلقة، شدّة وهي تنط، وارتطام خفيف وهي تنزل", p: { seg: "xp-tally-1", up: "drag-started", land: "drag-released", gold: "level-passed" } },
    { n: "٣", t: "شحنة", d: "صوت واحد يشحن من أول القفزة لين تنزل", p: { up: "streak-charge", gold: "level-mastered" } },
    { n: "٤", t: "عدّاد", d: "الحلقة نغمة، والهبوط نغمة أعلى منها", p: { seg: "xp-tally-3", land: "xp-tally-final", gold: "lesson-complete" } },
    { n: "٥", t: "لمعة وحدة", d: "بدون صوت للحلقة — صوت واحد بس لما تنزل", p: { land: "highlight-node", gold: "level-passed" } },
    { n: "٦", t: "نطّة خفيفة", d: "نقرة خفيفة وهي تنط، ولمعة وهي تنقلب", p: { seg: "toggle-on", up: "lightweight-choice", turn: "hint", gold: "level-mastered" } }
  ];
  let cur = Object.assign({}, PRESETS[0].p), gold = false, preset = 0, timers = [];
  const pick = i => Object.assign({}, gold && PRESETS[i].pg || PRESETS[i].p);
  const $ = s => document.querySelector(s);
  

  /* sounds */
  let ac = null; const buf = {};
  const ctx = () => { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume(); return ac; };
  const url = f => f === DUO ? "../../assets/sounds/node-complete.mp3" : f + ".mp3";
  const load = f => buf[f] || (buf[f] = fetch(url(f)).then(r => r.arrayBuffer()).then(ab => ctx().decodeAudioData(ab)));
  const play = (f, vol, end) => { if (!f) return; load(f).then(b => { const s = ctx().createBufferSource(), g = ac.createGain(); s.buffer = b; g.gain.value = vol || .9; s.connect(g); g.connect(ac.destination); s.start();
    if (end) { const t = ac.currentTime + end; g.gain.setValueAtTime(vol || .9, t - .12); g.gain.linearRampToValueAtTime(0, t); s.stop(t); } }); };
  /* as the app: on the gold beat level-passed keeps only its first hit (SND_END) */
  const CUT = { "level-passed": 1.25 };
  const lit = k => { const r = document.querySelector(`.row[data-k="${k}"]`); if (!r) return; r.classList.add("lit"); setTimeout(() => r.classList.remove("lit"), 500); };
  window.__FLIP = function (stage, isGold) {
    if (stage === "seg") { play(cur.seg); lit("seg"); return; }
    ["up", "turn", "land"].forEach(k => timers.push(setTimeout(() => { play(cur[k], cur[k] === DUO ? .8 : .9); lit(k); }, AT[k])));
    if (isGold) timers.push(setTimeout(() => { play(cur.gold, .9, CUT[cur.gold]); lit("gold"); }, AT.gold));
  };

  /* the panel */
  const name = f => f === DUO ? "دولينجو: node-complete" : f;
  const opts = v => [`<option value="">— بدون صوت —</option>`, `<option value="${DUO}"${v === DUO ? " selected" : ""}>${name(DUO)}</option>`]
    .concat(FILES.map(f => `<option value="${f}"${v === f ? " selected" : ""}>${f}</option>`)).join("");
  function paint() {
    $("#presets").innerHTML = PRESETS.map((x, i) => `<button class="pre${i === preset ? " on" : ""}" data-i="${i}"><b>${x.n}. ${x.t}</b><span>${x.d}</span></button>`).join("");
    $("#rows").innerHTML = BEATS.map(([k, t, s]) => `<div class="row" data-k="${k}"><label>${t}<small>${s}</small></label><select data-k="${k}">${opts(cur[k] || "")}</select></div>`).join("");
    const p = preset >= 0 ? `الخيار ${PRESETS[preset].n} — ` : "تركيبتي — ";
    $("#pick").textContent = p + BEATS.map(([k]) => `${k}: ${cur[k] ? name(cur[k]) : "-"}`).join(" | ");
    try { localStorage.setItem("flipPick", JSON.stringify({ cur, preset })); } catch (e) {}
  }
  /* one flip at a time: a new one reloads the phone, so the last one's beats never play over it */
  function run() {
    timers.forEach(clearTimeout); timers = [];
    ctx(); Object.values(cur).forEach(f => f && load(f));
    const fr = $("#ph");
    /* the phone fires load twice (its loader, then the app it writes): flip once */
    let fired = false;
    fr.onload = () => setTimeout(() => { const w = fr.contentWindow; if (fired || !w || !w.A || !w.A.debugPathPay) return; fired = true; w.A.debugPathPay(gold); }, 900);
    fr.src = "flip-phone.html?dev=1&r=" + Date.now() + "#path";
  }
  $("#presets").addEventListener("click", e => { const b = e.target.closest(".pre"); if (!b) return; preset = +b.dataset.i; cur = pick(preset); paint(); run(); });
  $("#rows").addEventListener("change", e => { const s = e.target.closest("select"); if (!s) return; cur[s.dataset.k] = s.value; preset = -1; paint(); if (s.value) { ctx(); play(s.value); } });
  $("#go").addEventListener("click", run);
  $("#gold").addEventListener("click", () => { gold = !gold; if (preset >= 0) cur = pick(preset); $("#gold").classList.toggle("on", gold); $("#gold").setAttribute("aria-pressed", gold); run(); });
  paint();
})();
</script>
</body>
</html>
