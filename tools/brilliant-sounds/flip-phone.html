<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Flip Phone</title>
</head>
<body style="margin:0;background:#fff;font:15px system-ui,sans-serif;color:#777">
<p id="boot" style="padding:24px">Loading the app…</p>
<script>
/* dev harness, never shipped: boots the real app (preview.html + js/app.js, read
   from disk) for flip.html. The path flip's two sound lines — the ring's
   segment (ringPay) and the coin jump (coinPay) — hand their beat to the page
   above (parent.__FLIP), which plays the sounds being tried. Every other sound
   is the app's own. Each patch is anchored on exact code text and refuses to
   run when the anchor is not found exactly once. */
(async function () {
  const qs = new URLSearchParams(location.search);
  if (qs.get("dev") !== "1") { qs.set("dev", "1"); location.replace(location.pathname + "?" + qs + location.hash); return; }
  const bust = "?t=" + Date.now();
  const say = t => { const b = document.getElementById("boot"); if (b) b.textContent = t; };
  let pv, src;
  try {
    [pv, src] = await Promise.all([
      fetch("../../preview.html" + bust).then(r => r.text()),
      fetch("../../js/app.js" + bust).then(r => r.text())
    ]);
  } catch (e) { say("Could not load the app: " + e.message); return; }
  src = src.replace(/\r\n/g, "\n");
  const P = [
    [`snd("ring-segment-pay", () => beep([[784, .07], [1047, .14]]), exit ? "" : undefined);`, `if (window.__FLIP) __FLIP("seg"); else `],
    [`if (pay.gold) setTimeout(() => snd("node-gold-land"`, `if (window.__FLIP) __FLIP("coin", pay.gold); else `]
  ];
  for (const [a, pre] of P) {
    if (src.split(a).length !== 2) { say("app.js changed: the flip's sound line was not found. Tell Claude."); return; }
    src = src.replace(a, () => pre + a);
  }
  const hook = `window.__FLIP = function (s, g) { try { parent !== window && parent.__FLIP && parent.__FLIP(s, g); } catch (e) {} };`;
  const esc = s => s.replace(/<\/script/gi, "<\\/script");
  let html = pv.replace(/\r\n/g, "\n");
  html = html.replace(/<head>/i, () => `<head>\n<base href="../../">\n<script>${hook}<\/script>`);
  const tag = /<script src="js\/app\.js"><\/script>/;
  if (!tag.test(html)) { say("preview.html no longer loads js/app.js the way this harness expects."); return; }
  html = html.replace(tag, () => `<script>${esc(src)}\n//# sourceURL=app.flip.js\n<\/script>`);
  document.open();
  document.write(html);
  document.close();
})();
</script>
</body>
</html>
