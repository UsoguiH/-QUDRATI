<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Type Phone</title>
</head>
<body style="margin:0;background:#fff;font:15px system-ui,sans-serif;color:#777">
<p id="boot" style="padding:24px">Loading the app…</p>
<script>
/* dev harness, never shipped: boots the real app (preview.html + js/app.js, read
   from disk) for type.html. Each word فهيم's bubble types out (sayPlay) hands
   its beat to the page above (parent.__TYPE: blue word or not, which word, how
   many), which plays the typing sound being tried. Every other sound is the
   app's own. The patch is anchored on exact code text and refuses to run when
   the anchor is not found exactly once. */
(async function () {
  const qs = new URLSearchParams(location.search);
  if (qs.get("dev") !== "1") { qs.set("dev", "1"); location.replace(location.pathname + "?" + qs + location.hash); return; }
  const bust = "?t=" + Date.now();
  const say = t => { const b = document.getElementById("boot"); if (b) b.textContent = t; };
  let pv, src;
  try {
    [pv, src] = await Promise.all([
      fetch("../../preview.html" + bust).then(r => r.text()),
      fetch("../../js/app.js" + bust).then(r => r.text())
    ]);
  } catch (e) { say("Could not load the app: " + e.message); return; }
  src = src.replace(/\r\n/g, "\n");
  const P = [
    [`snd("say-word", null, undefined, (w.classList.contains("hl") ? 1.16 : 1) * (.92 + Math.random() * .16));`, `if (window.__TYPE) __TYPE(w.classList.contains("hl"), k, ws.length); else `]
  ];
  for (const [a, pre] of P) {
    if (src.split(a).length !== 2) { say("app.js changed: the typing sound line was not found. Tell Claude."); return; }
    src = src.replace(a, () => pre + a);
  }
  const hook = `window.__TYPE = function (hl, k, n) { try { parent !== window && parent.__TYPE && parent.__TYPE(hl, k, n); } catch (e) {} };`;
  const esc = s => s.replace(/<\/script/gi, "<\\/script");
  let html = pv.replace(/\r\n/g, "\n");
  html = html.replace(/<head>/i, () => `<head>\n<base href="../../">\n<script>${hook}<\/script>`);
  const tag = /<script src="js\/app\.js"><\/script>/;
  if (!tag.test(html)) { say("preview.html no longer loads js/app.js the way this harness expects."); return; }
  html = html.replace(tag, () => `<script>${esc(src)}\n//# sourceURL=app.type.js\n<\/script>`);
  document.open();
  document.write(html);
  document.close();
})();
</script>
</body>
</html>
