<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قدراتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap">
<style>
:root {
  --green: #58CC02;        --green-dk: #58A700;
  --blue: #1CB0F6;         --blue-dk: #1899D6;
  --blue-light: #DDF4FF;   --blue-border: #63C9F9;
  --purple: #CE82FF;       --purple-dk: #A568CC;
  --purple-tint: #EDD1FF;  --purple-wash: #F7EDFF;
  --gold: #FFC800;         --gold-dk: #E6A000;     --gold-bg: #FFF4BF;
  --brown: #AA572A;        --brown-dk: #7A3B12;
  --red: #FF4B4B;          --red-soft: #FFB2B2;
  --orange: #FF9600;       --orange-dk: #E07800;   --orange-bg: #FFEFD6;   --orange-edge: #FFCB85;
  --ink: #4B4B4B;          --gray: #777777;        --gray-icon: #AFAFAF;
  --line: #E5E5E5;         --snow: #FFFFFF;        --polar: #F7F7F7;      --dash: #CFCFCF;
  --green-lip: #478700;    --green-pale: #A5ED6E;
  --green-bg: #D6FFB8;     --red-bg: #FFDFE0;      --red-dk2: #EA2B2B;
  --chest: #1E3A8A;
  --font: 'Baloo Bhaijaan 2', 'Segoe UI', Tahoma, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--snow); }
body { font-family: var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font-family: var(--font); cursor: pointer; -webkit-tap-highlight-color: transparent; color: inherit; }
#app { position: relative; height: 100dvh; max-width: 430px; margin: 0 auto; display: flex; flex-direction: column; overflow: hidden; background: var(--snow); }

.top { display: flex; align-items: center; gap: 10px; padding: 16px 16px 4px; min-height: 52px; }
.bar { flex: 1; height: 16px; border-radius: 8px; background: var(--line); overflow: hidden; position: relative; }
.bar i { position: absolute; inset: 0 0 0 auto; width: 0; border-radius: 8px; background: var(--green); transition: width .45s cubic-bezier(.3,1.3,.5,1); }
.bar i::after { content: ""; position: absolute; top: 4px; inset-inline: 8px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.3); }
.run { display: flex; align-items: center; gap: 3px; font-weight: 800; font-size: 18px; color: var(--gray-icon); }
.run svg { width: 22px; height: 26px; }
.run .fl { fill: var(--line); transition: fill .2s; } .run .fi { fill: var(--polar); transition: fill .2s; }
.run.hot { color: var(--orange); } .run.hot .fl { fill: var(--orange); } .run.hot .fi { fill: var(--gold); }
.shd { width: 24px; height: 26px; display: grid; place-items: center; }
.shd svg { width: 22px; height: 24px; }
.shd .sf { fill: var(--blue); transition: fill .25s; } .shd .ss { fill: var(--blue-dk); transition: fill .25s; }
.shd.off .sf { fill: var(--line); } .shd.off .ss { fill: var(--dash); }
.xpp { position: relative; display: flex; align-items: center; gap: 3px; font-weight: 800; font-size: 16px; color: var(--gold-dk); white-space: nowrap; }
.xpp b { font-size: 18px; }
.xpf { position: absolute; top: -4px; inset-inline-start: 50%; translate: 50% 0; font-size: 15px; font-weight: 800; color: var(--gold-dk); pointer-events: none; white-space: nowrap; }
.dvw { margin: 0 .1em; display: inline-flex; align-items: center; justify-content: center; position: relative; vertical-align: -.04em; }
.dvw svg { width: .62em; height: .62em; fill: currentColor; display: block; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
#app.bare .top { visibility: hidden; }

.kick { margin: 12px 16px 0; font-size: 14px; font-weight: 800; color: var(--purple-dk); min-height: 20px; }
.ttl { margin: 0 16px; font-size: 22px; font-weight: 800; line-height: 1.4; }
.ttl b { color: var(--blue); }
#stage { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 14px 16px 16px; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
.body::-webkit-scrollbar { display: none; }

.foot { padding: 10px 16px 22px; border-top: 2px solid var(--line); }
#app.nofoot .foot { display: none; }
.btn { display: block; width: 100%; height: 50px; border: 0; border-radius: 16px; font: 800 17px var(--font); color: var(--snow); background: var(--green); box-shadow: 0 5px 0 var(--green-lip); }
.btn:not(:disabled):active { translate: 0 5px; box-shadow: 0 0 0 var(--green-lip); }
.btn:disabled { background: var(--line); box-shadow: 0 5px 0 var(--dash); color: var(--gray-icon); cursor: default; }
.btn.red { background: var(--red); box-shadow: 0 5px 0 var(--red-dk2); }
.btn.red:active { box-shadow: 0 0 0 var(--red-dk2); }
.btn.blue { background: var(--blue); box-shadow: 0 5px 0 var(--blue-dk); }
.btn.blue:active { box-shadow: 0 0 0 var(--blue-dk); }

.sheet { position: absolute; inset: auto 0 0 0; z-index: 30; padding: 16px 16px 22px; background: var(--green-bg); translate: 0 110%; visibility: hidden; transition: translate .28s cubic-bezier(.3,1.2,.5,1), visibility 0s .28s; }
.sheet.on { translate: 0 0; visibility: visible; transition: translate .28s cubic-bezier(.3,1.2,.5,1); }
.sheet.bad { background: var(--red-bg); }
.sh-h { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 800; color: var(--green-dk); }
.sheet.bad .sh-h { color: var(--red-dk2); }
.sh-i { width: 34px; height: 34px; border-radius: 50%; background: var(--snow); display: grid; place-items: center; flex: none; }
.sh-i svg { width: 20px; height: 20px; }
.sh-l { margin: 6px 2px 14px; font-size: 17px; font-weight: 700; color: var(--green-dk); line-height: 1.55; min-height: 24px; }
.sheet.bad .sh-l { color: var(--red-dk2); }
.sh-l b { font-weight: 800; }

.card { border: 2px solid var(--line); border-bottom-width: 5px; border-radius: 20px; padding: 14px 12px; background: var(--snow); }
.big { display: flex; align-items: center; justify-content: center; gap: .28em; font-size: 28px; font-weight: 800; line-height: 1.5; white-space: nowrap; }
.big > * { flex: none; }
.big .op { color: var(--gray-icon); }
.big .q { color: var(--gray-icon); }
.big .ans { color: var(--green-dk); }
.note { text-align: center; font-size: 15.5px; font-weight: 700; color: var(--gray); line-height: 1.5; }
.note b { color: var(--ink); }
.tell { min-height: 28px; margin-top: 12px; text-align: center; font-size: 16px; font-weight: 800; color: var(--red-dk2); line-height: 1.45; }
.tell.ok { color: var(--green-dk); }
.tell.soft { color: var(--gray); }

.ch { display: inline-flex; align-items: center; justify-content: center; padding: .05em .42em 0; border-radius: .5em; font-weight: 800; line-height: 1.45; white-space: nowrap; }
.k-blue { background: var(--blue-light); color: var(--blue-dk); box-shadow: 0 .13em 0 var(--blue-border); }
.k-purple { background: var(--purple-wash); color: var(--purple-dk); box-shadow: 0 .13em 0 var(--purple-tint); }
.k-orange { background: var(--orange-bg); color: var(--orange-dk); box-shadow: 0 .13em 0 var(--orange-edge); }
.k-gold { background: var(--gold-bg); color: var(--brown); box-shadow: 0 .13em 0 var(--gold); }

.opts { display: grid; gap: 10px; margin-top: 16px; }
.opts.c3 { grid-template-columns: repeat(3, 1fr); }
.opts.c2 { grid-template-columns: 1fr 1fr; }
.opt { min-height: 60px; border-radius: 16px; border: 2px solid var(--line); border-bottom-width: 5px; background: var(--snow); font: 800 23px/1.2 var(--font); color: var(--ink); padding: 8px; }
.opt:not(:disabled):active { border-bottom-width: 2px; translate: 0 3px; }
.opt.sel { border-color: var(--blue-border); background: var(--blue-light); color: var(--blue-dk); }
.opt.ok { border-color: var(--green-pale); background: var(--green-bg); color: var(--green-dk); }
.opt.no { border-color: var(--red-soft); background: var(--red-bg); color: var(--red-dk2); }
.opt.dim { opacity: .4; }
.opt:disabled { cursor: default; }
.opt small { display: block; font-size: 14px; font-weight: 700; opacity: .8; }
.rpick { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; min-height: 64px; }
.rpick .ri { width: 32px; height: 32px; border-radius: 10px; background: var(--purple); box-shadow: 0 3px 0 var(--purple-dk); display: grid; place-items: center; flex: none; }
.rpick .ri svg { width: 22px; height: 22px; }
.rpick.g .ri { background: var(--blue); box-shadow: 0 3px 0 var(--blue-dk); }

.rc { scroll-margin-bottom: 14px; position: relative; border-radius: 22px; background: var(--snow); border: 2px solid var(--line); border-bottom-width: 6px; overflow: hidden; transform-origin: 50% 100%; }
.rc-h { display: flex; align-items: center; gap: 10px; padding: 9px 12px 9px 10px; background: var(--purple); color: var(--snow); box-shadow: inset 0 -4px 0 var(--purple-dk); }
.rc.g .rc-h { background: var(--blue); box-shadow: inset 0 -4px 0 var(--blue-dk); }
.rc-ic { width: 34px; height: 34px; border-radius: 11px; background: rgba(255,255,255,.22); display: grid; place-items: center; flex: none; }
.rc-ic svg { width: 24px; height: 24px; }
.rc-t { flex: 1; min-width: 0; line-height: 1.15; padding-bottom: 3px; }
.rc-t small { display: block; font-size: 12.5px; font-weight: 800; opacity: .85; }
.rc-t b { font-size: 19px; font-weight: 800; }
.rc-new { font-size: 12.5px; font-weight: 800; background: var(--gold); color: var(--brown-dk); padding: 2px 9px 0; border-radius: 9px; box-shadow: 0 2px 0 var(--gold-dk); margin-bottom: 3px; }
.rc-re { width: 36px; height: 36px; border-radius: 12px; border: 0; background: rgba(255,255,255,.22); display: grid; place-items: center; flex: none; padding: 0; margin-bottom: 3px; }
.rc-re svg { width: 20px; height: 20px; }
.rc-re:active { translate: 0 2px; }
.rc-pic { margin: 10px 10px 0; border-radius: 16px; background: var(--polar); display: flex; justify-content: center; padding: 6px 6px 4px; }
.rc-pic svg { width: 100%; max-width: 280px; height: auto; display: block; overflow: visible; }
.rc-out { min-height: 28px; margin: 6px 12px 0; text-align: center; font-size: 17px; font-weight: 800; color: var(--gray); white-space: nowrap; overflow: hidden; }
.rc-out .ch { font-size: 16px; }
.rc-pre { text-align: center; font-size: 14px; font-weight: 800; color: var(--gray); margin-top: 4px; }
.rc-eq { display: flex; align-items: center; justify-content: center; gap: .26em; padding: 6px 10px 14px; font-size: 18px; font-weight: 800; white-space: nowrap; }
.rc-eq > * { flex: none; }
.rc-eq .op { color: var(--gray-icon); }
.tk { border: 0; font: 800 1em/1.55 var(--font); padding: .05em .5em 0; border-radius: .55em; background: var(--line); color: var(--gray); box-shadow: 0 .16em 0 var(--dash); transition: background .2s, color .2s, box-shadow .2s, opacity .2s; }
.tk:active { translate: 0 .1em; box-shadow: 0 .06em 0 var(--dash); }
.tk.lit.c-b { background: var(--blue-light); color: var(--blue-dk); box-shadow: 0 .16em 0 var(--blue-border); }
.tk.lit.c-p { background: var(--purple-wash); color: var(--purple-dk); box-shadow: 0 .16em 0 var(--purple-tint); }
.tk.lit.c-o { background: var(--orange-bg); color: var(--orange-dk); box-shadow: 0 .16em 0 var(--orange-edge); }
.tk.lit.c-g { background: var(--gold-bg); color: var(--brown); box-shadow: 0 .16em 0 var(--gold); }
.tk.f.c-b { background: var(--blue); color: var(--snow); box-shadow: 0 .16em 0 var(--blue-dk); }
.tk.f.c-p { background: var(--purple); color: var(--snow); box-shadow: 0 .16em 0 var(--purple-dk); }
.tk.f.c-o { background: var(--orange); color: var(--snow); box-shadow: 0 .16em 0 var(--orange-dk); }
.tk.f.c-g { background: var(--gold); color: var(--brown-dk); box-shadow: 0 .16em 0 var(--gold-dk); }
.rc.foc .tk.lit:not(.f) { opacity: .45; }
.rc-hint { text-align: center; font-size: 12.5px; font-weight: 800; color: var(--gray-icon); margin: -6px 0 8px; opacity: 0; transition: opacity .3s; }
.rc.ready .rc-hint { opacity: 1; }

.pp { opacity: 0; transition: opacity .25s; }
.pp.on { opacity: 1; }
svg .dot circle { fill: var(--line); }
svg .bdot circle { fill: var(--blue); }
svg .odot circle { fill: var(--orange); }
svg .pdot circle { fill: var(--purple); }
svg .brk-b { stroke: var(--blue); } svg .brk-p { stroke: var(--purple); } svg .brk-o { stroke: var(--orange); }
svg .t-b { fill: var(--blue-dk); } svg .t-p { fill: var(--purple-dk); } svg .t-o { fill: var(--orange-dk); } svg .t-g { fill: var(--brown); } svg .t-i { fill: var(--ink); } svg .t-w { fill: var(--snow); }
svg .tl-b { fill: var(--snow); stroke: var(--line); }
svg .tl-on { fill: var(--blue-light); stroke: var(--blue); }
svg .arc0 { stroke: var(--line); fill: none; }
svg .arc1 { stroke: var(--purple); fill: none; }
svg .bg-g { fill: var(--gold); }
svg text { font-family: var(--font); font-weight: 800; }
svg .rw { transform-box: fill-box; transform-origin: 50% 50%; }

.sum .n { display: inline-block; }
.big .n.odd { color: var(--orange-dk); background: var(--orange-bg); border-radius: .3em; padding: 0 .18em; box-shadow: 0 .1em 0 var(--orange-edge); }
.brg { padding: 10px 8px 6px; }
.brg svg { max-width: 300px; }
.bq { margin-top: 12px; }
.inv-h { text-align: center; font-size: 14px; font-weight: 800; color: var(--gray); margin-top: 10px; }
.gridcard { padding: 8px 10px 10px; margin-bottom: 12px; }
.gridcard svg { width: 100%; max-width: 270px; height: auto; display: block; margin: 0 auto; overflow: visible; }
.cap { text-align: center; font-size: 16px; font-weight: 800; min-height: 26px; margin-top: 2px; white-space: nowrap; }
.rslot { margin-top: 14px; }

.pw { position: relative; padding: 96px 6px 8px; }
.pw svg.arcs { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.nums { display: flex; justify-content: center; gap: 4px; }
.nt { flex: 1 1 30px; max-width: 34px; height: 46px; min-width: 0; padding: 0 0 2px; border-radius: 11px; border: 2px solid var(--line); border-bottom-width: 4px; background: var(--snow); display: grid; place-items: center; font: 800 18px/1 var(--font); color: var(--ink); transition: background .2s, border-color .2s, color .2s; }
.nt:not(:disabled):active { border-bottom-width: 2px; translate: 0 2px; }
.nt:disabled { cursor: default; }
.nt.next { border-color: var(--blue-border); animation: nudge 1.3s ease-in-out infinite; }
@keyframes nudge { 0%, 100% { translate: 0 0; } 50% { translate: 0 -5px; } }
.p0 { --pc: var(--purple); --pd: var(--purple-dk); --pl: var(--purple-wash); }
.p1 { --pc: var(--orange); --pd: var(--orange-dk); --pl: var(--orange-bg); }
.p2 { --pc: var(--green); --pd: var(--green-dk); --pl: var(--green-bg); }
.p3 { --pc: var(--blue); --pd: var(--blue-dk); --pl: var(--blue-light); }
.p4 { --pc: var(--red); --pd: var(--red-dk2); --pl: var(--red-bg); }
.nt.pr { background: var(--pl); border-color: var(--pc); color: var(--pd); }
.pchips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 14px; min-height: 34px; }
.pc { display: inline-flex; align-items: center; justify-content: center; padding: .1em .55em 0; border-radius: .55em; font-size: 16px; font-weight: 800; color: var(--snow); background: var(--pc); box-shadow: 0 .14em 0 var(--pd); white-space: nowrap; }
.aft { margin-top: 16px; }
.say { text-align: center; font-size: 19px; font-weight: 800; line-height: 1.6; }

.chain { display: flex; flex-direction: column; gap: 8px; }
.ln { display: flex; align-items: center; gap: 10px; border: 2px solid var(--line); border-radius: 16px; padding: 6px 10px; min-height: 52px; }
.ln .no { width: 26px; height: 26px; border-radius: 50%; background: var(--polar); color: var(--gray-icon); font-size: 14px; font-weight: 800; display: grid; place-items: center; flex: none; }
.ln .big { flex: 1; min-width: 0; font-size: 21px; justify-content: flex-start; }
.ln .big .ch { font-size: 19px; }
.ln .sm { font-size: 13px; font-weight: 800; color: var(--gray-icon); white-space: nowrap; flex: none; }

.stw { display: grid; grid-template-columns: auto 1fr; grid-template-areas: "body side" "bot ."; justify-content: center; align-items: end; gap: 6px 8px; margin: 4px auto 0; }
.stw .sbody { grid-area: body; }
.stw .sside { grid-area: side; align-self: stretch; display: flex; align-items: center; gap: 6px; }
.stw .sside i { width: 4px; align-self: stretch; border-radius: 2px; background: var(--purple); }
.stw .sbot { grid-area: bot; display: flex; flex-direction: column; align-items: stretch; gap: 4px; }
.stw .sbot i { height: 4px; border-radius: 2px; background: var(--blue); }
.stw .sbot .ch { align-self: center; }
.stw svg { display: block; overflow: visible; }
.stw .sb { fill: var(--blue); } .stw .so { fill: var(--orange); }
.stw .sb, .stw .so { transform-box: fill-box; }
.stw .sb { transform-origin: 50% 100%; } .stw .so { transform-origin: 50% 0%; }
.hid { visibility: hidden; }
.scap { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; align-items: center; min-height: 64px; }
.scap .big { font-size: 22px; }
.scap .big .ch { font-size: 20px; }

.sort { flex: 1; display: flex; flex-direction: column; }
.slot { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 150px; }
.scard { width: 100%; border: 2px solid var(--line); border-bottom-width: 6px; border-radius: 22px; background: var(--snow); padding: 22px 12px 18px; text-align: center; position: relative; }
.scard .cnt { position: absolute; top: 8px; right: 16px; font-size: 13px; font-weight: 800; color: var(--gray-icon); }
.scard .big { font-size: 30px; }
.recap { width: 100%; display: flex; flex-direction: column; gap: 8px; }
.rcp { display: flex; align-items: center; gap: 10px; border: 2px solid var(--green-pale); background: var(--green-bg); border-radius: 16px; padding: 6px 10px; }
.rcp.x { border-color: var(--red-soft); background: var(--red-bg); }
.rcp .ri { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; flex: none; background: var(--purple); box-shadow: 0 3px 0 var(--purple-dk); }
.rcp .ri.gauss { background: var(--blue); box-shadow: 0 3px 0 var(--blue-dk); }
.rcp .ri.none { background: var(--gray-icon); box-shadow: 0 3px 0 var(--gray); }
.rcp .ri svg { width: 20px; height: 20px; }
.rcp .big { flex: 1; min-width: 0; font-size: 20px; justify-content: flex-start; }
.bins { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bin { border-radius: 20px; border: 2px solid var(--line); border-bottom-width: 6px; background: var(--snow); padding: 12px 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 5px; min-height: 120px; }
.bin:active { border-bottom-width: 3px; translate: 0 3px; }
.bin .bi { width: 46px; height: 46px; border-radius: 14px; background: var(--purple); box-shadow: 0 4px 0 var(--purple-dk); display: grid; place-items: center; }
.bin .bi svg { width: 30px; height: 30px; }
.bin.g .bi { background: var(--blue); box-shadow: 0 4px 0 var(--blue-dk); }
.bin b { font-size: 16px; font-weight: 800; line-height: 1.3; }
.bin small { font-size: 12.5px; font-weight: 700; color: var(--gray); line-height: 1.2; }
.bin .dots { display: flex; gap: 4px; min-height: 10px; }
.bin .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--green); }
.bin.none { grid-column: 1 / -1; flex-direction: row; justify-content: center; min-height: 58px; gap: 10px; padding: 8px; }
.bin.none .bi { width: 34px; height: 34px; border-radius: 11px; background: var(--gray-icon); box-shadow: 0 3px 0 var(--gray); }
.bin.none .bi svg { width: 18px; height: 18px; }
.bin.none .dots { min-height: 0; }
.bin.flash { border-color: var(--red-soft); background: var(--red-bg); }
.bin.hit { border-color: var(--green-pale); background: var(--green-bg); }

.word { font-size: 19px; font-weight: 700; line-height: 1.65; text-align: center; padding: 14px 12px; }
.word b { color: var(--ink); font-weight: 800; }
.step2 { margin-top: 12px; }
.q2 { text-align: center; font-size: 15px; font-weight: 800; color: var(--gray); margin-bottom: -6px; }

.who { display: flex; align-items: flex-start; gap: 10px; }
.av { width: 50px; height: 50px; border-radius: 50%; background: var(--orange); box-shadow: 0 4px 0 var(--orange-dk); color: var(--snow); font-size: 24px; font-weight: 800; display: grid; place-items: center; flex: none; }
.bub { position: relative; flex: 1; border: 2px solid var(--line); border-radius: 16px; padding: 8px 12px 6px; font-size: 16px; font-weight: 700; }
.bub::before { content: ""; position: absolute; top: 16px; right: -8px; width: 12px; height: 12px; background: var(--snow); border-right: 2px solid var(--line); border-top: 2px solid var(--line); transform: rotate(45deg); }
.work { margin-top: 18px; }

            tell.textContent = ''; tell.className = 'tell';
            if (i < deck.length) return show();
            $('.slot', b).innerHTML = `<div class="recap">${res.map(r => `<div class="rcp${r.ok ? '' : ' x'}"><span class="ri ${r.d.k}">${ICON[r.d.k]}</span><div class="big">${toks(r.d.long)}</div></div>`).join('')}</div>`;
            $('.slot', b).style.justifyContent = 'flex-start'; $('.bins', b).style.display = 'none'; fitAll(b);
            $$('.rcp', b).forEach((x, k) => { rise(x, k * 70); const m = res[k].d.mark; if (m) $$('.n', x).forEach(n => m.includes(n.textContent) && n.classList.add('odd')); });
            if (missed.length) comeback({ t: 'sort', redo: missed.slice() });
            const all = hits === deck.length;
            showSheet(hits >= deck.length - 1, `${ar(hits)} من ${ar(deck.length)}${all ? '!' : ''}`,
              all ? 'ما طحت في الفخ — وهذا اللي <b>يطيّح الناس</b> في الاختبار' : missed.length && !spec.again && phase === 'lesson' ? 'اللي غلطت فيه بيرجع لك بأرقام جديدة' : 'الفرق: <b>نفس العدد</b>؟ ولا <b>ورا بعض من ١</b>؟');
          }, 1350);
        } else {
          bad(); buzz([30, 40, 30]); shake(card); sink(bn); bn.classList.add('flash'); setTimeout(() => bn.classList.remove('flash'), 500);
          if (firstTry) { firstTry = false; missed.push(d); score(false, d.k === 'none' ? null : d.k); }
          tell.className = 'tell'; tell.innerHTML = 'لا، ' + why(d); markOdd(d);
        }
      });
    },

    word(spec) {
      const R = spec.rule;
      let v, tpl;
      if (R === 'gauss') { v = G.gauss(spec.again ? freshL([16, 18, 22, 26]) : 14); tpl = WORD.gauss[spec.again ? 1 : 0]; }
      else { v = G.rep(...G.freshRep()); tpl = pick(WORD.rep); }
      const b = frame({ kick: phase === 'review' ? 'جولة أخيرة' : 'مسألة قدرات', title: 'وش القاعدة؟ <b>بعدين احسب</b>' });
      b.innerHTML = `<div class="card word">${tpl(v)}</div>
        <div class="opts c2 rp">${shuf(['rep', 'gauss']).map(k => `<button class="opt rpick${k === 'gauss' ? ' g' : ''}" data-k="${k}"><span class="ri">${ICON[k]}</span>${NAME[k]}</button>`).join('')}</div>
        <div class="step2"></div>`;
      rise($('.card', b));
      let missed = false;
      const pickRule = () => choose(b, '.rpick', o => {
        if (o.dataset.k === R) {
          $$('.rpick', b).forEach(x => { if (x !== o) x.classList.add('dim'); });
          jump(o); note(5);
          const s2 = $('.step2', b);
          s2.innerHTML = `<div class="q2">الحين احسب</div><div class="opts c3">${v.opts.map(x => `<button class="opt" data-v="${x}">${ar(x)}</button>`).join('')}</div>`;
          rise(s2);
          T(() => s2.scrollIntoView({ behavior: RM ? 'auto' : 'smooth', block: 'nearest' }), 100);
          pickChoices(s2, v, (ok, val) => {
            const full = ok && !missed;
            score(full, R);
            if (!full) comeback({ t: 'word', rule: R });
            const tail = !full && phase === 'lesson' && !spec.again ? '<br>وبترجع لك بأرقام جديدة' : '';
            if (ok && missed) return T(() => showSheet(false, 'تقريباً!', `الحساب صح — بس هذي «<b>${NAME[R]}</b>» من أول نظرة${tail}`), 350);
            if (ok) return T(() => showSheet(true, pick(PRAISE), `${v.fast} = <b>${ar(v.ans)}</b>`), 350);
            const w = v.why[val];
            T(() => showSheet(false, w ? w.t : 'الجواب الصح:', (w ? w.l + '<br>' : '') + `${v.fast} = <b>${ar(v.ans)}</b>${tail}`), 400);
          });
          return;
        }
        bad(); buzz([30, 40, 30]); o.classList.add('no'); shake(o);
        missed = true;
        $('.step2', b).innerHTML = `<div class="tell">لا — هذي ${R === 'rep' ? 'نفس العدد يتكرر' : 'أعداد ورا بعض تبدأ من ١'}</div>`;
        $$('.rpick', b).forEach(x => { if (x !== o) x.disabled = false; });
        pickRule();
      });
      pickRule();
    },

    spot(spec) {
      const L = spec.again ? freshL([16, 18, 26, 28]) : 24, kind = spec.again ? pick(['plus2', 'div4']) : 'minus1';
      const said = kind === 'plus2' ? [L, '×', L + 2, '÷', 2] : kind === 'minus1' ? [L, '×', L - 1, '÷', 2] : [L, '×', L + 1, '÷', 4];
      const wrong = kind === 'div4' ? 4 : 2;
      const fix = kind === 'plus2' ? `<b>${ar(L + 1)}</b> مو ${ar(L + 2)} — آخر عدد + ١` : kind === 'minus1' ? `<b>${ar(L + 1)}</b> مو ${ar(L - 1)} — اللي بعد آخر عدد، مو اللي قبله` : 'نقسم على <b>٢</b> مو ٤ — الأزواج نص العدد';
      const b = frame({ kick: 'صيد الغلط', title: 'أحمد غلط — <b>وين؟</b>' });
      b.innerHTML = `<div class="who"><span class="av">أ</span><div class="bub">حليتها بالحيلة… بس طلع جوابي غلط!</div></div>
        <div class="card work"><div class="big" style="font-size:24px">${toks(sumG(L))}</div><div class="said"><span class="op">=</span>${said.map((x, i) => typeof x === 'number' ? `<button class="stk" data-i="${i}">${ar(x)}</button>` : `<span class="op">${x}</span>`).join('')}</div></div>
        <div class="note" style="margin-top:14px">اختر الرقم الغلط — رقم واحد بس</div>`;
      fitAll(b); rise($('.who', b)); rise($('.work', b), 120);
      choose(b, '.stk', s => {
        const ok = +s.dataset.i === wrong;
        score(ok, 'gauss');
        if (ok) jump(s); else { s.classList.add('no'); shake(s); $(`.stk[data-i="${wrong}"]`, b).classList.add('show'); comeback({ t: 'spot' }); }
        T(() => { showSheet(ok, ok ? pick(PRAISE) : 'الغلط في المنقّط', fix + (!ok && phase === 'lesson' && !spec.again ? '<br>وبترجع لك بأرقام جديدة' : '')); }, ok ? 450 : 500);
      });
    },

    cue() {
      const k = pick(['rep', 'gauss']);
      const pic = k === 'rep' ? repPic(6, 4) : gaussPic(8);
      const b = frame({ kick: 'جولة أخيرة', title: 'هذي صورته… <b>وش قاعدته؟</b>' });
      b.innerHTML = `<div class="card cue">${pic}</div><div class="opts c2">${shuf(['rep', 'gauss']).map(x => `<button class="opt rpick${x === 'gauss' ? ' g' : ''}" data-k="${x}"><span class="ri">${ICON[x]}</span>${NAME[x]}</button>`).join('')}</div>`;
      const cue = $('.cue', b); rise(cue);
      $$('.pp', cue).forEach(p => p.classList.add('on'));
      $$(k === 'rep' ? '.pp text' : '.ph, .pL1 text', cue).forEach(t => t.remove());
      choose(b, '.rpick', o => {
        const ok = o.dataset.k === k; score(ok, k);
        if (ok) jump(o); else { o.classList.add('no'); shake(o); T(() => $(`.rpick[data-k="${k}"]`, b).classList.add('ok'), 250); }
        T(() => showSheet(ok, ok ? pick(PRAISE) : `هذي «${NAME[k]}»`, k === 'rep' ? 'صفوف متساوية = <b>نفس العدد يتكرر</b>' : 'أزواج من الطرفين = <b>من ١ ورا بعض</b>'), 400);
      });
    },

    inv() {
      const n = 13, S = n * (n + 1) / 2;
      const b = frame({ kick: 'تحدّي', title: 'هذي <b>بالعكس</b>' });
      b.innerHTML = `<div class="card word">مدرّج: أول صف فيه كرسي، والثاني <b>٢</b>، والثالث <b>٣</b>… وكل صف يزيد كرسي. في المدرّج كله <b>${ar(S)}</b> كرسي. كم صف فيه؟</div>
        <div class="inv-h">جرّب الخيارات في الحيلة</div>
        <div class="opts c3">${shuf([12, 13, 14]).map(x => `<button class="opt" data-v="${x}">${ar(x)}<small>صف</small></button>`).join('')}</div>`;
      rise($('.card', b));
      const tri = x => `${ar(x)} × ${ar(x + 1)} ÷ ٢ = ${ar(x * (x + 1) / 2)}`;
      pickChoices(b, { ans: n }, (ok, val) => {
        score(ok, 'gauss');
        if (ok) return T(() => showSheet(true, 'تحدّي محلول!', `${ar(n)} × ${ar(n + 1)} ÷ ٢ = <b>${ar(S)}</b> — آخر عدد هو عدد الصفوف`), 350);
        T(() => showSheet(false, `الجواب: ${ar(n)} صف`, `${tri(val)} — ${val < n ? 'أقل' : 'أكثر'} من ${ar(S)}<br>${ar(n)} × ${ar(n + 1)} ÷ ٢ = <b>${ar(S)}</b>`), 400);
      });
    }
  };

  function start() {
    reset(); phase = 'start'; Q = null; again = false;
    const b = frame({ bare: true });
    b.innerHTML = `<div class="full"><div class="logo">قدراتي</div><div class="lead">قاعدتين — وتعرف متى<br>تستخدم كل وحدة</div><div class="sub">بدون وقت ولا عدّاد — على راحتك</div>
      <div class="backs"><div class="cb"><b>؟</b><small>قاعدة ١</small></div><div class="cb g"><b>؟</b><small>قاعدة ٢</small></div></div></div>`;
    $$('.cb', b).forEach((t, i) => flipIn(t, 200 + i * 160));
    btn('يلا نبدأ', lesson);
  }
  function lesson() {
    phase = 'lesson'; qi = 0; prog = 0; ST.t0 = performance.now();
    Q = [{ t: 'rule1' }, { t: 'hook' }, { t: 'pairs' }, { t: 'bridge' }, { t: 'card2' }, { t: 'use' }, { t: 'tiles' }, { t: 'sort' }, { t: 'word', rule: 'gauss' }, { t: 'spot' }];
    run(Q[0]);
  }
  const face = (k, line) => `<div class="cb face${k === 'gauss' ? ' g' : ''}"><span class="ci">${ICON[k]}</span><b>${NAME[k]}</b><small>${line}</small></div>`;
  function later() {
    phase = 'later'; again = false; ST.t1 = performance.now(); $('.bar i').style.width = '100%';
    const b = frame({ bare: true });
    b.innerHTML = `<div class="full"><div class="later-t">جولة أخيرة</div><div class="sub" style="margin:4px 0 20px">٣ أسئلة بأرقام جديدة — وآخرها تحدّي</div>
      <div class="got" style="width:100%">${['rep', 'gauss'].map(k => face(k, TELL[k])).join('')}</div>
      <div class="sub" style="margin-top:16px">مجموعتك: <b style="color:var(--ink)">٢ من ٢</b> كروت</div></div>`;
    $$('.got .cb', b).forEach((x, i) => flipIn(x, 150 + i * 160));
    btn('يلا', review, true, 'blue');
  }
  function review() {
    phase = 'review'; qi = 0; prog = 0; ST.r0 = performance.now();
    Q = [{ t: 'cue' }, { t: 'word', rule: 'rep' }, { t: 'inv' }];
    run(Q[0]);
  }
  function secs(n) { return n >= 3 && n <= 10 ? `${ar(n)} ثواني` : `${ar(n)} ثانية`; }
  function end() {
    phase = 'end'; again = false; ST.r1 = performance.now(); $('.bar i').style.width = '100%';
    const b = frame({ bare: true });
    const acc = ST.graded ? Math.round(ST.right / ST.graded * 100) : 0;
    const lt = Math.round((ST.r1 - ST.t0) / 1000), rt = Math.max(1, Math.round((ST.r1 - ST.r0) / 1000));
    const mm = `${Math.floor(lt / 60)}:${String(lt % 60).padStart(2, '0')}`;
    b.innerHTML = `<div class="end"><h1>${acc >= 90 ? 'ثبّتها!' : 'خلّصتها!'}</h1><div class="sub">القاعدتين معك — ومتى تستخدم كل وحدة</div>
      <div class="stats"><div class="st" style="--c:var(--gold)"><div class="sh">مجموع XP</div><div class="sv xpv">٠</div></div>
        <div class="st" style="--c:var(--green)"><div class="sh">الدقة</div><div class="sv">${ar(acc)}٪</div></div>
        <div class="st" style="--c:var(--blue)"><div class="sh">وقت الدرس</div><div class="sv" dir="ltr">${ar(mm)}</div></div></div>
      <div class="spd">${ICON.clock}<div><b>حليت الجولة الأخيرة في ${secs(rt)}</b><span>اكسر رقمك المرة الجاية</span></div></div>
      <div class="got">${['rep', 'gauss'].map(k => face(k, ST.revMiss[k] ? 'ترجع لك بكرة' : 'ترجع بعد ٣ أيام')).join('')}</div>
      <div class="plan">أطول سلسلة: <b>${ar(ST.best)}</b> ورا بعض</div></div>`;
    stamp($('h1', b), 100); thud();
    $$('.st', b).forEach((x, i) => rise(x, 300 + i * 140));
    rise($('.spd', b), 800);
    $$('.got .cb', b).forEach((x, i) => flipIn(x, 1000 + i * 180));
    const xv = $('.xpv', b); let x = 0; const step = Math.max(1, Math.ceil(ST.xp / 30));
    T(() => { const iv = setInterval(() => { x = Math.min(ST.xp, x + step); xv.textContent = ar(x); if (x === ST.xp) { clearInterval(iv); hop(xv.parentNode, 8); } }, 30); timers.push(iv); }, 500);
    T(chime, 1100);
    btn('من جديد', start);
  }

  addEventListener('resize', () => fitAll(document));
  start();
})();
</script>
</body>
</html>
