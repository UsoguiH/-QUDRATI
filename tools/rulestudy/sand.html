<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قدراتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap">
<style>
:root {
  --green: #58CC02;        --green-dk: #58A700;
  --blue: #1CB0F6;         --blue-dk: #1899D6;
  --blue-light: #DDF4FF;   --blue-border: #63C9F9;
  --purple: #CE82FF;       --purple-dk: #A568CC;
  --purple-tint: #EDD1FF;
  --gold: #FFC800;         --gold-dk: #E6A000;
  --brown: #AA572A;
  --red: #FF4B4B;          --red-soft: #FFB2B2;
  --orange: #FF9600;       --orange-dk: #E07800;    --orange-bg: #FFEFD6;    --gold-bg: #FFF4BF;
  --ink: #4B4B4B;          --gray: #777777;         --gray-icon: #AFAFAF;
  --line: #E5E5E5;         --snow: #FFFFFF;         --surface-hover: #F7F7F7;
  --green-lip: #478700;
  --green-pale: #A5ED6E;
  --green-bg: #D6FFB8;     --red-bg: #FFDFE0;       --red-dk2: #EA2B2B;
  --font: 'Baloo Bhaijaan 2', 'Segoe UI', Tahoma, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; background: #ECECEC; }
body { font-family: var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font-family: var(--font); cursor: pointer; -webkit-user-select: none; user-select: none; }
.app {
  position: relative; max-width: 430px; height: 100vh; height: 100dvh; margin: 0 auto; background: var(--snow);
  display: flex; flex-direction: column; overflow: hidden;
}
@media (min-width: 470px) { .app { box-shadow: 0 0 0 1px var(--line), 0 18px 60px rgba(75,75,75,.18); } }

.top { display: flex; align-items: center; gap: 12px; padding: 16px 16px 0; min-height: 46px; }
.app.bare .top { visibility: hidden; }
.bar { flex: 1; height: 16px; border-radius: 8px; background: var(--line); position: relative; overflow: hidden; }
.bar i { position: absolute; top: 0; bottom: 0; inset-inline-start: 0; width: 0; border-radius: 8px; background: var(--green); transition: width .5s cubic-bezier(.3,1.25,.5,1); }
.bar i::after { content: ""; position: absolute; top: 4px; inset-inline: 8px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.32); }
.combo { display: flex; align-items: center; gap: 2px; font-size: 18px; font-weight: 800; color: var(--orange); min-width: 44px; justify-content: flex-end; opacity: 0; transition: opacity .2s; }
.combo.on { opacity: 1; }
.combo svg { width: 22px; height: 22px; }

.main { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 16px 16px 0; }
.kick { font-size: 14.5px; font-weight: 800; color: var(--purple-dk); min-height: 21px; margin: 0; }
.h { font-size: 23px; font-weight: 800; line-height: 1.35; margin: 0; min-height: 31px; }
.h b { color: var(--blue); }
.stage { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-top: 14px; position: relative; }

.foot { padding: 14px 16px 18px; border-top: 2px solid var(--line); display: grid; gap: 10px; }
.foot.two { grid-template-columns: 1fr 1fr; }
.app.bare .foot { border-top-color: transparent; }
.btn {
  display: block; width: 100%; height: 50px; border: 0; border-radius: 16px; margin-bottom: 5px;
  font-size: 17px; font-weight: 800; color: #fff; background: var(--green); box-shadow: 0 5px 0 var(--green-lip);
  transition: translate .07s, box-shadow .07s; padding: 0 10px; white-space: nowrap;
}
.btn:not(:disabled):active { translate: 0 5px; box-shadow: 0 0 0 var(--green-lip); }
.btn:disabled { background: var(--line); color: var(--gray-icon); box-shadow: none; cursor: default; }
.btn.red { background: var(--red); box-shadow: 0 5px 0 var(--red-dk2); }
.btn.red:active { box-shadow: 0 0 0 var(--red-dk2); }
.btn.blue { background: var(--blue); box-shadow: 0 5px 0 var(--blue-dk); }
.btn.blue:active { box-shadow: 0 0 0 var(--blue-dk); }
.btn.white { background: #fff; color: var(--blue); box-shadow: 0 4px 0 var(--line); border: 2px solid var(--line); }
.btn.white:active { box-shadow: 0 0 0 var(--line); translate: 0 4px; }
.btn.gold { background: var(--gold); color: var(--brown); box-shadow: 0 5px 0 var(--gold-dk); }

.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 30; padding: 18px 16px 18px; translate: 0 110%; visibility: hidden; transition: translate .26s cubic-bezier(.3,1.15,.5,1), visibility 0s .26s; }
.sheet.on { translate: 0 0; visibility: visible; transition: translate .26s cubic-bezier(.3,1.15,.5,1), visibility 0s; }
.sheet.ok { background: var(--green-bg); }
.sheet.no { background: var(--red-bg); }
.sheet.info { background: var(--blue-light); }
.sh-h { display: flex; align-items: center; gap: 10px; font-size: 23px; font-weight: 800; }
.sheet.ok .sh-h { color: var(--green-dk); }
.sheet.no .sh-h { color: var(--red-dk2); }
.sheet.info .sh-h { color: var(--blue-dk); }
.sh-ic { width: 36px; height: 36px; border-radius: 50%; background: #fff; display: grid; place-items: center; flex: none; }
.sh-ic svg { width: 22px; height: 22px; }
.sh-l { font-size: 17px; font-weight: 700; margin: 6px 0 0; line-height: 1.5; }
.sheet.ok .sh-l { color: var(--green-dk); }
.sheet.no .sh-l { color: var(--red-dk2); }
.sheet.info .sh-l { color: var(--blue-dk); }
.sh-b { display: grid; gap: 10px; margin-top: 14px; }
.sh-b.two { grid-template-columns: 1fr 1fr; }

.card { background: #fff; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 20px; padding: 16px 12px; }
.row { display: flex; justify-content: center; align-items: center; gap: .28em; white-space: nowrap; font-size: 30px; font-weight: 800; line-height: 1.4; min-width: 0; }
.row > * { flex: none; }
.row .op { color: var(--gray-icon); }
.row .q { color: var(--blue); }
.row .ans { color: var(--green-dk); }
.sm { font-size: 24px; }
.dim { opacity: .35; }

.ch { display: inline-grid; place-items: center; padding: .1em .5em 0; border-radius: .55em; color: #fff; font-weight: 800; line-height: 1.4; }
.c-blue { background: var(--blue); box-shadow: 0 .14em 0 var(--blue-dk); }
.c-purple { background: var(--purple); box-shadow: 0 .14em 0 var(--purple-dk); }
.c-orange { background: var(--orange); box-shadow: 0 .14em 0 var(--orange-dk); }
.c-green { background: var(--green); box-shadow: 0 .14em 0 var(--green-dk); }
.c-red { background: var(--red); box-shadow: 0 .14em 0 var(--red-dk2); }

.clock { display: flex; align-items: center; gap: 10px; margin: 16px 6px 0; }
.tbar { flex: 1; height: 12px; border-radius: 6px; background: var(--line); overflow: hidden; position: relative; }
.tbar i { position: absolute; top: 0; bottom: 0; inset-inline-start: 0; width: 100%; background: var(--orange); border-radius: 6px; }
.clock b { font-size: 22px; font-weight: 800; color: var(--orange-dk); min-width: 22px; text-align: center; }

.opts { display: grid; gap: 10px; margin-top: 18px; }
.opts.c3 { grid-template-columns: repeat(3, 1fr); }
.opt {
  min-height: 64px; border-radius: 16px; border: 2px solid var(--line); border-bottom-width: 4px; background: #fff;
  font: 800 26px/1.2 var(--font); color: var(--ink); padding: 8px 6px; text-align: center; transition: background .15s, border-color .15s, color .15s;
}
.opt:not(:disabled):active { border-bottom-width: 2px; translate: 0 2px; }
.opt.sel { border-color: var(--blue-border); background: var(--blue-light); color: var(--blue-dk); }
.opt.ok { border-color: var(--green-pale); background: var(--green-bg); color: var(--green-dk); }
.opt.no { border-color: var(--red-soft); background: var(--red-bg); color: var(--red-dk2); }
.opt.fade { opacity: .45; }
.opt:disabled { cursor: default; }
.drop { text-align: center; font-size: 46px; font-weight: 800; color: var(--green-dk); margin-top: 14px; line-height: 1.2; }

.tapme { cursor: pointer; display: block; width: 100%; font-family: var(--font); color: var(--ink); text-align: center; }
.tapme.wait { animation: nudge 1.5s ease-in-out infinite; }
@keyframes nudge { 50% { translate: 0 -4px; } }
.hint { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 15px; font-weight: 800; color: var(--blue); background: var(--blue-light); border-radius: 12px; padding: 3px 12px 1px; }
.hint svg { width: 18px; height: 18px; }
.sumrow { gap: .16em; }
.trm { position: relative; display: inline-grid; place-items: center; min-width: .95em; padding: 0 .06em; border-radius: .35em; transition: background .2s, color .2s; }
.trm.lit { background: var(--blue-light); color: var(--blue-dk); }
.trm .n { position: absolute; top: -19px; left: 50%; translate: -50% 0; min-width: 22px; height: 22px; border-radius: 11px; background: var(--purple); box-shadow: 0 2px 0 var(--purple-dk); color: #fff; font-size: 13px; line-height: 23px; text-align: center; padding: 0 5px; }
.say { text-align: center; font-size: 19px; font-weight: 800; margin-top: 18px; display: flex; justify-content: center; align-items: center; gap: 6px; flex-wrap: wrap; }
.say .ch { font-size: 19px; }
.res { margin-top: 16px; }
.res { margin-top: 18px; font-size: 36px; }
.res .ch { font-size: 36px; }

.bk {
  display: inline-grid; place-items: center; min-width: 2.6em; height: 1.6em; box-sizing: border-box; padding: 0 .35em;
  border-radius: .45em; border: 2px dashed #CFCFCF; background: #F7F7F7; font-weight: 800; color: var(--blue-dk); white-space: nowrap; transition: background .15s;
}
.bk.f { border: 2px solid var(--blue-border); border-bottom-width: 4px; background: var(--blue-light); cursor: pointer; }
.bk.no { border-color: var(--red) !important; background: var(--red-bg) !important; color: var(--red-dk2) !important; }
.bk.ok { border-color: var(--green-pale) !important; background: var(--green-bg) !important; color: var(--green-dk) !important; }
.bk.ask { color: #C2C2C2; }
.tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 22px; }
.tl {
  display: inline-grid; place-items: center; min-width: 56px; height: 50px; padding: 0 14px 2px;
  border-radius: 14px; background: #fff; border: 2px solid var(--line); border-bottom-width: 4px;
  font: 800 20px/1 var(--font); color: var(--ink); white-space: nowrap;
}
.tl:not(:disabled):active { border-bottom-width: 2px; translate: 0 2px; }
.tl.used { background: var(--line); border-color: var(--line); color: transparent; pointer-events: none; }
.tl:disabled { cursor: default; }
.tiles.words .tl { font-size: 18px; }

.rc { position: relative; background: #fff; border: 2px solid var(--line); border-bottom-width: 5px; border-radius: 20px; padding: 12px 12px 18px; transition: background .35s, border-color .35s; }
.rc.gold { background: var(--gold-bg); border-color: var(--gold); }
.rc-h { display: flex; align-items: center; gap: 8px; min-height: 32px; margin-bottom: 10px; }
.rc-ic { width: 32px; height: 32px; border-radius: 10px; background: var(--line); display: grid; place-items: center; flex: none; transition: background .35s, box-shadow .35s; }
.rc-ic svg { width: 21px; height: 21px; }
.rc.gold .rc-ic { background: var(--gold); box-shadow: 0 3px 0 var(--gold-dk); }
.rc-t { font-size: 15px; font-weight: 800; color: var(--gray); }
.rc.gold .rc-t { color: var(--brown); }
.rc-pre { text-align: center; font-size: 16px; font-weight: 800; color: var(--gray); margin: -4px 0 6px; }
.rc.gold .rc-pre { color: var(--brown); }
.rc .row { font-size: 21px; }
.rc .row .op { color: var(--gray-icon); }
.rc.gold .row .op { color: var(--gold-dk); }
.rc .w { font-weight: 800; }
.tm { display: inline-grid; place-items: center; padding: .12em .55em .02em; border-radius: .55em; background: var(--blue-light); color: var(--blue-dk); box-shadow: inset 0 0 0 2px var(--blue-border), 0 .16em 0 var(--blue-dk); font-weight: 800; white-space: nowrap; line-height: 1.45; }
.tm.fix { background: #fff; color: var(--orange-dk); box-shadow: inset 0 0 0 2px #FFC778, 0 .16em 0 var(--orange-dk); }
.rc.gold .tm.fix { background: var(--blue-light); color: var(--blue-dk); box-shadow: inset 0 0 0 2px var(--blue-border), 0 .16em 0 var(--blue-dk); }
.name {
  display: inline-flex; align-items: center; gap: 7px; padding: 4px 12px 2px 6px; border-radius: 12px;
  background: var(--purple); box-shadow: 0 3px 0 var(--purple-dk); color: #fff; font-size: 15px; font-weight: 800; white-space: nowrap;
}
.name i { width: 24px; height: 24px; border-radius: 8px; background: #fff; display: grid; place-items: center; }
.name i svg { width: 18px; height: 18px; }
.rc-h .name { margin-inline-start: auto; }
.name.big { font-size: 22px; padding: 8px 18px 6px 10px; border-radius: 18px; box-shadow: 0 5px 0 var(--purple-dk); gap: 10px; }
.name.big i { width: 36px; height: 36px; border-radius: 11px; }
.name.big i svg { width: 26px; height: 26px; }
.ex { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 14px; }
.ex-l { font-size: 14px; font-weight: 800; color: var(--gray); flex: none; }
.ex .row { font-size: 21px; flex: 0 1 auto; }
.ex .row .ch { font-size: 19px; }
.help { text-align: center; font-size: 16px; font-weight: 800; color: var(--orange-dk); min-height: 26px; margin-top: 12px; }

.sw { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 16px; font-weight: 800; color: var(--gray); margin-bottom: 10px; }
.sw svg { width: 20px; height: 20px; }
.sw b { color: var(--ink); min-width: 1.3em; text-align: center; }
.sw .goal { color: var(--orange-dk); background: var(--orange-bg); border-radius: 10px; padding: 1px 10px 0; margin-inline-start: 6px; }
.kpw { margin-top: auto; padding-bottom: 6px; }
.kp-in {
  display: flex; align-items: center; justify-content: center; gap: 2px; height: 60px; margin: 14px auto 12px; width: 72%;
  border-radius: 16px; border: 2px solid var(--line); border-bottom-width: 4px; background: #fff; font: 800 32px/1 var(--font); color: var(--ink);
}
.kp-in.ok { border-color: var(--green-pale); background: var(--green-bg); color: var(--green-dk); }
.kp-in.no { border-color: var(--red-soft); background: var(--red-bg); color: var(--red-dk2); }
.kp-car { width: 2px; height: 30px; background: var(--blue); animation: car 1s steps(1) infinite; }
.kp-in.lock .kp-car { display: none; }
@keyframes car { 50% { opacity: 0; } }
.kp { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kp button { height: 48px; border-radius: 14px; border: 2px solid var(--line); border-bottom-width: 4px; background: #fff; font: 800 23px/1 var(--font); color: var(--ink); padding: 0 0 2px; }
.kp button:active { border-bottom-width: 2px; translate: 0 2px; }
.kp button.del { color: var(--gray); }
.kp button.del svg { width: 26px; height: 26px; }

.pw { position: relative; padding: 100px 0 6px; }
.pw svg.arcs { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.nums { display: flex; justify-content: center; gap: 4px; }
.nt { flex: 0 1 34px; height: 44px; min-width: 0; border-radius: 11px; border: 2px solid var(--line); border-bottom-width: 4px; background: #fff; display: grid; place-items: center; font-weight: 800; font-size: 18px; transition: background .2s, border-color .2s, color .2s; }
.pchips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 16px; min-height: 36px; }
.pchips .ch { font-size: 16px; }
.p0 { --pc: var(--purple); --pd: var(--purple-dk); --pl: #F6E8FF; }
.p1 { --pc: var(--orange); --pd: var(--orange-dk); --pl: var(--orange-bg); }
.p2 { --pc: var(--green); --pd: var(--green-dk); --pl: var(--green-bg); }
.p3 { --pc: var(--blue); --pd: var(--blue-dk); --pl: var(--blue-light); }
.p4 { --pc: var(--red); --pd: var(--red-dk2); --pl: var(--red-bg); }
.p5 { --pc: var(--gold-dk); --pd: var(--brown); --pl: var(--gold-bg); }
.nt.pr { background: var(--pl); border-color: var(--pc); color: var(--pd); }
.pchips .pc { background: var(--pc); box-shadow: 0 .14em 0 var(--pd); }

.recall { display: flex; flex-direction: column; align-items: center; gap: 22px; margin-top: 8px; }
.recall .rc { align-self: stretch; }
.note { text-align: center; font-size: 16px; font-weight: 700; color: var(--gray); }

.tricks { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 22px; }
.trick {
  border-radius: 18px; border: 2px solid var(--line); border-bottom-width: 5px; background: #fff; padding: 16px 8px 12px;
  display: flex; flex-direction: column; align-items: center; gap: 10px; font: 800 17px/1.3 var(--font); color: var(--ink); transition: background .15s, border-color .15s;
}
.trick:not(:disabled):active { border-bottom-width: 3px; translate: 0 2px; }
.trick i { width: 52px; height: 52px; border-radius: 15px; background: var(--purple); box-shadow: 0 4px 0 var(--purple-dk); display: grid; place-items: center; }
.trick i svg { width: 34px; height: 34px; }
.trick.sel { border-color: var(--blue-border); background: var(--blue-light); color: var(--blue-dk); }
.trick.ok { border-color: var(--green-pale); background: var(--green-bg); color: var(--green-dk); }
.trick.no { border-color: var(--red-soft); background: var(--red-bg); color: var(--red-dk2); }
.trick:disabled { cursor: default; }

.days { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
.cal { width: 168px; border-radius: 26px; background: #fff; border: 2px solid var(--line); border-bottom-width: 6px; overflow: hidden; text-align: center; perspective: 400px; }
.cal-t { background: var(--red); color: #fff; font-size: 18px; font-weight: 800; padding: 8px 0 5px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.cal-t svg { width: 22px; height: 22px; }
.cal-n { font-size: 66px; font-weight: 800; line-height: 1.2; padding: 10px 0 0; color: var(--ink); transform-origin: 50% 0; }
.cal-s { font-size: 17px; font-weight: 800; color: var(--gray); padding: 0 0 14px; min-height: 40px; }
.fadeset { width: 100%; display: grid; gap: 10px; }
.frow { display: flex; align-items: center; gap: 10px; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 18px; padding: 10px 12px; background: #fff; }
.frow .name { flex: none; }
.fbar { flex: 1; height: 14px; border-radius: 7px; background: var(--line); overflow: hidden; position: relative; }
.fbar i { position: absolute; top: 0; bottom: 0; inset-inline-start: 0; width: 100%; border-radius: 7px; background: var(--green); }
.ftag { font-size: 14px; font-weight: 800; color: var(--gray-icon); min-width: 42px; text-align: center; }

.start { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; padding-bottom: 20px; }
.logo { width: 132px; height: 132px; margin-bottom: 12px; }
.start h1 { font-size: 30px; font-weight: 800; margin: 0; line-height: 1.3; }
.start p { margin: 0; font-size: 18px; font-weight: 700; color: var(--gray); line-height: 1.6; max-width: 300px; }
.start .pills { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; justify-content: center; }
.start .pills span { border-radius: 12px; background: var(--surface-hover); border: 2px solid var(--line); padding: 3px 12px 1px; font-size: 15px; font-weight: 800; color: var(--gray); }

.end { overflow-y: auto; scrollbar-width: none; padding-bottom: 6px; }
.end::-webkit-scrollbar { display: none; }
.end > * { flex-shrink: 0; }
.trophy { width: 120px; height: 104px; margin: 4px auto 0; display: block; }
.end h2 { text-align: center; font-size: 30px; font-weight: 800; color: var(--gold-dk); margin: 4px 0 0; line-height: 1.3; }
.end .sub { text-align: center; font-size: 16px; font-weight: 700; color: var(--gray); margin: 0; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
.st { border-radius: 16px; border: 2px solid var(--sc); overflow: hidden; background: var(--sc); }
.st b { display: block; text-align: center; color: #fff; font-size: 13.5px; font-weight: 800; padding: 3px 2px 1px; }
.st div { background: #fff; border-radius: 14px; display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 21px; font-weight: 800; color: var(--sc); padding: 8px 2px 6px; }
.st svg { width: 20px; height: 20px; flex: none; }
.st.gold { --sc: var(--gold); } .st.gold div { color: var(--gold-dk); }
.st.green { --sc: var(--green); }
.st.blue { --sc: var(--blue); }
.bonus { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 12px; min-height: 30px; }
.bonus span { border-radius: 10px; background: var(--gold-bg); color: var(--brown); font-size: 14px; font-weight: 800; padding: 3px 10px 1px; }
.mem { margin-top: 14px; display: grid; gap: 8px; }
.mrow { display: flex; align-items: center; gap: 10px; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 16px; padding: 8px 12px; }
.mrow .mt { flex: 1; min-width: 0; }
.mrow .mt b { display: block; font-size: 16px; font-weight: 800; }

(function () {

  const fastRep = v => `${ar(v.a)} × ${ar(v.n)} = ${ar(v.ans)}`;

    r.gA = first ? gauss(100) : fresh(() => gauss(pick([12, 50, 100])), 'gA', sameG);
    r.repP = first ? rep(7, 9) : fresh(() => { const a = pick([6, 7, 9]); return rep(a, distinct(a, rnd(8, 9))); }, 'repP', sameRep);
    r.gR = first ? gauss(24) : fresh(() => gauss(pick([24, 30, 40])), 'gR', sameG);

      foot([
        { label: 'نسيت شي', kind: 'white', fn: () => { G.recallOk = false; sheet('info', 'عادي!', 'اللي ننساه ونرجع نتذكره ينحفظ أقوى'); } },
        { label: 'جبتها', fn: () => { G.recallOk = true; G.xp += 5; wave($$('.tm', card)); sRight(); later(() => sheet('ok', 'ذاكرة قوية!', 'تذكّرتها بعد قاعدة ثانية — كذا تثبت'), 500); } }
      ]);
      footEl.querySelectorAll('.btn').forEach(b => b.disabled = true);
      later(() => footEl.querySelectorAll('.btn').forEach(b => b.disabled = false), 700);
    });
  }

  function scDays() {
    head('', '');
    stage.innerHTML = `<div class="days">
      <div class="cal"><div class="cal-t"><span class="cic">${IC.moon}</span><span class="ctop">بعد</span></div><div class="cal-n">١</div><div class="cal-s">يوم</div></div>
      <div class="fadeset">${['rep', 'gauss'].map(k => `<div class="frow" data-k="${k}">${nameTag(k)}<div class="fbar"><i></i></div><span class="ftag">٪١٠٠</span></div>`).join('')}</div></div>`;
    popIn($('.cal', stage));
    const n = $('.cal-n', stage), s = $('.cal-s', stage), ic = $('.cic', stage), cl = $(".ctop", stage);
    const steps = [['١', 'يوم', 'moon', 'بعد'], ['٢', 'يومين', 'sun', 'بعد'], ['٣', 'أيام', 'moon', 'بعد']];
    steps.forEach((st, i) => later(() => {
      n.textContent = st[0]; s.textContent = st[1]; ic.innerHTML = IC[st[2]]; cl.textContent = st[3];
      anim(n, [{ rotate: 'x -90deg', opacity: .3 }, { rotate: 'x 0deg', opacity: 1 }], { duration: 300, easing: 'cubic-bezier(.3,1.4,.5,1)' }); sTick(i * 2);
    }, 250 + i * 450));
    const rows = $$('.frow', stage);
    rows.forEach((r, i) => rise(r, 200 + i * 100));
    const left = [58, 52];
    later(() => {
      rows.forEach((r, i) => {
        const b = $('.fbar i', r), tag = $('.ftag', r);
        anim(b, [{ width: '100%', background: '#58CC02' }, { width: left[i] + '%', background: '#FFC800' }], { duration: 1500, easing: 'cubic-bezier(.4,0,.3,1)', fill: 'forwards' });
        const t0 = performance.now();
        const tick = () => { const p = clamp((performance.now() - t0) / 1500, 0, 1); tag.textContent = '٪' + ar(Math.round(100 - (100 - left[i]) * p)); if (p < 1 && tag.isConnected) setTimeout(tick, 16); };
        setTimeout(tick, 16);
        anim($('.name', r), [{ opacity: 1 }, { opacity: .55 }], { duration: 1500, fill: 'forwards' });
      });
    }, 1400);
    later(() => { head('بعد ٣ أيام…', 'القاعدتين <b>بدأوا يبهتون</b>'); sNote(1); btn('رجّعهم — ٣٠ ثانية', startReview); hop($('.btn', footEl), 6); }, 2300);
    btn('…', null, false);
  }

  function scPickTrick(v, done, again) {
    head('مراجعة — بعد ٣ أيام', 'أي حيلة <b>تحلها أسرع؟</b>');
    stage.innerHTML = `<div class="card"><div class="row">${longHtml(v)}<span class="op">=</span><span class="q">؟</span></div></div>
      <div class="tricks">${shuf(['rep', 'gauss']).map(k => `<button class="trick" data-k="${k}"><i>${RICON[k]('#fff')}</i>${RULE[k].name}</button>`).join('')}</div>`;
    rise($('.card', stage)); $$('.trick', stage).forEach((t, i) => rise(t, 120 + i * 80));
    let sel = null;
    stage.addEventListener('click', e => {
      const b = e.target.closest('.trick'); if (!b || b.disabled) return;
      sTap(); sel = b; $$('.trick', stage).forEach(x => x.classList.toggle('sel', x === b)); enable(true);
    });
    btn('تحقق', () => {
      const ok = sel.dataset.k === 'rep';
      $$('.trick', stage).forEach(x => x.disabled = true);
      grade(ok, 'rep'); done(ok);
      const q = $('.q', stage);
      if (ok) {
        sel.classList.replace('sel', 'ok'); wave([sel]); sRight(); buzz(20);
        q.className = 'ans'; q.textContent = ar(v.ans); stamp(q); fit($('.row', stage));
        later(() => sheet('ok', praise(), `نفس العدد يتكرر — ${fastRep(v)}`, null, nextReview), 500);
      } else {
        sel.classList.replace('sel', 'no'); shake(sel); sBad(); buzz([30, 40, 30]);
        sheet('no', 'لا — «العدد × مرّاته»', `نفس العدد يتكرر: ${fastRep(v)}${again ? '<br>بترجع لك آخر المراجعة' : ''}`, 'فهمت', nextReview);
      }
    }, false);
  }

  function startReview() {
    phase = 'review';
    const P = G.P;
    Q = [
      { k: 'pick', rk: 'rep', v: P.repP },
      { k: 'applyG', rk: 'gauss', v: P.gR },
      { k: 'speed', rk: 'rep', v: P.repR },
      { k: 'build', rk: 'gauss' }
    ];
    RV = { done: 0, total: Q.length, again: {}, f: 0 };
    setBar(0);
    nextReview();
  }
  function remake(it) {
    if (it.k === 'pick') { const a = pick([6, 8, 9]); return { k: 'pick', rk: 'rep', v: rep(a, a === 9 ? 8 : 9) }; }
    if (it.k === 'applyG') return { k: 'applyG', rk: 'gauss', v: gauss(pick([20, 30, 40].filter(x => x !== it.v.L && x !== G.P.gT.L))) };
    if (it.k === 'speed') return { k: 'speed', rk: 'rep', v: rep(pick([12, 14, 18]), rnd(4, 5)) };
    return { k: 'build', rk: 'gauss' };
  }
  function nextReview() {
    if (!Q.length) { G.revDone = true; return goto('end'); }
    const it = Q.shift();
    const again = !RV.again[it.k];
    const done = ok => {
      RV.done++;
      if (!ok && again) { RV.again[it.k] = 1; Q.push(remake(it)); RV.total++; }
      RV.f = Math.max(RV.f, RV.done / RV.total); setBar(RV.f);
    };
    show(() => {
      if (it.k === 'pick') return scPickTrick(it.v, done, again);
      if (it.k === 'build') return reviewBuild(done, again);
      const o = it.k === 'speed'
        ? { kick: 'مراجعة — بعد ٣ أيام', h: 'نفس الحيلة — <b>أسرع</b>', goal: 8, after: nextReview, again }
        : { kick: 'مراجعة — بعد ٣ أيام', h: 'احسبها <b>بالحيلة</b>', after: nextReview, again };
      wrapApply(it.rk, it.v, o, done);
    });
  }
  function wrapApply(rk, v, o, done) {
    const g0 = G.n, ok0 = G.ok;
    scApply(rk, v, o);
    const orig = footFns[0];
    footFns[0] = () => { orig(); done(G.ok > ok0 && G.n > g0); };
  }
  function reviewBuild(done, again) {
    scBuild('gauss', { cue: true, kick: 'مراجعة — بعد ٣ أيام', h: 'هذا اسمها — <b>كمّل القاعدة</b>' });
    const orig = footFns[0];
    footFns[0] = () => {
      const n0 = G.n, ok0 = G.ok;
      orig();
      if (G.n > n0) {
        const ok = G.ok > ok0;
        done(ok);
      }
    };
  }

  function scEnd() {
    const P = G.P, mins = (performance.now() - G.t0) / 1000;
    const acc = G.n ? Math.round(G.ok / G.n * 100) : 100;
    const bonus = [];
    if (G.ok === G.n) bonus.push(['بدون ولا غلطة', 10]);
    if (G.best <= 10) bonus.push([`حليتها في ${secsW(G.best)}`, 5]);
    if (G.recallOk) bonus.push(['تذكّرت من راسك', 5]);
    bonus.push(['خلّصت المراجعة', 10]);
    const base = G.xp, total = base + bonus.reduce((a, b) => a + b[1], 0);
    const m = Math.floor(mins / 60), s = Math.floor(mins % 60);
    const tm = `${ar(m)}:${ar(String(s).padStart(2, '0'))}`;
    const lvl = rk => G.revMiss[rk] ? 1 : 2;
    const when = rk => G.revMiss[rk] ? 'بكرة — عشان تثبت' : 'بعد أسبوع';
    stage.classList.add('end');
    stage.innerHTML = `<svg class="trophy" viewBox="0 0 120 104">
        <g transform="rotate(-9 46 60)"><rect x="12" y="22" width="62" height="74" rx="12" fill="#E6A000"/><rect x="12" y="18" width="62" height="74" rx="12" fill="#FFF4BF" stroke="#FFC800" stroke-width="3"/><rect x="22" y="34" width="42" height="9" rx="4.5" fill="#DDF4FF"/><rect x="22" y="50" width="30" height="9" rx="4.5" fill="#DDF4FF"/><rect x="22" y="66" width="38" height="9" rx="4.5" fill="#DDF4FF"/></g>
        <g transform="rotate(8 74 56)"><rect x="44" y="16" width="62" height="74" rx="12" fill="#E6A000"/><rect x="44" y="12" width="62" height="74" rx="12" fill="#FFF4BF" stroke="#FFC800" stroke-width="3"/><rect x="54" y="28" width="42" height="9" rx="4.5" fill="#1CB0F6"/><rect x="54" y="44" width="28" height="9" rx="4.5" fill="#1CB0F6"/><rect x="54" y="60" width="36" height="9" rx="4.5" fill="#1CB0F6"/></g>
        <g class="tk"><circle cx="96" cy="80" r="17" fill="#58A700"/><circle cx="96" cy="77" r="17" fill="#58CC02"/><path d="M88 77l5.5 5.5L104 72" fill="none" stroke="#fff" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
      <h2>ثبّتها!</h2><p class="sub">قاعدتين — وبيرجعون لك قبل لا تنساهم</p>
      <div class="stats"><div class="st gold"><b>مجموع XP</b><div>${IC.bolt}<span class="cnt" data-n="${total}">٠</span></div></div>
        <div class="st green"><b>الدقة</b><div>${IC.target}<span class="cnt" data-n="${acc}" data-p="1">٠</span></div></div>
        <div class="st blue"><b>الوقت</b><div>${IC.clock}<span>${tm}</span></div></div></div>
      <div class="bonus"></div>
      <div class="mem">${['rep', 'gauss'].map(k => `<div class="mrow"><i>${RICON[k]('#fff')}</i><div class="mt"><b>${RULE[k].name}</b><small>ترجع لك <em>${when(k)}</em></small></div><div class="pips">${[0, 1, 2, 3, 4].map(j => `<u class="${j < lvl(k) ? 'on' : ''}"></u>`).join('')}</div></div>`).join('')}</div>
      <div class="tmr">${IC.flame}<div class="mt"><b>سلسلتك: ١ يوم — كمّلها بكرة</b><small>تنتظرك قاعدة جديدة <span class="lockd">${IC.padlock}مجموع الفردية</span></small></div></div>`;
    const tr = $('.trophy', stage);
    anim(tr, [{ opacity: 0, scale: '.4', translate: '0 30px' }, { opacity: 1, scale: '1.12 .9', translate: '0 0', offset: .5 }, { scale: '.94 1.06', offset: .7 }, { opacity: 1, scale: '1', translate: '0 0' }], { duration: 600, easing: 'ease-out', fill: 'backwards' });
    const tk = $('.tk', tr); tk.style.transformBox = 'fill-box'; tk.style.transformOrigin = 'center'; popIn(tk, 500);
    later(() => { sWin(); buzz([20, 60, 30]); }, 300);
    rise($('h2', stage), 200); rise($('.sub', stage), 300);
    $$('.st', stage).forEach((x, i) => rise(x, 450 + i * 120));
    const counter = (el, to, ms, d) => later(() => {
      const t0 = performance.now(), from = +(el.dataset.v || 0);
      const step = () => { const p = clamp((performance.now() - t0) / ms, 0, 1); const v = Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3))); el.textContent = el.dataset.p ? ar(v) + '٪' : ar(v); if (p < 1 && el.isConnected) setTimeout(step, 16); else el.dataset.v = to; };
      setTimeout(step, 16);
    }, d);
    const [cx, ca] = $$('.cnt', stage);
    counter(cx, base, 700, 700); counter(ca, acc, 700, 820);
    let run = base;
    bonus.forEach((b, i) => later(() => {
      $('.bonus', stage).insertAdjacentHTML('beforeend', `<span><bdi dir="ltr">+${ar(b[1])}</bdi> ${b[0]}</span>`);
      popIn($('.bonus', stage).lastChild); sNote(4 + i * 2);
      run += b[1]; counter(cx, run, 350, 0); hop(cx.parentNode.parentNode, 8);
    }, 1500 + i * 450));
    const T = 1500 + bonus.length * 450;
    $$('.mrow', stage).forEach((r, i) => { rise(r, T + i * 120); later(() => { $$('.pips u.on', r).forEach((u, j) => popIn(u, j * 120)); }, T + 200 + i * 120); });
    rise($('.tmr', stage), T + 400);
    btn('مرة ثانية بأرقام جديدة', null, false);
    later(() => { cont('مرة ثانية بأرقام جديدة', () => { newRun(false); goto('g1'); }); }, 1200);
  }

  FLOW = [
    { id: 'start', fn: scStart, bare: true },
    { id: 'g1', fn: () => scGuess('rep'), p: 1 },
    { id: 'c1', fn: scCollapse, p: 1 },
    { id: 't1', fn: () => scTurn('rep'), p: 1 },
    { id: 'b1', fn: () => scBuild('rep'), p: 1 },
    { id: 'a1', fn: () => scApply('rep', G.P.repA), p: 1 },
    { id: 'g2', fn: () => scGuess('gauss'), p: 1 },
    { id: 'c2', fn: scPairs, p: 1 },
    { id: 't2', fn: () => scTurn('gauss'), p: 1 },
    { id: 'b2', fn: () => scBuild('gauss', { kick: 'القاعدة', h: 'اكتب القاعدة <b>بكلماتك</b>' }), p: 1 },
    { id: 'a2', fn: () => scApply('gauss', G.P.gA, { h: G.P.gA.L === 100 ? 'الحين <b>لين ١٠٠</b>' : 'احسبها <b>بالحيلة</b>' }), p: 1 },
    { id: 'r1', fn: scRecall, p: 1 },
    { id: 'days', fn: scDays, bare: true },
    { id: 'end', fn: scEnd, bare: true }
  ];
  const PCOUNT = FLOW.filter(f => f.p).length;
  function run() {
    const f = FLOW[pos];
    if (f.p) setBar(FLOW.slice(0, pos).filter(x => x.p).length / PCOUNT);
    if (f.id === 'days') setBar(1);
    show(f.fn, f.bare);
  }
  function next() { pos++; run(); }
  function goto(id) { pos = FLOW.findIndex(f => f.id === id); if (id === 'g1') phase = 'learn'; run(); }
  function advance() { if (phase === 'review') nextReview(); else next(); }

  const startUp = () => { pos = 0; run(); };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(startUp); else startUp();
})();
</script>
</body>
</html>
