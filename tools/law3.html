<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حيلة النص</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap">
<style>
:root {
  --green: #58CC02;        --green-dk: #58A700;     --green-lip: #478700;
  --green-bg: #D6FFB8;     --green-pale: #A5ED6E;
  --blue: #1CB0F6;         --blue-dk: #1899D6;      --blue-light: #DDF4FF;   --blue-border: #84D8FF;
  --gold: #FFC800;         --gold-dk: #E6A000;      --gold-bg: #FFF4BF;
  --brown: #AA572A;        --brown-dk: #7A3B12;
  --red: #FF4B4B;          --red-dk2: #EA2B2B;      --red-bg: #FFDFE0;
  --purple: #CE82FF;       --purple-dk: #A568CC;
  --ink: #4B4B4B;          --gray: #777777;         --gray-icon: #AFAFAF;
  --line: #E5E5E5;         --snow: #FFFFFF;         --polar: #F7F7F7;
  --font: 'Baloo Bhaijaan 2', 'Segoe UI', Tahoma, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--snow); }
body { font-family: var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font-family: var(--font); cursor: pointer; -webkit-tap-highlight-color: transparent; color: inherit; }
#app { position: relative; height: 100dvh; max-width: 430px; margin: 0 auto; display: flex; flex-direction: column; overflow: hidden; background: var(--snow); }

/* buttons: Duolingo's 3D face on its lip */
.btn { display: block; width: 100%; height: 52px; border: 0; border-radius: 16px; background: var(--green); color: #fff;
  font-size: 17px; font-weight: 800; box-shadow: 0 4px 0 var(--green-lip); transition: transform .06s; }
.btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--green-lip); }
.btn:disabled { background: var(--line); color: var(--gray-icon); box-shadow: 0 4px 0 #CFCFCF; }
.btn.white { background: #fff; color: var(--blue); border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); }
.btn.white:active { box-shadow: 0 0 0 var(--line); }
.btn.blue { background: var(--blue); box-shadow: 0 4px 0 var(--blue-dk); }
.btn.gold { background: var(--gold); color: var(--brown-dk); box-shadow: 0 4px 0 var(--gold-dk); }
.btn + .btn { margin-top: 12px; }

/* top of a lesson */
.top { display: flex; align-items: center; gap: 12px; padding: 14px 16px 6px; min-height: 52px; }
.x { width: 32px; height: 32px; border: 0; background: none; padding: 0; color: var(--gray-icon); }
.x svg { width: 18px; height: 18px; }
.bar { flex: 1; height: 16px; border-radius: 8px; background: var(--line); overflow: hidden; position: relative; }
.bar i { position: absolute; inset: 0 0 0 auto; width: 0; border-radius: 8px; background: var(--green); transition: width .45s cubic-bezier(.3,1.3,.5,1); }
.bar i::after { content: ""; position: absolute; top: 4px; inset-inline: 8px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.3); }

/* the stack's story segments: finite and visible */
.segs { flex: 1; display: flex; gap: 5px; }
.segs i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; }
.segs i.on { background: var(--blue); }
.segs i.ok { background: var(--green); }
.segs i.miss { background: var(--gold); }
.count { font-size: 15px; font-weight: 800; color: var(--gray-icon); min-width: 34px; text-align: center; }

.body { flex: 1; overflow-y: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; }
.foot { padding: 12px 16px 22px; }
.kick { font-size: 15px; font-weight: 800; color: var(--purple-dk); margin: 6px 0 2px; }
.h { font-size: 23px; font-weight: 800; line-height: 1.35; margin: 2px 0 14px; }
.sub { font-size: 16px; font-weight: 600; color: var(--gray); line-height: 1.5; margin: 0 0 12px; }
.big { font-size: 46px; font-weight: 800; text-align: center; margin: 18px 0 22px; letter-spacing: .5px; }
.big.sm { font-size: 38px; }
.tag { align-self: flex-start; font-size: 13px; font-weight: 800; padding: 3px 10px; border-radius: 10px; background: var(--polar); color: var(--gray); border: 2px solid var(--line); }
.tag.back { background: var(--gold-bg); color: var(--brown); border-color: var(--gold); }
.tag.trap { background: var(--red-bg); color: var(--red-dk2); border-color: #FFB2B2; }
.tag.new { background: var(--blue-light); color: var(--blue-dk); border-color: var(--blue-border); }

/* choices */
.chs { display: grid; gap: 10px; }
.chs.two { grid-template-columns: 1fr 1fr; }
.ch { position: relative; min-height: 58px; padding: 10px 12px; border-radius: 16px; background: #fff; border: 2px solid var(--line); border-bottom-width: 4px;
  font-size: 19px; font-weight: 700; color: var(--ink); text-align: center; }
.ch.big2 { font-size: 26px; font-weight: 800; }
.ch.sel { background: var(--blue-light); border-color: var(--blue-border); color: var(--blue-dk); }
.ch.ok { background: var(--green-bg); border-color: var(--green-pale); color: var(--green-dk); }
.ch.no { background: var(--red-bg); border-color: #FFB2B2; color: var(--red-dk2); }
.ch.dim { opacity: .45; }
.ch:disabled { cursor: default; }

/* the exam's comparison */
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 6px 0 16px; }
.cmp > div { border: 2px solid var(--line); border-radius: 16px; padding: 10px 6px 12px; text-align: center; }
.cmp small { display: block; font-size: 13px; font-weight: 700; color: var(--gray); }
.cmp b { display: block; font-size: 27px; font-weight: 800; margin-top: 2px; }

/* keypad */
.inp { height: 64px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--blue-border); border-radius: 16px; background: #fff;
  font-size: 34px; font-weight: 800; letter-spacing: 2px; }
.inp.ok { border-color: var(--green); background: var(--green-bg); color: var(--green-dk); }
.inp.no { border-color: var(--red); background: var(--red-bg); color: var(--red-dk2); }
.caret { width: 3px; height: 32px; border-radius: 2px; background: var(--blue); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.key { height: 50px; border-radius: 13px; background: #fff; border: 2px solid var(--line); border-bottom-width: 4px; font-size: 24px; font-weight: 700; }
.key:active { transform: translateY(2px); border-bottom-width: 2px; }
.key.del { color: var(--gray); font-size: 20px; }
@media (max-height: 680px) { .key { height: 42px; font-size: 21px; } .pad { gap: 6px; margin-top: 8px; } .big { margin: 8px 0 12px; font-size: 38px; } }

/* a worked line: tokens, each its own chip so they can light, land and be tapped */
.eq { display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 6px; font-size: 26px; font-weight: 800; line-height: 1.3; }
.eq span { display: inline-block; }
.eq .t { opacity: 0; transform: translateY(10px) scale(.8); transition: opacity .18s, transform .32s cubic-bezier(.3,1.6,.5,1); }
.eq .t.in { opacity: 1; transform: none; }
.eq .op { color: var(--gold-dk); }
.eq .hl { color: var(--blue-dk); background: var(--blue-light); border-radius: 10px; padding: 0 6px; box-shadow: 0 2px 0 var(--blue-border); }
.eq.toks span.tp { padding: 2px 8px; border-radius: 12px; border: 2px solid var(--line); border-bottom-width: 4px; background: #fff; cursor: pointer; }
.eq.toks span.tp.ok { background: var(--green-bg); border-color: var(--green-pale); color: var(--green-dk); }
.eq.toks span.tp.no { background: var(--red-bg); border-color: #FFB2B2; color: var(--red-dk2); }
.eq.toks span.tp.right { background: var(--gold-bg); border-color: var(--gold); color: var(--brown-dk); }

/* the snap: the verdict sheet that plays the trick on the student's own numbers */
.snap:empty { display: none; }
.snap { margin-top: auto; border-radius: 20px 20px 0 0; margin-inline: -16px; margin-bottom: -16px; padding: 14px 16px 18px;
  background: var(--green-bg); transform: translateY(105%); transition: transform .32s cubic-bezier(.2,1.2,.4,1); }
.snap.in { transform: none; }
.snap.miss { background: var(--gold-bg); }
.snap .v { display: flex; align-items: center; gap: 8px; font-size: 21px; font-weight: 800; color: var(--green-dk); margin-bottom: 8px; }
.snap.miss .v { color: var(--brown); }
.snap .v svg { width: 26px; height: 26px; flex: none; }
.snap .eq { font-size: 21px; justify-content: flex-start; color: var(--ink); margin: 2px 0 6px; }
.snap .dg { font-size: 16px; font-weight: 700; color: var(--brown-dk); line-height: 1.5; margin: 4px 0 10px; }
.snap .btn { margin-top: 8px; }
.snap.miss .btn { background: var(--gold); color: var(--brown-dk); box-shadow: 0 4px 0 var(--gold-dk); }
.swipe { display: flex; justify-content: center; margin-top: 8px; color: var(--green-dk); opacity: .7; }
.snap.miss .swipe { color: var(--brown); }
.swipe svg { width: 22px; height: 22px; animation: nudge 1.2s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateY(-6px); } }

/* the hook's two lanes */
.lanes { display: grid; gap: 10px; margin-top: 4px; }
.lane { border-radius: 16px; padding: 10px 14px; border: 2px solid var(--line); }
.lane h4 { margin: 0 0 4px; font-size: 14px; font-weight: 800; color: var(--gray); display: flex; justify-content: space-between; }
.lane .ln { font-size: 20px; font-weight: 700; color: var(--gray); opacity: 0; transform: translateX(-8px); transition: opacity .25s, transform .25s; }
.lane .ln.in { opacity: 1; transform: none; }
.lane.fast { border-color: var(--gold); background: var(--gold-bg); }
.lane.fast h4 { color: var(--brown); }
.lane.fast .ln { color: var(--brown-dk); font-size: 25px; font-weight: 800; }

/* the number line and the figure */
svg text { font-family: var(--font); }
.nl { width: 100%; height: auto; display: block; margin: 4px 0 6px; }
.nl .tk { cursor: pointer; }
.nl .tk circle { fill: #fff; stroke: var(--line); stroke-width: 2.5; transition: fill .2s, stroke .2s; }
.nl .tk text { font-size: 17px; font-weight: 800; fill: var(--ink); text-anchor: middle; }
.nl .tk.on circle { fill: var(--blue); stroke: var(--blue-dk); }
.nl .tk.on text { fill: #fff; }
.nl .tk.bad circle { fill: var(--red-bg); stroke: var(--red); }
.nl .arc { fill: none; stroke: var(--gold-dk); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 220; stroke-dashoffset: 220; transition: stroke-dashoffset .6s ease-out; }
.nl .arc.in { stroke-dashoffset: 0; }
.nl .al { font-size: 20px; font-weight: 800; fill: var(--brown); text-anchor: middle; opacity: 0; transition: opacity .3s .4s; }
.nl .al.in { opacity: 1; }
.rows { display: grid; gap: 4px; margin-top: 6px; }
.rows .r { font-size: 24px; font-weight: 800; text-align: center; opacity: 0; transform: translateY(8px); transition: opacity .25s, transform .3s cubic-bezier(.3,1.5,.5,1); }
.rows .r.in { opacity: 1; transform: none; }
.rows .r.gold { color: var(--brown-dk); background: var(--gold-bg); border-radius: 14px; padding: 2px 0; }

.fig { width: 100%; max-width: 300px; height: auto; display: block; margin: 0 auto; }
.fig .strip { transform-box: fill-box; transform-origin: center; transition: transform .9s cubic-bezier(.5,0,.25,1.2); }
.fig.moved .strip { transform: translate(100px, 130px) rotate(90deg); }
.fig .hole { opacity: 0; transition: opacity .3s .9s; }
.fig.moved .hole { opacity: 1; }
.fig .lb { font-size: 18px; font-weight: 800; text-anchor: middle; transition: opacity .3s; }
.fig .before { transition: opacity .25s; }
.fig.moved .before { opacity: 0; }
.fig .after { opacity: 0; transition: opacity .3s .95s; }
.fig.moved .after { opacity: 1; }

/* the rule card: Duolingo's regular yellow */
.rule { background: var(--gold-bg); border: 2px solid var(--gold); border-radius: 18px; box-shadow: 0 5px 0 var(--gold); padding: 14px 16px 16px; }
.rule .nm { display: inline-block; font-size: 14px; font-weight: 800; color: var(--brown); background: #fff; border: 2px solid var(--gold); border-radius: 10px; padding: 1px 10px; }
.rule .when { font-size: 16px; font-weight: 700; color: var(--brown); margin: 10px 0 4px; }
.rule .ln { font-size: 24px; font-weight: 800; color: var(--ink); line-height: 1.6; }
.rule .k { display: inline-block; padding: 0 8px; border-radius: 10px; transition: background .2s, color .2s, box-shadow .2s, transform .3s cubic-bezier(.3,1.8,.5,1); }
.rule .k.lit { background: var(--blue-light); color: var(--blue-dk); box-shadow: 0 2px 0 var(--blue-border); transform: scale(1.06); }
.rule .ex { font-size: 16px; font-weight: 700; color: var(--brown); margin-top: 8px; }
.rule.pop { animation: pop .5s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop { 0% { transform: scale(.7); opacity: 0; } 60% { transform: scale(1.04); opacity: 1; } 100% { transform: scale(1); } }

/* the deck */
.deck { padding: 16px; overflow-y: auto; flex: 1; }
.deck h1 { font-size: 24px; font-weight: 800; margin: 4px 0 2px; }
.deck .h1s { font-size: 15px; font-weight: 600; color: var(--gray); margin-bottom: 14px; }
.meter { margin-top: 12px; }
.meter .mt { display: flex; justify-content: space-between; font-size: 14px; font-weight: 800; color: var(--brown); margin-bottom: 4px; }
.meter .mb { height: 14px; border-radius: 7px; background: rgba(170,87,42,.15); overflow: hidden; position: relative; }
.meter .mb i { position: absolute; inset: 0 0 0 auto; border-radius: 7px; background: var(--green); transition: width 1s cubic-bezier(.3,1.2,.5,1); }
.meter .mb i::after { content: ""; position: absolute; top: 3px; inset-inline: 6px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.35); }
.card { border: 2px solid var(--line); border-radius: 18px; padding: 14px; margin-top: 16px; }
.card h3 { margin: 0 0 2px; font-size: 17px; font-weight: 800; }
.card .cs { font-size: 14px; font-weight: 600; color: var(--gray); margin-bottom: 8px; line-height: 1.5; }
.next { text-align: center; font-size: 16px; font-weight: 700; color: var(--gray); margin: 14px 0 10px; }
.next b { color: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; font-weight: 700; color: var(--gray); margin-top: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 3px solid var(--blue); }
.legend i.dash { border-top-style: dashed; border-color: var(--gray-icon); }
.legend b { display: inline-grid; place-items: center; width: 14px; height: 14px; border-radius: 50%; }
.log { width: 100%; border-collapse: collapse; font-size: 14px; }
.log td, .log th { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: right; }
.log th { color: var(--gray); font-weight: 700; }
.ok-t { color: var(--green-dk); font-weight: 800; }
.no-t { color: var(--red-dk2); font-weight: 800; }
.small { font-size: 13px; color: var(--gray); font-weight: 600; line-height: 1.5; }
.sim { margin-top: 16px; border: 2px dashed var(--purple); border-radius: 16px; padding: 10px 12px; }
.sim .row { display: flex; gap: 8px; margin-top: 8px; }
.sim button { flex: 1; height: 38px; border-radius: 12px; border: 2px solid var(--purple); background: #fff; color: var(--purple-dk); font-weight: 800; font-size: 15px; }
.links { display: flex; gap: 10px; margin-top: 16px; }
.links button { flex: 1; height: 42px; border-radius: 12px; border: 2px solid var(--line); background: #fff; color: var(--gray); font-weight: 800; font-size: 14px; }
.toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(80px); background: var(--ink); color: #fff; padding: 8px 16px; border-radius: 12px; font-weight: 700; transition: transform .3s; z-index: 9; }
.toast.in { transform: translateX(-50%); }

/* the end of a stack */
.end { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 16px; text-align: center; }
.end .eh { font-size: 28px; font-weight: 800; margin: 0 0 4px; }
.end .es { font-size: 17px; font-weight: 700; color: var(--gray); margin-bottom: 20px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0 6px; }
.stat { border: 2px solid var(--line); border-radius: 16px; padding: 8px; }
.stat small { display: block; font-size: 13px; font-weight: 800; color: var(--gray); }
.stat b { font-size: 24px; font-weight: 800; }
.boom { animation: boom .7s cubic-bezier(.3,1.6,.5,1); }
@keyframes boom { 0% { transform: scale(.6) rotate(-4deg); } 55% { transform: scale(1.12) rotate(2deg); } 75% { transform: scale(.96); } 100% { transform: scale(1); } }

/* the stack moves like a feed */
.stage { position: relative; flex: 1; overflow: hidden; }
.panel { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--snow); transition: transform .38s cubic-bezier(.3,.9,.3,1); will-change: transform; }
.panel.below { transform: translateY(100%); }
.panel.above { transform: translateY(-100%); }

/* every answer jumps (fxAddJump's beats), a miss sinks and shakes */
.jump { animation: jump .48s linear; }
@keyframes jump {
  0% { transform: translateY(0) scale(1, 1); }
  7% { transform: translateY(-15px) scale(.947, 1.056); }
  21% { transform: translateY(-24px) scale(1, 1); }
  36% { transform: translateY(-24px); }
  64% { transform: translateY(-6px) scale(.98, 1.07); }
  71% { transform: translateY(1px) scale(1.024, .926); }
  86% { transform: translateY(-4px) scale(1, 1); }
  100% { transform: translateY(0); }
}
.shake { animation: shake .4s ease-out; }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-8px) translateY(2px); } 40% { transform: translateX(7px) translateY(2px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(2px); } }
.fade-in { animation: fin .35s ease-out both; }
@keyframes fin { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
(function () {
'use strict';

/* ───────── basics ───────── */
const SIM = /[?&]sim\b/.test(location.search);
const KEY = SIM ? 'law3.sim' : 'law3';
const DAY = 864e5;
const HORIZON = 90;
const $app = document.getElementById('app');
const AR = '٠١٢٣٤٥٦٧٨٩';
const toAr = n => String(n).replace(/\d/g, d => AR[d]);
const sq = n => toAr(n) + '²';
const pad2 = n => (n < 10 ? '0' : '') + n;
const clamp = (a, b, x) => Math.min(b, Math.max(a, x));
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
const durTxt = s => s <= 90 ? secTxt(s) : s < 150 ? 'دقيقتين' : toAr(Math.round(s / 60)) + ' دقايق';
const secTxt = s => { const n = Math.max(1, Math.round(s)); return n === 1 ? 'ثانية' : n === 2 ? 'ثانيتين' : n <= 10 ? toAr(n) + ' ثوانٍ' : toAr(n) + ' ثانية'; };

let S;
function fresh() { return { v: 1, off: 0, learned: null, card: null, hist: [], log: [], seen: [], newRule: null }; }
function load() { try { S = JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch (e) { S = fresh(); } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
load();

const now = () => Date.now() + (S.off || 0) * DAY;
const dstr = t => { const d = new Date(t); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
const dnum = s => { const p = s.split('-').map(Number); return Math.round(Date.UTC(p[0], p[1] - 1, p[2]) / DAY); };
const today = () => dstr(now());
const addDays = (s, n) => { const p = s.split('-').map(Number); return dstr(new Date(p[0], p[1] - 1, p[2] + n).getTime()); };
const dayOf = t => S.learned ? (t - S.learned.at) / DAY : 0;

/* ───────── sounds: the app's own files ───────── */
const SND = {
  tap: '../assets/sounds/bri/lightweight-choice.mp3', key: '../assets/sounds/bri/assessment-click-option-1.mp3',
  right: '../assets/sounds/correct.mp3', wrong: '../assets/sounds/bri/incorrect.mp3', snap: '../assets/sounds/bri/hint.mp3',
  start: '../assets/sounds/bri/start-lesson.mp3', next: '../assets/sounds/bri/continue.mp3', lane: '../assets/sounds/bri/toggle-on.mp3',
  rule: '../assets/sounds/bri/highlight-node.mp3', t1: '../assets/sounds/bri/xp-tally-1.mp3', t2: '../assets/sounds/bri/xp-tally-2.mp3',
  t3: '../assets/sounds/bri/xp-tally-3.mp3', t4: '../assets/sounds/bri/xp-tally-4.mp3', t5: '../assets/sounds/bri/xp-tally-5.mp3',
  done: '../assets/sounds/bri/lesson-complete.mp3', big: '../assets/sounds/bri/level-mastered.mp3', small: '../assets/sounds/bri/level-passed.mp3',
  move: '../assets/sounds/bri/drag-released.mp3', back: '../assets/sounds/bri/streak-charge.mp3'
};
const SNDC = {};
function play(k, vol) {
  try {
    if (!SNDC[k]) { SNDC[k] = new Audio(SND[k]); SNDC[k].preload = 'auto'; }

/* ───────── FSRS-6, default parameters (research/law3/t1-memory.md §C) ───────── */
const W = [0.212, 1.2931, 2.3065, 8.2956, 6.4133, 0.8334, 3.0194, 0.001, 1.8722, 0.1666, 0.796, 1.4835, 0.0614, 0.2629, 1.6483, 0.6014, 1.8729, 0.5425, 0.0912, 0.0658, 0.1542];

function fsrsNext(c, g, t) {
  const r = R(t, c.s);
  let s;
  if (t < 1) s = c.s * Math.max(g > 1 ? 1 : 0, Math.exp(W[17] * (g - 3 + W[18])) * Math.pow(c.s, -W[19]));
  else if (g > 1) s = c.s * (1 + Math.exp(W[8]) * (11 - c.d) * Math.pow(c.s, -W[9]) * (Math.exp(W[10] * (1 - r)) - 1) * (g === 2 ? W[15] : 1));
  else s = Math.min(W[11] * Math.pow(c.d, -W[12]) * (Math.pow(c.s + 1, W[13]) - 1) * Math.exp(W[14] * (1 - r)), c.s / Math.exp(W[17] * W[18]));
  const d = clamp(1, 10, W[7] * D0(4) + (1 - W[7]) * (c.d - W[6] * (g - 3) * (10 - c.d) / 9));
  return { s: Math.max(.1, s), d, r };
}
const examDay = () => addDays(S.learned.day, HORIZON);
/* the gap cap: an early ladder (successive relearning wants 3–4 sessions while the
   procedure is fresh, and FSRS's adult-flashcard defaults would jump day 1 → day 15),
   then the 21-day ridgeline, then one forced check a week before the exam */
const LADDER = { 2: 3, 3: 7, 4: 14 };
function dueAfter(day, s, reps) {

  const ex = dnum(examDay());

}
function Rnow() { if (!S.card) return 0; return R((now() - S.card.lastT) / DAY, S.card.s); }
const isDue = () => S.card && dnum(today()) >= dnum(S.card.due);

/* ───────── the rule's items, always on fresh numbers ───────── */
const CMP = ['القيمة الأولى أكبر', 'القيمة الثانية أكبر', 'القيمتان متساويتان', 'المعطيات غير كافية'];
function md(easy) {
  for (let i = 0; i < 40; i++) {
    const m = easy ? pick([20, 30]) : pick([20, 30, 40, 50, 60, 70, 80, 90, 100]);
    const d = easy ? rnd(1, 2) : rnd(1, 6);
    const id = (m - d) + 'x' + (m + d);
    if (S.seen.indexOf(id) < 0 || i > 30) { S.seen.push(id); if (S.seen.length > 40) S.seen.shift(); return { m, d, a: m - d, b: m + d }; }
  }
}
const trickLine = (a, b, m, d) => [toAr(a), '×', toAr(b), '=', sq(m), '−', sq(d), '=', toAr(m * m), '−', toAr(d * d), '=', toAr(m * m - d * d)];
function mk(kind, o) {
  o = o || {};

  const it = Object.assign({ kind }, p, { tag: o.tag || null });
  if (kind === 'type') {

  } else if (kind === 'back') {
    it.ans = p.a;

    const v = o.v || pick(['sq', 'near', 'near', 'eq']);
    it.v = v;
    if (v === 'sq') { it.v2 = sq(p.m); it.ans = 1; it.why = `الضرب = ${sq(p.m)} − ${sq(p.d)} — يعني أقل من ${sq(p.m)}`; }
    else if (v === 'eq') { it.v2 = toAr(p.m * p.m - p.d * p.d); it.ans = 2; it.why = `${sq(p.m)} − ${sq(p.d)} = ${toAr(p.m * p.m - p.d * p.d)}`; }
    else {
      let e; do { e = rnd(1, 7); } while (e === p.d);
      it.e = e; it.v2 = toAr(p.m - e) + ' × ' + toAr(p.m + e); it.ans = e < p.d ? 1 : 0;
      it.why = `نفس النص ${toAr(p.m)} — والبعد الأصغر يطرح أقل، فضربه أكبر`;
    }

      : `${toAr(it.a)} بعيد ${toAr(p.m - it.a)} عن ${toAr(p.m)}، و${toAr(it.b)} بعيد ${toAr(Math.abs(it.b - p.m))} — مو نفس البعد`;

    it.toks = [toAr(p.a) + ' × ' + toAr(p.b), '=', sq(p.m), op, sq(dd), '=', toAr(p.m * p.m), op, toAr(dd * dd), '=', toAr(res)];

    it.why = e === 'plus' ? 'البعد² ينطرح — مو ينجمع' : e === 'dist' ? `البعد من النص لكل طرف (${toAr(p.d)})، مو المسافة بين العددين` : `${toAr(p.m * p.m)} − ${toAr(p.d * p.d)} = ${toAr(p.m * p.m - p.d * p.d)}`;

}
function diagnose(it, val) {
  const { m, d } = it;
  if (it.kind === 'back') return `النص ${toAr(m)} والبعد ${toAr(d)} — فالعدد الثاني ${toAr(m)} − ${toAr(d)}`;
  if (val === m * m + d * d) return 'البعد² ينطرح — مو ينجمع.';
  if (val === m * m) return `قريب — بس نسيت تطرح ${sq(d)}.`;
  if (val === m * m - 4 * d * d) return `البعد من النص لكل طرف (${toAr(d)})، مو المسافة بين العددين.`;
  if (val === m * m - d) return `البعد لازم يتربّع: ${sq(d)} = ${toAr(d * d)}.`;

}

function countUp(el, to, ms) { const t0 = performance.now(); (function f() { const k = Math.min(1, (performance.now() - t0) / ms); el.textContent = toAr(Math.round(to * k)) + '٪'; if (k < 1) requestAnimationFrame(f); })(); }

/* ───────── the return: a finite stack of four cards ───────── */
let RS = null;
function buildStack() {
  const kinds = ['cmp', 'err', 'fit', 'back'].sort(() => Math.random() - .5);
  const c2 = kinds[0], c3 = kinds.find(k => k !== c2 && (k !== 'back' || Rnow() > .8)) || kinds[1];
  const st = [mk('type', { tag: 'cold' }), mk(c2), mk(c3), mk('type', { easy: true, tag: 'win' })];
  if (c2 === 'fit' || c3 === 'fit') st.forEach(x => { if (x.kind === 'fit') x.tag = 'trap'; });
  st.forEach(x => { if (x.kind === 'back' && !x.tag) x.tag = 'rev'; });
  return st;
}
function startReview(practice) {
  warm(); play('start', .6);
  RS = { practice, cards: buildStack(), i: 0, res: [], rBefore: Rnow(), requeued: 0, t0: now() };
  $app.innerHTML = `<div class="top"><button class="x" id="quit" aria-label="خروج">${X_SVG}</button><div class="segs" id="segs"></div><span class="count" id="cnt"></span></div>
    ${practice ? '<p class="small" style="text-align:center;margin:0">تجربة — ما تنحسب ولا تغيّر موعد المراجعة</p>' : ''}<div class="stage" id="stage"></div>`;
  document.getElementById('quit').addEventListener('click', () => { CUR = null; RS = null; home(); });
  showCard(true);
}
function segs() {
  const el = document.getElementById('segs');
  el.innerHTML = RS.cards.map((c, i) => `<i class="${i < RS.res.length ? (RS.res[i].ok ? 'ok' : 'miss') : i === RS.i ? 'on' : ''}"></i>`).join('');
  document.getElementById('cnt').textContent = toAr(Math.min(RS.i + 1, RS.cards.length)) + '/' + toAr(RS.cards.length);
}
function showCard(first) {
  segs();
  const stage = document.getElementById('stage');
  const it = RS.cards[RS.i];
  const p = document.createElement('div');
  p.className = 'panel' + (first ? '' : ' below');
  p.innerHTML = `<div class="body">${itemHTML(it)}</div>`;
  stage.appendChild(p);
  const old = stage.querySelector('.panel:not(:last-child)');
  requestAnimationFrame(() => requestAnimationFrame(() => { p.classList.remove('below'); if (old) { old.classList.add('above'); setTimeout(() => old.remove(), 420); } }));
  const last = RS.i === RS.cards.length - 1;
  wireItem(p, it, { label: last ? 'خلّصنا' : 'التالي', swipe: !last, fn: (ok, sec, val) => advance(it, ok, sec, val) });
  CUR.t0 = performance.now() + (first ? 0 : 380);
  let y0 = null;
  p.addEventListener('pointerdown', e => { y0 = e.clientY; });
  p.addEventListener('pointerup', e => { if (y0 != null && CUR && CUR.done && CUR.root === p && y0 - e.clientY > 60) p.querySelector('#go').click(); y0 = null; });
}
function advance(it, ok, sec, val) {
  RS.res.push({ kind: it.kind, ok, sec, tag: it.tag });
  if (!ok && RS.requeued < 2) { const r = mk(it.kind === 'back' ? 'type' : it.kind); r.tag = 'back'; RS.cards.splice(RS.cards.length - 1, 0, r); RS.requeued++; }
  RS.i++;
  if (RS.i >= RS.cards.length) return endReview();
  showCard(false);
}
function endReview() {
  CUR = null;
  const first = RS.res[0], right = RS.res.filter(r => r.ok).length, n = RS.res.length;
  let surprise = false, next = null, after = 1;
  if (!RS.practice) {
    const t = now(), day = dstr(t), el = (t - S.card.lastT) / DAY;
    const g = !first.ok ? 1 : (first.sec > 30 || RS.res.some(r => !r.ok)) ? 2 : 3;
    const prevDay = S.card.last;
    const nx = fsrsNext(S.card, g, dnum(day) - dnum(prevDay));
    surprise = first.ok && RS.rBefore < .75;
    S.card.s = nx.s; S.card.d = nx.d; S.card.last = day; S.card.lastT = t; S.card.reps++; if (g === 1) S.card.lapse++;
    S.card.due = dueAfter(day, nx.s, S.card.reps);
    S.hist.push({ t, g, s: nx.s, r: +RS.rBefore.toFixed(3) });
    RS.res.forEach((r, i) => S.log.push({ t, kind: r.kind, ok: r.ok ? 1 : 0, sec: +r.sec.toFixed(1), ctx: i === 0 ? 'cold' : 'review', day: +el.toFixed(2), pred: i === 0 ? +RS.rBefore.toFixed(3) : undefined }));
    save();
    next = S.card.due; after = R(0, nx.s);
  }
  const head = RS.practice ? 'هذا شكل المراجعة' : surprise ? 'كانت تبرد — ومسكتها' : first.ok ? 'ماسكة' : 'رجّعناها';
  const subl = RS.practice ? 'المراجعة الحقيقية تجيك بموعدها، وأول بطاقة فيها هي القياس.'
    : !first.ok ? 'أول بطاقة طاحت، ورجعت لك صح — هذا بالضبط اللي يثبّتها.' : `أول بطاقة: ${secTxt(first.sec)} — والقاعدة مخفية.`;
  const nextTxt = next ? dueTxt(next) : '';
  $app.innerHTML = `<div class="end fade-in"><p class="eh" id="eh">${head}</p><p class="es">${subl}</p>
    ${ruleCard(true)}
    <div class="meter" style="text-align:right"><div class="mt"><span>قوة الحفظ</span><span id="mp">${toAr(Math.round(RS.rBefore * 100))}٪</span></div><div class="mb"><i id="mi" style="width:${Math.round(RS.rBefore * 100)}%"></i></div></div>
    <div class="stats"><div class="stat"><small>صح</small><b>${toAr(right)} من ${toAr(n)}</b></div><div class="stat"><small>الوقت</small><b>${durTxt((now() - RS.t0) / 1000)}</b></div></div>
    ${nextTxt ? `<p class="next">المراجعة الجاية <b>${nextTxt}</b></p>` : ''}
    <div style="margin-top:10px"><button class="btn" id="fin">تم</button></div></div>`;
  if (!RS.practice) setTimeout(() => {
    $app.querySelector('#mi').style.width = Math.round(after * 100) + '%';

  }, 450);
  if (surprise) { play('big', .8); buzz([20, 60, 30, 60, 40]); fx($app.querySelector('#rc'), 'boom'); fx($app.querySelector('#eh'), 'boom'); }
  else play(first.ok ? 'small' : 'done', .6);
  $app.querySelector('#fin').addEventListener('click', () => { play('next', .5); RS = null; home(); });
}
function dueTxt(due) {
  const n = dnum(due) - dnum(today());
  return n <= 0 ? 'اليوم' : n === 1 ? 'بكرة' : n === 2 ? 'بعد يومين' : n <= 10 ? `بعد ${toAr(n)} أيام` : `بعد ${toAr(n)} يوم`;
}

/* ───────── the recall chart: the model's line, the plan ahead, and what was measured ───────── */
function chartSVG() {
  const Wd = 340, H = 150, top = 30, bot = 124, left = 10, right = 330, lo = .5;
  const X = day => right - (clamp(0, HORIZON, day) / HORIZON) * (right - left);
  const Y = r => bot - (clamp(lo, 1, r) - lo) / (1 - lo) * (bot - top);
  const t0 = S.learned.at, nowD = dayOf(now());
  let past = '', fut = '';
  for (let i = 0; i < S.hist.length; i++) {
    const h = S.hist[i], a = dayOf(h.t), b = i + 1 < S.hist.length ? dayOf(S.hist[i + 1].t) : nowD;
    let d = '';
    for (let x = a; x <= b + 1e-9; x += Math.max(.1, (b - a) / 30)) d += (d ? 'L' : 'M') + X(x).toFixed(1) + ' ' + Y(R(x - a, h.s)).toFixed(1);
    d += 'L' + X(b).toFixed(1) + ' ' + Y(R(b - a, h.s)).toFixed(1);
    past += `<path d="${d}" fill="none" stroke="#1CB0F6" stroke-width="2.5" stroke-linejoin="round"/>`;
  }
  let c = { s: S.card.s, d: S.card.d }, reps = S.card.reps, lastDay = S.card.last, lastD = dayOf(S.card.lastT), due = S.card.due, guard = 0, dots = '';
  let d = '';
  if (dnum(due) < dnum(today())) due = today();
  while (guard++ < 20) {
    const dueD = dnum(due) - dnum(S.learned.day), from = Math.max(lastD, nowD), to = Math.min(HORIZON, dueD);
    if (to > from) for (let x = from; x <= to + 1e-9; x += Math.max(.2, (to - from) / 24)) d += (d ? 'L' : 'M') + X(x).toFixed(1) + ' ' + Y(R(x - lastD, c.s)).toFixed(1);
    if (dueD >= HORIZON) break;
    const nx = fsrsNext(c, 3, dnum(due) - dnum(lastDay));
    if (dueD > nowD) dots += `<circle cx="${X(dueD).toFixed(1)}" cy="${Y(1).toFixed(1)}" r="4" fill="#fff" stroke="#AFAFAF" stroke-width="2"><title>مراجعة متوقّعة — يوم ${toAr(dueD)}</title></circle>`;
    c = { s: nx.s, d: nx.d }; lastDay = due; lastD = dueD; d += (d ? 'L' : 'M') + X(dueD).toFixed(1) + ' ' + Y(1).toFixed(1); reps++; due = dueAfter(due, nx.s, reps);
  }
  fut = `<path d="${d}" fill="none" stroke="#AFAFAF" stroke-width="2" stroke-dasharray="5 5"/>` + dots;
  const marks = S.log.filter(l => l.ctx === 'cold').map(l => {
    const x = X(dayOf(l.t)).toFixed(1);
    return `<g transform="translate(${x},12)"><circle r="7" fill="${l.ok ? '#58CC02' : '#fff'}" stroke="${l.ok ? '#58A700' : '#EA2B2B'}" stroke-width="2.5"/>
      <title>يوم ${toAr(Math.round(dayOf(l.t)))}: ${l.ok ? 'صح' : 'غلط'} — ${secTxt(l.sec)}${l.pred != null ? ' — توقّع النموذج ' + toAr(Math.round(l.pred * 100)) + '٪' : ''}</title></g>`;
  }).join('');
  const grid = [1, .85, .7].map(r => `<line x1="${left}" x2="${right}" y1="${Y(r)}" y2="${Y(r)}" stroke="#F0F0F0" stroke-width="1.5"/><text x="${right + 4}" y="${Y(r) + 4}" text-anchor="start" font-size="10" fill="#AFAFAF" font-weight="700">${toAr(Math.round(r * 100))}٪</text>`).join('');
  const ticks = [0, 30, 60, 90].map(dd => `<text x="${dd === 0 ? right - 14 : dd === 90 ? left + 22 : X(dd)}" y="${bot + 18}" font-size="11" text-anchor="middle" fill="#AFAFAF" font-weight="700">${dd === 90 ? 'الاختبار' : 'يوم ' + toAr(dd)}</text>`).join('');
  const nowLine = `<line x1="${X(nowD)}" x2="${X(nowD)}" y1="${top - 4}" y2="${bot}" stroke="#CE82FF" stroke-width="1.5" stroke-dasharray="3 3"/><text x="${X(nowD)}" y="${bot + 18}" font-size="11" text-anchor="middle" fill="#A568CC" font-weight="800">${nowD < 8 || nowD > 82 || Math.abs(nowD - 30) < 6 || Math.abs(nowD - 60) < 6 ? '' : 'اليوم'}</text>`;
  return `<svg viewBox="0 0 ${Wd + 22} ${H}" dir="ltr" style="width:100%;height:auto;display:block" role="img" aria-label="منحنى الحفظ">${grid}${nowLine}${fut}${past}${marks}${ticks}</svg>`;
}

    <div class="links"><button id="cp">نسخ النتائج</button><button id="rs">ابدأ من جديد</button></div>

function simPanel() {
  if (!SIM) return '';
  return `<div class="sim"><b style="color:#A568CC">آلة الزمن (تجربة فقط)</b><p class="small" style="margin:2px 0 0">تخزين منفصل عن التجربة الحقيقية. اليوم الحالي: ${toAr(Math.round(dayOf(now())))}</p>
    <div class="row"><button data-d="1">+١ يوم</button><button data-d="3">+٣ أيام</button><button data-d="7">+٧ أيام</button><button data-d="0">صفّر</button></div></div>`;
}
function wireSim() {
  if (!SIM) return;
  $app.querySelectorAll('.sim button').forEach(b => b.addEventListener('click', () => {
    const d = +b.dataset.d; if (d) S.off = (S.off || 0) + d; else S = fresh();
    save(); home();
  }));
}

home();
})();
</script>
