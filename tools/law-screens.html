<!doctype html>
<!-- Every rule screen built for the first three path lessons, side by side (2026-11-04; the user: «show me each law screen you have
     built»). 35 rules, seven screens each, captured from tools/lawapp/run.html by headless Chrome into tools/lawapp/screens/
     (<rule>-<1…7>.jpg). «شغّله» opens the rule live in a phone. Open through node tools/serve.js -->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شاشات القوانين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&display=swap">
<style>
:root { --ink: #3C3C3C; --gray: #777; --line: #E5E5E5; --blue: #1CB0F6; --blue-dk: #1899D6; --blue-light: #DDF4FF; --blue-border: #84D8FF;
  --green: #58CC02; --green-lip: #478700; --gold: #FFC800; --gold-dk: #E6A000; --brown: #CD7900; --font: 'Baloo Bhaijaan 2', 'Segoe UI', Tahoma, sans-serif; color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; background: #EFEFEF; color: var(--ink); font-family: var(--font); line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3, p { margin: 0; }
button, a { font-family: var(--font); cursor: pointer; color: inherit; }
header { max-width: 1500px; margin: 0 auto; padding: 18px 20px 4px; }
header h1 { font-size: 26px; font-weight: 800; line-height: 1.25; }
header p { font-size: 15px; font-weight: 600; color: var(--gray); margin-top: 4px; max-width: 980px; }
.bar { position: sticky; top: 0; z-index: 5; background: rgba(239,239,239,.94); backdrop-filter: blur(6px); }
.bar > div { max-width: 1500px; margin: 0 auto; padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.bar .lbl { font-size: 14px; font-weight: 800; color: var(--gray); margin-inline-start: 4px; }
.chipb { height: 36px; padding: 0 13px; border-radius: 12px; border: 2px solid var(--line); border-bottom-width: 4px; background: #fff; font-size: 14px; font-weight: 800; white-space: nowrap; }
.chipb.on { border-color: var(--blue-border); background: var(--blue-light); color: var(--blue-dk); }
.chipb:active { transform: translateY(2px); border-bottom-width: 2px; }
.sep { width: 2px; height: 24px; background: #DADADA; margin: 0 4px; border-radius: 1px; }
main { max-width: 1500px; margin: 0 auto; padding: 6px 20px 50px; }
.node { margin-top: 22px; scroll-margin-top: 64px; }
.node > h2 { font-size: 22px; font-weight: 800; line-height: 1.3; }
.node > h2 small { display: block; font-size: 14px; font-weight: 800; color: var(--blue-dk); }
.les { margin-top: 14px; }
.les > h3 { font-size: 15px; font-weight: 800; color: var(--gray); margin-bottom: 8px; }
.rule { background: #fff; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 20px; padding: 14px 14px 12px; margin-bottom: 14px; }
.rule-hd { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.rule-hd .n { min-width: 34px; height: 30px; padding: 0 8px; border-radius: 10px; background: var(--gold); box-shadow: 0 3px 0 var(--gold-dk); color: #7A3B12; font-size: 15px; font-weight: 800; display: grid; place-items: center; }
.rule-hd b { font-size: 19px; font-weight: 800; }
.rule-hd .live { margin-inline-start: auto; height: 36px; padding: 0 14px; border-radius: 12px; border: 0; background: var(--green); box-shadow: 0 4px 0 var(--green-lip); color: #fff; font-size: 14.5px; font-weight: 800; }
.rule-hd .live:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--green-lip); }
.strip { display: grid; grid-template-columns: repeat(7, minmax(150px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 4px; }
.shot { display: flex; flex-direction: column; gap: 5px; min-width: 0; border: 0; background: none; padding: 0; text-align: right; }
.shot img { display: block; width: 100%; aspect-ratio: 390 / 780; object-fit: cover; border-radius: 14px; border: 2px solid var(--line); background: #fff; transition: transform .15s; }
.shot:hover img { transform: translateY(-3px); border-color: var(--blue-border); }
.shot span { font-size: 13px; font-weight: 800; color: var(--gray); line-height: 1.35; }
.shot span i { font-style: normal; color: var(--blue-dk); }
.grid1 { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; margin-top: 16px; }
.grid1 .shot span { color: var(--ink); }
.grid1 .shot small { font-size: 12px; font-weight: 700; color: var(--gray); }
/* the big view and the live phone */
.veil { position: fixed; inset: 0; z-index: 20; background: rgba(20,20,20,.72); display: none; align-items: center; justify-content: center; gap: 18px; padding: 16px; }
.veil.on { display: flex; }
.big { display: flex; flex-direction: column; align-items: center; gap: 10px; max-height: 100%; }
.big img { display: block; height: min(780px, calc(100svh - 110px)); width: auto; max-width: calc(100vw - 32px); border-radius: 24px; background: #fff; object-fit: contain; }
.big p { color: #fff; font-size: 16px; font-weight: 800; text-align: center; }
.big p small { display: block; font-size: 13.5px; font-weight: 700; opacity: .8; }
.arw { width: 52px; height: 52px; border-radius: 50%; border: 0; background: #fff; box-shadow: 0 4px 0 #CFCFCF; font-size: 26px; font-weight: 800; color: var(--blue-dk); flex: none; }
.arw:disabled { opacity: .35; }
.x { position: absolute; top: 14px; left: 14px; width: 44px; height: 44px; border-radius: 50%; border: 0; background: #fff; font-size: 22px; font-weight: 800; }
.phone { width: 390px; height: min(800px, calc(100svh - 40px)); border-radius: 40px; border: 10px solid #1F1F1F; background: #fff; overflow: hidden; }
.phone iframe { display: block; width: 100%; height: 100%; border: 0; }
@media (max-width: 700px) {
  header, .bar > div, main { padding-inline: 16px; }
  .strip { grid-template-columns: repeat(7, 150px); }
  .arw { position: absolute; bottom: 16px; }
  .arw.prev { right: 16px; } .arw.next { left: 16px; }
  .big img { height: calc(100svh - 150px); }
  .phone { width: 100%; height: 100svh; border: 0; border-radius: 0; }
}
</style>
</head>
<body>
<header>
  <h1>كل شاشات القوانين</h1>
  <p>هذي <span id="nRules"></span> قانون بنيتها لأول ثلاث دروس في المسار، كل قانون بشاشاته السبع بالترتيب اللي يشوفه الطالب: أول مرة يقابله في الدرس، ثم «كمّل القانون» و«كمّل الخطوة»، ثم بطاقته في «قوانيني»، ثم المراجعة وسؤال القدرات. اضغط أي شاشة تكبر، و«شغّله» يفتح القانون حيّ في جوال.</p>
</header>
<div class="bar"><div>
  <span class="lbl">اعرض</span>
  <button class="chipb on" data-view="all">كل قانون بشاشاته</button>
  <span id="views"></span>
  <span class="sep"></span>
  <span class="lbl">روح للدرس</span>
  <span id="jumps"></span>
</div></div>
<main id="main"></main>
<div class="veil" id="veil"></div>
<script>
const CAT = [{"t": "جمع وطرح وضرب وقسمة الأعداد الكبيرة", "i": 0, "l": [{"t": "اجمعها أزواجاً", "r": [["tens", "الأعداد المكمّلة"]]}, {"t": "مين يبدأ أول؟", "r": [["ops", "ترتيب العمليات"]]}, {"t": "من ١ إلى أي عدد", "r": [["tri", "مجموع ١ إلى ن"], ["common", "العدد المشترك"]]}, {"t": "الفردية من ١", "r": [["oddsum", "مجموع الفردية"], ["oddcnt", "عدد الفردية"]]}, {"t": "الزوجية من ٢", "r": [["evensum", "مجموع الزوجية"]]}, {"t": "الفردية ناقص الزوجية", "r": [["oddeven", "الفردية ناقص الزوجية"]]}, {"t": "الآحاد تكفي", "r": [["last", "رقم الآحاد في الضرب"], ["bigger", "الزيادة الأكبر تكسب"]]}]}, {"t": "قوانين هامة في القدرات", "i": 1, "l": [{"t": "«بين» ولا «من… إلى»؟", "r": [["fromto", "من… إلى، وبين"], ["queue", "الترتيب من الطرفين"]]}, {"t": "كم زوجياً؟ كم فردياً؟", "r": [["evcount", "كم عدداً زوجياً؟"], ["evedge", "الأطراف الفردية"]]}, {"t": "مصافحات وهدايا", "r": [["hand", "المصافحات"], ["gifts", "الهدايا"]]}, {"t": "الدوري والمثلثات", "r": [["league", "مباريات الدوري"], ["tris", "المثلثات من رأس واحد"]]}, {"t": "العلامات والقصّ", "r": [["marks", "العلامات على الطريق"], ["cuts", "مرات القصّ"]]}, {"t": "زاوية العقربين", "r": [["clock", "زاوية الساعة"], ["clockm", "الساعة مع الدقائق"]]}, {"t": "معاً ومتى يتساوون", "r": [["equal", "متى يتساويان؟"], ["work", "العمل معاً"]]}]}, {"t": "الاحتمالات والإحصاء", "i": 2, "l": [{"t": "الاحتمال في سطر", "r": [["prob", "الاحتمال"]]}, {"t": "عملات ونرد", "r": [["outcomes", "عملات ونرد"], ["order", "كل ترتيب ينحسب"]]}, {"t": "مبدأ العد", "r": [["ways", "مبدأ العدّ"], ["norep", "بدون تكرار"]]}, {"t": "الوسيط والمنوال والمدى", "r": [["median", "الوسيط"]]}, {"t": "الوسط وعكسه", "r": [["mean", "الوسط الحسابي"], ["total", "المجموع من الوسط"]]}, {"t": "توافيق ولا تباديل؟", "r": [["permcomb", "تباديل ولا توافيق؟"], ["places", "كم مكان؟"], ["choose", "التوافيق"]]}]}];
/* the seven screens, in the order a student meets them */
const SCR = [
  { t: 'وش الناقص؟', w: 'أول مرة في الدرس' },
  { t: 'البرهان', w: 'بعد ما يختار الكلمة' },
  { t: 'كمّل القانون', w: 'الكلمات من البطاقات' },
  { t: 'كمّل الخطوة', w: 'المثال خطوة خطوة' },
  { t: 'بطاقته في «قوانيني»', w: 'متى يجيك والفخ' },
  { t: 'المراجعة', w: 'كل كلمة فراغ' },
  { t: 'سؤال قدرات', w: 'بأرقام جديدة' },
];
const A = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const RULES = []; CAT.forEach(n => n.l.forEach(l => l.r.forEach(([k, name]) => RULES.push({ k, name, les: l.t, node: n }))));
const src = (k, s) => `lawapp/screens/${k}-${s + 1}.jpg`;
document.getElementById('nRules').textContent = A(RULES.length);
const main = document.getElementById('main'), veil = document.getElementById('veil');
let view = 'all';
document.getElementById('views').innerHTML = SCR.map((s, i) => `<button class="chipb" data-view="${i}">${A(i + 1)} ${s.t}</button>`).join(' ');
document.getElementById('jumps').innerHTML = CAT.map(n => `<button class="chipb" data-jump="${n.i}">الدرس ${A(n.i + 1)}</button>`).join(' ');
function draw() {
  if (view === 'all') {
    let num = 0;
    main.innerHTML = CAT.map(n => `<section class="node" id="node${n.i}"><h2><small>الدرس ${A(n.i + 1)} في المسار</small>${n.t}</h2>
      ${n.l.map(l => `<div class="les"><h3>الدرس القصير: ${l.t}</h3>${l.r.map(([k, name]) => { num++; return `<div class="rule">
        <div class="rule-hd"><span class="n">${A(num)}</span><b>${name}</b><button class="live" data-live="${k}">شغّله</button></div>
        <div class="strip">${SCR.map((s, i) => `<button class="shot" data-k="${k}" data-s="${i}"><img loading="lazy" src="${src(k, i)}" alt="${name}: ${s.t}"><span><i>${A(i + 1)}</i> ${s.t}</span></button>`).join('')}</div></div>`; }).join('')}</div>`).join('')}</section>`).join('');
  } else {
    const i = +view;
    main.innerHTML = CAT.map(n => `<section class="node" id="node${n.i}"><h2><small>الدرس ${A(n.i + 1)} في المسار</small>${n.t}</h2>
      <div class="grid1">${n.l.map(l => l.r.map(([k, name]) => `<button class="shot" data-k="${k}" data-s="${i}"><img loading="lazy" src="${src(k, i)}" alt="${name}: ${SCR[i].t}"><span>${name}</span><small>${l.t}</small></button>`).join('')).join('')}</div></section>`).join('');
  }
}
/* the big view walks a rule's seven screens in «كل قانون», and every rule's same screen in a one-screen view */
let cur = null;
function seq() { return view === 'all' ? SCR.map((s, i) => [cur.k, i]) : RULES.map(r => [r.k, +view]); }
function big() {
  const L = seq(), at = L.findIndex(([k, s]) => k === cur.k && s === cur.s), R = RULES.find(r => r.k === cur.k), S = SCR[cur.s];
  veil.innerHTML = `<button class="x" aria-label="إغلاق">✕</button><button class="arw prev" ${at <= 0 ? 'disabled' : ''} aria-label="السابق">›</button>
    <div class="big"><img src="${src(cur.k, cur.s)}" alt=""><p>${R.name} — ${A(cur.s + 1)} ${S.t}<small>${S.w}، ${R.les}</small></p></div>
    <button class="arw next" ${at >= L.length - 1 ? 'disabled' : ''} aria-label="التالي">‹</button>`;
  veil.classList.add('on');
  const to = d => { const n = L[at + d]; if (!n) return; cur = { k: n[0], s: n[1] }; big(); };
  veil.querySelector('.prev').onclick = () => to(-1); veil.querySelector('.next').onclick = () => to(1);
  veil.querySelector('.x').onclick = close; veil._to = to;
}
function live(k) {
  cur = null;
  veil.innerHTML = `<button class="x" aria-label="إغلاق">✕</button><div class="phone"><iframe src="lawapp/run.html?dev=1&a=${Date.now()}#rule:${k}" title="التطبيق" allow="autoplay"></iframe></div>`;
  veil.classList.add('on'); veil.querySelector('.x').onclick = close; veil._to = null;
}
function close() { veil.classList.remove('on'); veil.innerHTML = ''; }
veil.onclick = e => { if (e.target === veil) close(); };
addEventListener('keydown', e => { if (!veil.classList.contains('on')) return; if (e.key === 'Escape') close();
  else if (veil._to && e.key === 'ArrowLeft') veil._to(1); else if (veil._to && e.key === 'ArrowRight') veil._to(-1); });
main.onclick = e => { const b = e.target.closest('.shot'); if (b) { cur = { k: b.dataset.k, s: +b.dataset.s }; big(); return; }
  const l = e.target.closest('[data-live]'); if (l) live(l.dataset.live); };
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { view = b.dataset.view; document.querySelectorAll('[data-view]').forEach(x => x.classList.toggle('on', x === b)); draw(); });
document.getElementById('jumps').onclick = e => { const b = e.target.closest('[data-jump]'); if (b) document.getElementById('node' + b.dataset.jump).scrollIntoView({ behavior: 'smooth' }); };
draw();
</script>
</body>
</html>
