<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rule Lab Two</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="../css/style.css">
<style>
  /* The rule, met five evidence-based ways, and kept for ninety days
     (2026-10-26: «they want a very nice and easy way to learn and memorize …
     1- memorize it fast 2- not forget it … 90 days»). Every version is grounded
     in research/rule-memory.md. Each phone is a whole first meeting with a rule
     — four to seven screens — on three real rules of node 1 (learn.js,
     skills.bigsum lessons 1, 4 and 5), and each ends on recall from a blank.
     The last section is the review plan every version shares. Nothing here is
     in the app. */
  html, body { background: #F7F7F7; }
  body { margin: 0; font-family: var(--font); color: var(--ink); }
  .lab { max-width: 2140px; margin: 0 auto; padding: 28px 16px 72px; }
  .lab-h { max-width: 680px; margin: 0 auto 30px; text-align: center; }
  .lab-h h1 { font-size: 28px; font-weight: 800; margin: 0; }
  .lab-h p { margin: 8px 0 0; color: var(--gray); font-weight: 600; font-size: 15.5px; line-height: 1.65; }
  .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 40px 26px; }
  .ver { width: min(390px, 100%); }
  .ver-h { display: flex; align-items: center; gap: 9px; margin: 0 4px 10px; }
  .ver-h b { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; background: var(--ink); color: #fff; font-size: 16px; font-family: system-ui, sans-serif; }
  .ver-h span { font-size: 19px; font-weight: 800; }
  button { -webkit-tap-highlight-color: transparent; font-family: var(--font); }

  /* ---------- the phone ---------- */
  .phone {
    position: relative; height: 790px; box-sizing: border-box; background: #fff;
    border: 2px solid var(--line); border-bottom-width: 6px; border-radius: 34px;
    padding: 14px 16px 16px; display: flex; flex-direction: column; overflow: hidden;
  }
  .ph-top { display: flex; align-items: center; gap: 6px; }
  .pills { display: flex; gap: 6px; flex: 1; min-width: 0; }
  .pill {
    border: 2px solid var(--line); border-bottom-width: 4px; background: #fff; border-radius: 12px;
    padding: 4px 9px 2px; font: 700 13.5px var(--font); color: var(--gray); white-space: nowrap; cursor: pointer;
  }
  .pill.on { border-color: var(--blue-border); background: var(--blue-light); color: var(--blue-dk); }
  .pill:active, .rp:active { border-bottom-width: 2px; translate: 0 2px; }
  .rp {
    flex-shrink: 0; width: 38px; height: 38px; border-radius: 12px; border: 2px solid var(--line); border-bottom-width: 4px;
    background: #fff; display: grid; place-items: center; color: var(--gray); padding: 0; cursor: pointer;
  }
  .rp svg { width: 18px; height: 18px; }
  .steps { display: flex; gap: 5px; margin: 14px 2px 0; }
  .steps i { flex: 1; height: 10px; border-radius: 5px; background: var(--line); position: relative; overflow: hidden; }
  .steps i.done { background: var(--green); }
  .steps i.now::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--green-pale); animation: stNow 1.6s ease-in-out infinite; }
  @keyframes stNow { 50% { opacity: .35; } }
  .ph-kick { margin: 16px 0 0; font-size: 14px; font-weight: 800; color: var(--purple-dk); min-height: 20px; }
  .ph-h { font-size: 21px; font-weight: 800; line-height: 1.35; margin: 2px 0 0; min-height: 28px; }
  .ph-h b { color: var(--blue); }
  .stage { position: relative; flex: 1; min-height: 0; margin-top: 12px; display: flex; flex-direction: column; }
  .ph-foot { padding-top: 6px; }
  .tip { min-height: 48px; margin: 0 0 8px; text-align: center; font-weight: 700; font-size: 15px; color: var(--gray); line-height: 1.5; display: flex; align-items: center; justify-content: center; padding: 0 6px; }
  .tip b { color: var(--ink); }
  .tip.good b, .tip.good { color: var(--green-dk); }
  .gobtn {
    display: block; width: 100%; height: 48px; border: 0; border-radius: 14px; margin-bottom: 5px; cursor: pointer;
    font: 800 16.5px var(--font); color: #fff; background: var(--green); box-shadow: 0 5px 0 var(--green-lip);
  }
  .gobtn:not(:disabled):active { translate: 0 5px; box-shadow: 0 0 0 var(--green-lip); }
  .gobtn:disabled { background: var(--line); box-shadow: 0 5px 0 #CFCFCF; color: #AFAFAF; cursor: default; }
  .cap { margin: 14px 6px 0; }
  .cap p { margin: 0; font-weight: 700; font-size: 15px; line-height: 1.6; }
  .cap ul { direction: ltr; text-align: left; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-weight: 500; font-size: 13px; color: var(--gray); margin: 8px 0 0; padding-left: 18px; line-height: 1.5; }
  .cap li + li { margin-top: 4px; }
  .cap li b { color: var(--ink); font-weight: 650; }

  /* ---------- colours of a rule's terms ---------- */
  .k-blue   { --c: #1CB0F6; --cd: #1899D6; --cl: #DDF4FF; --cb: #84D8FF; --ct: #1899D6; }
  .k-purple { --c: #CE82FF; --cd: #A568CC; --cl: #F6E8FF; --cb: #E3B6FF; --ct: #A568CC; }
  .k-orange { --c: #FF9600; --cd: #E07800; --cl: #FFEFD6; --cb: #FFC778; --ct: #E07800; }
  .k-green  { --c: #58CC02; --cd: #58A700; --cl: #D7FFB8; --cb: #A5ED6E; --ct: #58A700; }
  .k-red    { --c: #FF4B4B; --cd: #EA2B2B; --cl: #FFDFE0; --cb: #FFB2B2; --ct: #EA2B2B; }

  /* ---------- the rule line ---------- */
  .rrow { display: flex; align-items: center; justify-content: center; gap: .3em; white-space: nowrap; font-size: 18px; min-width: 0; }
  .rrow > *, .eqline > *, .said > *, .cmp-long > *, .cmp-fast > * { flex: none; }
  .rrow .op { font-size: 1.15em; font-weight: 800; color: var(--gray-icon); line-height: 1; }
  .rrow .w { font-weight: 800; color: var(--ink); }
  .rwrap { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .rwrap > .rrow { align-self: stretch; }
  .rpre { font-size: 15px; font-weight: 800; color: var(--gray); }
  .chip {
    display: inline-flex; align-items: center; justify-content: center; padding: .2em .62em .08em;
    border-radius: .72em; background: var(--c); box-shadow: 0 .2em 0 var(--cd); color: #fff;
    font-weight: 800; line-height: 1.45; white-space: nowrap;
  }
  .chip.soft { background: var(--cl); box-shadow: 0 .16em 0 var(--cb); color: var(--ct); }
  .slot {
    display: inline-block; min-width: 3.4em; height: 2em; border-radius: .7em; box-sizing: border-box;
    border: 2px dashed #CFCFCF; background: #F7F7F7;
  }
  .slot.cue { min-width: 2.2em; display: inline-grid; place-items: center; color: #BDBDBD; font-weight: 800; font-size: .9em; }

  /* ---------- the rule card: white, its picture and its name ---------- */
  .rc {
    position: relative; background: #fff; border: 2px solid var(--line); border-bottom-width: 5px; border-radius: 20px;
    padding: 12px 12px 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .rc-h { display: flex; align-items: center; gap: 8px; min-height: 30px; }
  .rc-ic { width: 34px; height: 34px; border-radius: 11px; background: var(--purple); box-shadow: 0 3px 0 var(--purple-dk); display: grid; place-items: center; flex: none; }
  .rc-ic svg { width: 24px; height: 24px; }
  .rc-tag { font-size: 14px; font-weight: 800; color: var(--gray); }
  .rc-name { font-size: 16px; font-weight: 800; color: var(--purple-dk); background: #F6E8FF; border-radius: 10px; padding: 2px 10px 0; }
  .rc-own { margin-inline-start: auto; font-size: 12.5px; font-weight: 800; color: var(--green-dk); display: inline-flex; align-items: center; gap: 4px; }
  .rc-own svg { width: 15px; height: 15px; }
  .rc-body { display: flex; align-items: center; gap: 10px; }
  .rc-body .rrow { flex: 1; }
  .rc-pic { flex: none; width: 64px; height: 56px; border-radius: 14px; background: #F7F7F7; display: grid; place-items: center; }
  .rc-pic svg { width: 50px; height: 42px; }
  .rc-h .rc-pic { margin-inline-start: auto; width: 54px; height: 42px; border-radius: 12px; }
  .rc-h .rc-pic svg { width: 40px; height: 32px; }
  .rc-own + .rc-pic { margin-inline-start: 8px; }

  /* ---------- big type ---------- */
  .big { text-align: center; font-size: 27px; font-weight: 800; line-height: 1.5; white-space: nowrap; }
  .big.sm { font-size: 22px; }
  .eqline { display: flex; justify-content: center; align-items: center; gap: .3em; white-space: nowrap; font-size: 24px; font-weight: 800; }
  .ans { color: var(--green-dk); }
  .note { text-align: center; font-size: 15px; font-weight: 700; color: var(--gray); }
  .muted { color: var(--gray-icon); }

  /* ---------- choices ---------- */
  .opts { display: grid; gap: 10px; }
  .opts.c3 { grid-template-columns: repeat(3, 1fr); }
  .opt {
    min-height: 54px; border-radius: 14px; border: 2px solid var(--line); border-bottom-width: 4px; background: #fff;
    font: 800 20px/1.3 var(--font); color: var(--ink); cursor: pointer; padding: 8px 10px; text-align: center;
  }
  .opt.txt { font-size: 15.5px; font-weight: 700; text-align: start; padding: 10px 14px; }
  .opt:not(:disabled):active { border-bottom-width: 2px; translate: 0 2px; }
  .opt.sel { border-color: var(--blue-border); background: var(--blue-light); color: var(--blue-dk); }
  .opt.ok { border-color: var(--green-pale); background: var(--green-bg); color: var(--green-dk); }
  .opt.no { border-color: #FFB2B2; background: var(--red-bg); color: var(--red-dk2); }
  .opt.dim { opacity: .45; }
  .opt:disabled { cursor: default; }

  /* ---------- tiles and blanks ---------- */
  .tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; margin-top: 18px; }
  .tl {
    display: inline-grid; place-items: center; box-sizing: border-box; min-width: 50px; height: 46px; padding: 0 12px 2px;
    border-radius: 13px; background: #fff; border: 2px solid var(--line); border-bottom-width: 4px;
    font: 800 18px/1 var(--font); color: var(--ink); white-space: nowrap; cursor: pointer;
  }
  .tl:active { border-bottom-width: 2px; translate: 0 2px; }
  .tl.used { background: var(--line); border-color: var(--line); color: transparent; pointer-events: none; }
  .bk { /* a blank in the rule */
    display: inline-grid; place-items: center; min-width: 3.6em; height: 2.05em; box-sizing: border-box; padding: 0 .5em;
    border-radius: .65em; border: 2px dashed #CFCFCF; background: #F7F7F7; font-weight: 800; color: var(--blue-dk); cursor: pointer; white-space: nowrap;
  }
  .bk.f { border: 2px solid var(--blue-border); border-bottom-width: 3px; background: var(--blue-light); }
  .bk.no { border-color: var(--red); background: var(--red-bg); color: var(--red-dk2); }
  .bk.ok, .chip.ok, .kp-in.ok, .tl.ok { border-color: var(--green-pale) !important; background: var(--green-bg) !important; color: var(--green-dk) !important; box-shadow: 0 .16em 0 var(--green-pale); }
  .box { background: #fff; border: 2px solid var(--line); border-radius: 18px; box-shadow: 0 2px 0 var(--line); padding: 16px 10px; }

  /* ---------- the keypad ---------- */
  .kp-wrap { margin-top: auto; }
  .kp-in {
    display: flex; align-items: center; justify-content: center; gap: 2px; height: 58px; margin: 0 auto 12px; width: 70%;
    border-radius: 16px; border: 2px solid var(--line); border-bottom-width: 4px; background: #fff; font: 800 30px/1 var(--font); color: var(--ink);
  }
  .kp-in.no { border-color: #FFB2B2; background: var(--red-bg); color: var(--red-dk2); }
  .kp-car { width: 2px; height: 30px; background: var(--blue); animation: car 1s steps(1) infinite; }
  .kp-in.ok .kp-car, .kp-in.lock .kp-car { display: none; }
  @keyframes car { 50% { opacity: 0; } }
  .kp { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .kp button {
    height: 46px; border-radius: 13px; border: 2px solid var(--line); border-bottom-width: 4px; background: #fff;
    font: 800 22px/1 var(--font); color: var(--ink); cursor: pointer; padding: 0 0 2px;
  }
  .kp button:active { border-bottom-width: 2px; translate: 0 2px; }
  .kp button.del { color: var(--gray); font-size: 19px; }
  .kp span { display: block; }
  .kp.small button { height: 40px; font-size: 19px; }

  /* ---------- the reminder after a miss: the trick's rows for three seconds ---------- */
  .remind {
    position: absolute; inset: 0; z-index: 40; background: rgba(255, 255, 255, .96); border-radius: 18px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center;
  }
  .remind .rk { font-size: 14px; font-weight: 800; color: var(--purple-dk); }
  .remind .rr { font-size: 22px; font-weight: 800; white-space: nowrap; }
  .remind .rb { width: 60%; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 10px; }
  .remind .rb i { display: block; height: 100%; background: var(--purple); width: 100%; }

  /* ---------- A: guess, race, compare ---------- */
  .timer { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; margin: 6px 20px 18px; }
  .timer i { display: block; height: 100%; width: 100%; background: var(--orange); border-radius: 5px; }
  .drop { text-align: center; font-size: 46px; font-weight: 800; color: var(--green-dk); line-height: 1.2; margin-top: 18px; }
  .lane { border-radius: 18px; padding: 12px 14px; border: 2px solid var(--line); border-bottom-width: 4px; background: #fff; }
  .lane + .lane { margin-top: 12px; }
  .lane-h { display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 800; color: var(--gray); }
  .lane-h .tm { font-variant-numeric: tabular-nums; color: var(--ink); }
  .lane-v { font-size: 30px; font-weight: 800; text-align: center; margin-top: 4px; min-height: 44px; white-space: nowrap; }
  .lane-bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin-top: 6px; }
  .lane-bar i { display: block; height: 100%; width: 0; background: var(--gray-icon); border-radius: 4px; }
  .lane.fast { border-color: var(--green-pale); background: var(--green-bg); }
  .lane.fast .lane-h { color: var(--green-dk); }
  .lane.fast .lane-bar i { background: var(--green); }
  .cmp { display: flex; flex-direction: column; gap: 12px; }
  .cmp-card { border-radius: 18px; border: 2px solid var(--line); border-bottom-width: 4px; padding: 12px 10px 10px; text-align: center; }
  .cmp-long { display: flex; justify-content: center; align-items: center; flex-wrap: nowrap; gap: 5px; font-size: 20px; font-weight: 800; white-space: nowrap; }
  .cmp-long .t { position: relative; display: inline-grid; place-items: center; min-width: 1.4em; padding: 1px 4px 0; border-radius: 8px; transition: background .2s, color .2s; }
  .cmp-long .t.hl { background: var(--cl); color: var(--ct); }
  .cmp-long .t .n { position: absolute; top: -13px; left: 50%; translate: -50% 0; min-width: 18px; height: 18px; border-radius: 9px; background: var(--purple); color: #fff; font-size: 11.5px; line-height: 19px; }
  .cmp-long .p { color: var(--gray-icon); }
  .cmp-fast { display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 12px; font-size: 22px; font-weight: 800; white-space: nowrap; }
  .cmp-fast .op { color: var(--gray-icon); }
  .ftk { border: 0; cursor: pointer; font: 800 22px/1.4 var(--font); padding: 1px 12px 0; border-radius: 12px; background: #fff; box-shadow: inset 0 0 0 2px var(--cb), 0 3px 0 var(--cb); color: var(--ct); animation: ftk 1.6s ease-in-out infinite; }
  .ftk.on { background: var(--c); color: #fff; box-shadow: 0 3px 0 var(--cd); animation: none; }
  @keyframes ftk { 50% { translate: 0 -3px; } }

  /* ---------- B: from things to symbols ---------- */
  .pic { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 6px; position: relative; }
  .drow { display: flex; gap: 8px; padding: 8px 12px; border-radius: 20px; border: 2px dashed transparent; cursor: pointer; background: none; position: relative; }
  .drow .d { width: 22px; height: 22px; border-radius: 50%; background: #E5E5E5; box-shadow: inset 0 -3px 0 #D0D0D0; transition: background .2s, box-shadow .2s; }
  .drow.idle { border-color: #DADADA; animation: ftk 1.6s ease-in-out infinite; }
  .drow.g { background: var(--blue-light); border: 2px solid var(--blue-border); cursor: default; }
  .drow.g .d { background: var(--blue); box-shadow: inset 0 -3px 0 var(--blue-dk); }
  .drow .dc { position: absolute; left: -38px; top: 50%; translate: 0 -50%; min-width: 26px; height: 26px; border-radius: 13px; background: var(--blue); box-shadow: 0 3px 0 var(--blue-dk); color: #fff; font-size: 15px; font-weight: 800; display: grid; place-items: center; line-height: 1; }
  .brk { position: absolute; font-size: 15px; font-weight: 800; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .brk .line { background: currentColor; border-radius: 2px; }
  .brk.v { flex-direction: row; color: var(--purple-dk); }
  .brk.v .line { width: 4px; align-self: stretch; }
  .brk.h { flex-direction: column; color: var(--blue-dk); }
  .brk.h .line { height: 4px; align-self: stretch; }
  .gtiles { display: flex; gap: 5px; justify-content: center; margin-top: 8px; }
  .gt { width: 30px; height: 40px; border-radius: 10px; border: 2px solid var(--line); border-bottom-width: 4px; background: #fff; display: grid; place-items: center; font-weight: 800; font-size: 16px; cursor: pointer; padding: 0; }
  .gt.p { background: var(--cl); border-color: var(--cb); color: var(--ct); cursor: default; }
  .pairs { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 18px; min-height: 40px; }
  .pairs .chip { font-size: 16px; }
  .sq { display: grid; gap: 4px; justify-content: center; margin-top: 6px; }
  .sq i { width: 36px; height: 36px; border-radius: 9px; border: 2px dashed #DADADA; box-sizing: border-box; }
  .sq i.on { border: 0; background: var(--c); box-shadow: inset 0 -4px 0 var(--cd); }
  .sq.idle { cursor: pointer; }
  .runsum { text-align: center; font-size: 22px; font-weight: 800; margin-top: 14px; min-height: 34px; white-space: nowrap; }
  .collapse { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 18px; }
  .numrow .chip { cursor: pointer; }
  .numrow .chip.num { animation: ftk 1.6s ease-in-out infinite; }

  /* ---------- C: faded examples ---------- */
  .wk { display: flex; flex-direction: column; gap: 6px; }
  .wk-l { display: flex; align-items: center; gap: 10px; }
  .wk-l .eqline { flex: 1; justify-content: flex-start; font-size: 22px; }
  .wk-t { flex: none; width: 74px; font-size: 12.5px; font-weight: 800; color: var(--purple-dk); text-align: center; background: #F6E8FF; border-radius: 9px; padding: 3px 4px 1px; line-height: 1.3; }
  .fb { display: inline-grid; place-items: center; min-width: 1.9em; height: 1.55em; border-radius: .5em; border: 2px dashed var(--blue-border); background: #F7F7F7; color: var(--blue-dk); }
  .fb.f { border-style: solid; background: var(--blue-light); }
  .clock { display: flex; justify-content: center; align-items: center; gap: 6px; font-size: 14px; font-weight: 800; color: var(--gray); margin-bottom: 4px; }
  .clock b { font-variant-numeric: tabular-nums; color: var(--ink); min-width: 1.6em; text-align: center; }

  /* ---------- D: the name ---------- */
  .ntag {
    display: inline-flex; align-items: center; gap: 10px; padding: 8px 18px 6px 10px; border-radius: 18px; cursor: pointer; border: 0;
    background: var(--purple); box-shadow: 0 5px 0 var(--purple-dk); color: #fff; font: 800 22px/1.3 var(--font);
  }
  .ntag .ni { width: 38px; height: 38px; border-radius: 12px; background: #fff; display: grid; place-items: center; }
  .ntag .ni svg { width: 28px; height: 28px; }
  .ntag.idle { animation: ftk 1.6s ease-in-out infinite; }
  .why-q { font-size: 20px; font-weight: 800; text-align: center; line-height: 1.5; margin-bottom: 14px; }
  .more { margin-top: 12px; border-radius: 16px; background: var(--green-bg); color: var(--green-dk); font-weight: 800; font-size: 15.5px; padding: 10px 14px; line-height: 1.5; text-align: center; }

  /* ---------- E: which rule ---------- */
  .bins { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: auto; }
  .bin {
    border-radius: 18px; border: 2px solid var(--line); border-bottom-width: 5px; background: #fff; cursor: pointer;
    padding: 10px 8px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 120px; font-family: var(--font);
  }
  .bin:active { border-bottom-width: 3px; translate: 0 2px; }
  .bin .bi { width: 40px; height: 40px; border-radius: 12px; background: var(--purple); box-shadow: 0 3px 0 var(--purple-dk); display: grid; place-items: center; }
  .bin .bi svg { width: 28px; height: 28px; }
  .bin.alt .bi { background: var(--blue); box-shadow: 0 3px 0 var(--blue-dk); }
  .bin b { font-size: 15px; font-weight: 800; color: var(--ink); line-height: 1.3; text-align: center; }
  .bin .cnt { display: flex; gap: 4px; min-height: 12px; }
  .bin .cnt i { width: 12px; height: 12px; border-radius: 50%; background: var(--green); }
  .bin.hit { border-color: var(--green-pale); background: var(--green-bg); }

<div class="lab">

    <h1>القاعدة — تنحفظ بسرعة وما تنتسى</h1>
    <p>خمس طرق يقابل فيها الطالب القاعدة أول مرة، كل وحدة مبنية على أبحاث الذاكرة وطريقة ديولينجو — وكلها تنتهي بإنه يتذكرها من الصفر. وتحتها الخطة اللي تخليها معه ٩٠ يوم لين الاختبار.</p>

<script>
(function () {
  /* ================================================================
     helpers
     ================================================================ */
  const ar = n => String(n).replace(/-/g, '−').replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);

  const $ = (s, r = document) => r.querySelector(s);

    { opacity: 0, scale: '.3' }, { opacity: 1, scale: '1.14', offset: .55 }, { scale: '.96', offset: .8 }, { opacity: 1, scale: '1' }],

  /* ---------------- icons and pictures ---------------- */
  const SVG = {
    replay: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>',

    bulb: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2.5a7 7 0 0 0-4.2 12.6c.7.5 1.2 1.3 1.2 2.2v.7h6v-.7c0-.9.5-1.7 1.2-2.2A7 7 0 0 0 12 2.5z"/><rect x="9" y="19" width="6" height="2.6" rx="1.3"/></svg>'

    rep: {

  /* one rule under HLR (Settles & Meeder 2016): p = 2^(-Δ/h), h starts at 3 days;

    let last = 0, h = 3;
    for (const r of REV) { if (r.day <= t) { last = r.day; h = r.h * 2.5; } else break; }
    return FLOOR + (1 - FLOOR) * Math.pow(2, -(t - last) / h);
  };

          <div class="rv-k">مراجعة — ${K.title}</div><div class="stage"></div><button class="gobtn" disabled>تحقق</button>`;
        const st = $('.stage', el), go = $('.gobtn', el);
        let check = null;
        const done = (msg, soft) => {
          go.disabled = false; go.textContent = 'مرة ثانية';
          check = () => { tries = 0; run(); };
          st.insertAdjacentHTML('beforeend', `<div class="rv-done${soft ? ' soft' : ''}">${msg}</div>`); rise(st.lastChild);
        };
        const ok = () => { right(); buzz(20); done(tries ? 'صح — بس ترجع لك بكرة عشان تثبت' : `ممتاز — المراجعة الجاية بعد ${pick(['٣ أيام', 'أسبوع', 'أسبوعين'])}`, !!tries); };
        const miss = again => { bad(); tries++; remind(el, K.R, again); };
        if (K.k === 'apply') {
          const v = K.R.gen();
          st.innerHTML = `<div class="rec-cue" style="margin-bottom:6px"><span class="rc-pic">${PIC[K.R.key]}</span></div><div class="big sm">${v.long} = ؟</div>`;
          fitAll(st);
          const kp = keypad(st, s => go.disabled = !s, true);
          check = () => { if (kp.n() === v.ans) { kp.lock(); wave([kp.inp]); $('.big', st).innerHTML = `${v.long} = <span class="ans">${ar(v.ans)}</span>`; fitAll(st); ok(); } else { kp.inp.classList.add('no'); shake(kp.inp); go.disabled = true; miss(() => kp.clear()); } };
        }
        if (K.k === 'name') {
          const v = K.R.gen();
          st.innerHTML = `<div class="rv-q">أسرع طريقة لحل<br><span style="white-space:nowrap">${v.long}</span>؟</div><div class="opts">${shuf(['gauss', 'rep', 'odd']).map(k => `<button class="opt txt" data-k="${k}" style="display:flex;align-items:center;gap:8px"><span class="rc-ic" style="width:26px;height:26px;border-radius:8px">${iconWhite(k)}</span>${RULES[k].name}</button>`).join('')}</div>`;
          fitAll(st);
          let sel = null;
          st.addEventListener('click', e => { const b = e.target.closest('.opt'); if (!b || b.disabled) return; tap(); sel = b; $$('.opt', st).forEach(x => x.classList.toggle('sel', x === b)); go.disabled = false; });
          check = () => {
            if (sel.dataset.k === 'gauss') { $$('.opt', st).forEach(x => { x.disabled = true; x.classList.toggle('dim', x !== sel); }); sel.classList.replace('sel', 'ok'); wave([sel]); ok(); }
            else { sel.classList.replace('sel', 'no'); shake(sel); go.disabled = true; miss(() => { $$('.opt', st).forEach(x => x.classList.remove('no', 'sel')); }); }
          };
        }
        if (K.k === 'recall') {
          st.innerHTML = `<div class="rec-cue" style="margin-bottom:6px"><span class="rc-pic">${PIC[K.R.key]}</span></div>`;
          const bd = builder(st, K.R, full => go.disabled = !full);
          fitAll(st);
          check = () => { if (bd.check()) ok(); else { go.disabled = true; miss(); } };
        }
        if (K.k === 'spot') {
          const v = K.R.gen(), sp = K.R.spot(v);
          st.innerHTML = `<div class="rv-q" style="font-size:16px">أحمد كتب:</div><div class="box"><div class="big sm">${v.long}</div><div class="said"><span class="op" style="color:var(--gray-icon)">=</span>${sp.said.map((x, i) => typeof x === 'number' ? `<button class="stk" data-i="${i}">${ar(x)}</button>` : `<span class="op" style="color:var(--gray-icon)">${x}</span>`).join('')}</div></div><div class="note" style="margin-top:10px">اضغط الرقم الغلط</div>`;
          fitAll(st);
          let sel = null;
          st.addEventListener('click', e => { const b = e.target.closest('.stk'); if (!b || b.disabled) return; tap(); sel = b; $$('.stk', st).forEach(x => x.classList.toggle('no', false)); $$('.stk', st).forEach(x => x.style.outline = x === b ? '2px solid var(--blue-border)' : ''); go.disabled = false; });
          check = () => {
            if (sp.wrong.includes(+sel.dataset.i)) { $$('.stk', st).forEach(x => { x.disabled = true; x.style.outline = ''; }); wave(sp.wrong.map(i => $(`.stk[data-i="${i}"]`, st))); st.insertAdjacentHTML('beforeend', `<div class="note" style="color:var(--green-dk)">${sp.fix}</div>`); ok(); }
            else { sel.classList.add('no'); shake(sel); go.disabled = true; miss(() => { sel.classList.remove('no'); sel.style.outline = ''; }); }
          };
        }
        go.addEventListener('click', () => { if (!go.disabled && check) { tap(); check(); } });
      };
      run();
    });
  }

  /* ---------------- go ---------------- */
  const start = () => { VERS.forEach(V => mount(V).start()); plan(); };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(start); else start();
})();
</script>
</body>
</html>
