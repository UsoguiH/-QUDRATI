<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rule Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="../css/style.css">
<style>
  /* The rule, met five new ways (2026-10-26: «i want it full redesign even the
     yellow everything in it … an experience where the user is very interactive
     with it … create 5 different versions»). Each phone plays one idea on three
     real rules from node 1 (learn.js: skills.bigsum lessons 1, 4 and 5). Nothing
     here is in the app. */
  html, body { background: #F7F7F7; }
  body { margin: 0; font-family: var(--font); color: var(--ink); }
  .lab { max-width: 2100px; margin: 0 auto; padding: 28px 16px 64px; }
  .lab-h { max-width: 620px; margin: 0 auto 28px; text-align: center; }
  .lab-h h1 { font-size: 27px; font-weight: 800; }
  .lab-h p { margin: 6px 0 0; color: var(--gray); font-weight: 600; font-size: 15px; line-height: 1.6; }
  .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 36px 26px; }
  .ver { width: min(390px, 100%); }
  .ver-h { display: flex; align-items: center; gap: 9px; margin: 0 4px 10px; }
  .ver-h b { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; background: var(--ink); color: #fff; font-size: 16px; font-family: system-ui, sans-serif; }
  .ver-h span { font-size: 19px; font-weight: 800; }
  .phone {
    position: relative; height: 790px; box-sizing: border-box; background: #fff;
    border: 2px solid var(--line); border-bottom-width: 6px; border-radius: 34px;
    padding: 14px 14px 16px; display: flex; flex-direction: column; overflow: hidden;
  }
  .ph-top { display: flex; align-items: center; gap: 6px; }
  .pills { display: flex; gap: 6px; flex: 1; min-width: 0; }
  .pill {
    border: 2px solid var(--line); border-bottom-width: 4px; background: #fff; border-radius: 12px;
    padding: 4px 9px 2px; font: 700 13.5px var(--font); color: var(--gray); white-space: nowrap;
  }
  .pill.on { border-color: var(--blue-border); background: var(--blue-light); color: var(--blue-dk); }
  .pill:active, .rp:active { border-bottom-width: 2px; translate: 0 2px; }
  .rp {
    flex-shrink: 0; width: 38px; height: 38px; border-radius: 12px; border: 2px solid var(--line); border-bottom-width: 4px;
    background: #fff; display: grid; place-items: center; color: var(--gray); padding: 0;
  }
  .rp svg { width: 18px; height: 18px; }
  .ph-kick { margin: 16px 0 0; font-size: 14px; font-weight: 800; color: var(--purple-dk); }
  .ph-h { font-size: 20px; font-weight: 800; line-height: 1.35; margin: 0; }
  .ph-h b { color: var(--blue); }
  .stage { position: relative; flex: 1; min-height: 0; margin-top: 12px; }
  .ph-foot { padding-top: 8px; }
  .tip { min-height: 46px; margin: 0 0 8px; text-align: center; font-weight: 700; font-size: 15px; color: var(--gray); line-height: 1.5; display: flex; align-items: center; justify-content: center; }
  .tip b { color: var(--ink); }
  .gobtn {
    display: block; width: 100%; height: 46px; border: 0; border-radius: 14px; margin-bottom: 5px;
    font: 800 16px var(--font); color: #fff; background: var(--green); box-shadow: 0 5px 0 var(--green-lip);
  }
  .gobtn:disabled { background: var(--line); box-shadow: 0 5px 0 #CFCFCF; color: #AFAFAF; }
  .cap { margin: 14px 6px 0; }
  .cap p { margin: 0; font-weight: 700; font-size: 15px; line-height: 1.55; }
  .cap .en { direction: ltr; text-align: left; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-weight: 500; font-size: 13px; color: var(--gray); margin-top: 6px; line-height: 1.5; }
  button { -webkit-tap-highlight-color: transparent; }

  /* ---- shared pieces: a term's colour, a chip, a tile ---- */
  .k-blue   { --c: #1CB0F6; --cd: #1899D6; --cl: #DDF4FF; --cb: #84D8FF; --ct: #1899D6; }
  .k-purple { --c: #CE82FF; --cd: #A568CC; --cl: #F6E8FF; --cb: #E3B6FF; --ct: #A568CC; }
  .k-orange { --c: #FF9600; --cd: #E07800; --cl: #FFEFD6; --cb: #FFC778; --ct: #E07800; }
  .k-green  { --c: #58CC02; --cd: #58A700; --cl: #D7FFB8; --cb: #A5ED6E; --ct: #58A700; }
  .k-red    { --c: #FF4B4B; --cd: #EA2B2B; --cl: #FFDFE0; --cb: #FFB2B2; --ct: #EA2B2B; }
  .chip {
    display: inline-flex; align-items: center; justify-content: center; padding: .16em .6em .06em;
    border-radius: .7em; background: var(--c); box-shadow: 0 .19em 0 var(--cd); color: #fff;
    font-weight: 800; font-size: 1em; line-height: 1.5; white-space: nowrap;
  }
  .tl {
    display: inline-grid; place-items: center; box-sizing: border-box; min-width: 46px; height: 46px; padding: 0 8px 2px;
    border-radius: 12px; background: #fff; border: 2px solid var(--line); border-bottom-width: 4px;
    font: 800 21px/1 var(--font); color: var(--ink); white-space: nowrap;
  }
  button.tl { cursor: pointer; }
  .tl.paint { background: var(--cl); border-color: var(--cb); color: var(--ct); }
  .tl.solid { background: var(--c); border-color: var(--cd); color: #fff; }
  .rrow { display: flex; align-items: flex-start; justify-content: center; gap: .32em; white-space: nowrap; font-size: 17px; }
  .rrow .op { font-size: 1.12em; font-weight: 800; color: var(--gray); padding-top: .12em; line-height: 1.4; }
  .term { display: inline-flex; flex-direction: column; align-items: center; gap: .22em; }
  .term small { font-size: .8em; font-weight: 800; color: var(--ct); line-height: 1.2; }

  /* ---- A: squash it ---- */
  .a-src { display: flex; flex-direction: column; align-items: center; gap: 8px; min-height: 104px; justify-content: center; }
  .a-row { display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: nowrap; }
  .a-plus { font-size: 20px; font-weight: 800; color: #AFAFAF; transition: opacity .25s; }
  .a-plus.gone { opacity: 0; }
  .tl.gone { background: transparent; border-style: dashed; border-bottom-width: 2px; color: #D0D0D0; pointer-events: none; }
  .tl.dim { opacity: .45; pointer-events: none; }
  .tl.live { animation: aBob 1.4s ease-in-out infinite; border-color: var(--blue-border); }
  @keyframes aBob { 50% { translate: 0 -4px; } }
  .a-tray {
    position: relative; margin: 14px 0 0; min-height: 172px; border-radius: 22px; background: #F7F7F7;
    display: flex; align-items: center; justify-content: center; padding: 14px 8px;
  }
  .a-hint { position: absolute; top: 9px; inset-inline-start: 14px; font-size: 13px; font-weight: 800; color: #AFAFAF; }
  .a-eq { display: flex; align-items: center; gap: 8px; }
  .a-eq .op { font-size: 24px; font-weight: 800; color: #AFAFAF; }
  .a-pile { position: relative; display: inline-grid; }
  .a-pile .tl { position: relative; z-index: 2; min-width: 62px; height: 56px; font-size: 25px; }
  .a-sheet { position: absolute; inset: 0; border-radius: 12px; background: var(--cl); border: 2px solid var(--cb); border-bottom-width: 4px; opacity: 0; transition: opacity .2s, translate .25s; }
  .a-badge {
    position: absolute; z-index: 3; top: -14px; left: -16px; min-width: 30px; height: 26px; padding: 0 7px;
    border-radius: 13px; background: var(--purple); box-shadow: 0 3px 0 var(--purple-dk); color: #fff;
    font-size: 15px; font-weight: 800; display: grid; place-items: center; line-height: 1;
  }
  .a-pair { position: absolute; top: 12px; left: 0; right: 0; text-align: center; font-size: 15px; font-weight: 800; color: var(--purple-dk); opacity: 0; }
  .a-grid { display: grid; grid-template-columns: repeat(5, 24px); grid-template-rows: repeat(5, 24px); gap: 4px; position: relative; }
  .a-cell { border-radius: 7px; border: 2px dashed #DADADA; }
  .a-cell.on { border: 0; background: var(--c); box-shadow: inset 0 -4px 0 var(--cd); }
  .a-sq { display: flex; align-items: center; gap: 22px; }
  .a-sqcap { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 92px; }
  .a-sqcap b { font-size: 40px; font-weight: 800; line-height: 1.1; color: var(--orange-dk); }
  .a-sqcap span { font-size: 20px; font-weight: 800; color: var(--blue-dk); min-height: 30px; }
  .a-side { position: absolute; font-size: 16px; font-weight: 800; color: var(--blue-dk); }
  .rc { margin-top: 14px; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 20px; padding: 10px 10px 12px; }
  .rc-h { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 800; color: var(--gray); margin-bottom: 8px; }
  .rc-h svg { width: 18px; height: 18px; }
  .rc-pre { text-align: center; font-size: 14px; font-weight: 800; color: var(--gray); margin: -2px 0 6px; }
  .rc-x { text-align: center; font-size: 14px; font-weight: 700; color: var(--gray); margin-top: 8px; }
  .rc-x b { color: var(--ink); }

  /* ---- B: the machine ---- */
  .b-cards { display: flex; gap: 8px; }
  .b-card {
    flex: 1; min-width: 0; background: #fff; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 14px;
    padding: 7px 4px 5px; font: 800 14px/1.35 var(--font); color: var(--ink); touch-action: none; cursor: grab;
    display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; z-index: 2;
  }
  .b-card small { display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; color: var(--gray); font-weight: 700; }
  .b-card small svg { width: 11px; height: 11px; }
  .b-card.lock { background: #F7F7F7; color: #AFAFAF; cursor: default; }
  .b-card.used { opacity: .35; border-style: dashed; border-bottom-width: 2px; pointer-events: none; }
  .b-card.drag { z-index: 20; scale: 1.06; cursor: grabbing; }
  .b-mc { display: flex; flex-direction: column; align-items: center; margin-top: 16px; }
  .b-mouth { width: 140px; height: 22px; border-radius: 12px 12px 4px 4px; background: var(--purple-dk); position: relative; z-index: 1; margin-bottom: -6px; display: grid; place-items: center; transition: scale .18s; }
  .b-mouth i { width: 104px; height: 9px; border-radius: 6px; background: #6B3F8C; }
  .b-mouth.open { scale: 1.14 1.3; }
  .b-body { position: relative; width: 100%; box-sizing: border-box; background: var(--purple); border-radius: 26px; box-shadow: 0 8px 0 var(--purple-dk); padding: 12px 10px 14px; }
  .b-face { display: flex; justify-content: center; gap: 36px; margin-bottom: 9px; }
  .b-eye { width: 26px; height: 26px; border-radius: 50%; background: #fff; display: grid; place-items: center; }
  .b-eye i { width: 12px; height: 12px; border-radius: 50%; background: var(--ink); }
  .b-lights { position: absolute; top: 18px; inset-inline-start: 18px; display: flex; gap: 5px; }
  .b-lights i { width: 10px; height: 10px; border-radius: 50%; background: #B672E3; }
  .b-lights i.on { background: var(--gold); }
  .b-plate { background: #fff; border-radius: 16px; box-shadow: inset 0 -4px 0 #EBD7FA; padding: 8px 6px 12px; text-align: center; }
  .b-ph { font-size: 13px; font-weight: 800; color: var(--purple-dk); margin-bottom: 7px; }
  .b-plate .rrow { align-items: center; }
  .b-slot {
    display: inline-flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box;
    min-width: 2.5em; height: 2.6em; padding: 0 .45em; border-radius: .7em; background: #F2F2F2; border: 2px dashed #CFCFCF;
    color: #AFAFAF; font-weight: 800; line-height: 1.1;
  }
  .b-slot b { font-size: 1.15em; }
  .b-slot.val { background: var(--cl); border: 2px solid var(--cb); border-bottom-width: 4px; color: var(--ct); }
  .b-slot.ask { border-color: var(--gold); color: var(--gold-dk); background: var(--gold-bg); }
  .b-slot.name { background: var(--c); border: 0; box-shadow: 0 4px 0 var(--cd); color: #fff; height: auto; padding: .25em .6em .2em; }
  .b-slot.name b { font-size: .95em; }
  .b-slot.name small { font-size: .72em; opacity: .9; }
  .b-chute { width: 92px; height: 14px; margin: 12px auto 0; border-radius: 8px; background: #6B3F8C; }
  .b-out { height: 66px; display: grid; place-items: center; margin-top: 14px; }
  .b-res { min-width: 70px; height: 54px; font-size: 26px; visibility: hidden; }
  .b-res.on { visibility: visible; }
  .b-guess { display: flex; justify-content: center; gap: 10px; min-height: 52px; }
  .b-guess .tl.off { opacity: .35; pointer-events: none; }

  /* ---- C: drag to shorten ---- */
  .c-ops { display: flex; align-items: center; justify-content: center; gap: 10px; height: 46px; }
  .c-ops span { font-size: 14px; font-weight: 800; color: var(--gray); }
  .c-ops b { min-width: 46px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 25px; font-weight: 800; background: var(--red-bg); color: var(--red-dk2); transition: background-color .3s, color .3s; }
  .c-ops.short b { background: var(--green-bg); color: var(--green-dk); }
  .c-way { min-width: 104px; text-align: start; }
  .c-morph { position: relative; height: 252px; margin-top: 4px; }
  .mi { position: absolute; left: 0; top: 0; translate: -50% -50%; will-change: transform, opacity; }
  .mi.tl { padding: 0; }
  .mop { font-size: 22px; font-weight: 800; color: #AFAFAF; }
  .mcap { font-size: 18px; font-weight: 800; color: var(--ink); white-space: nowrap; }
  .mlab { font-size: 13px; font-weight: 800; color: #AFAFAF; }
  .dt { width: 16px; height: 16px; border-radius: 5px; background: var(--c); box-shadow: inset 0 -3px 0 var(--cd); }
  .c-sl { position: relative; height: 60px; border-radius: 30px; background: #F0F0F0; box-shadow: inset 0 3px 0 #E2E2E2; margin-top: 6px; touch-action: none; }
  .c-fill { position: absolute; top: 0; bottom: 0; right: 0; width: 60px; border-radius: 30px; background: var(--green-bg); }
  .c-lab { position: absolute; inset: 0; display: grid; place-items: center; padding-inline-start: 40px; font-size: 15px; font-weight: 800; color: #AFAFAF; pointer-events: none; }
  .c-knob {
    position: absolute; top: 4px; right: 4px; width: 52px; height: 48px; border: 0; border-radius: 24px; padding: 0;
    background: var(--green); box-shadow: 0 4px 0 var(--green-lip); color: #fff; display: grid; place-items: center; cursor: grab; touch-action: none;
  }
  .c-knob svg { width: 24px; height: 24px; }
  .c-knob.hold { cursor: grabbing; scale: 1.06; }
  .c-rule { min-height: 92px; }
  .c-tk { margin-top: 10px; border-radius: 20px; background: var(--green-bg); box-shadow: inset 0 -4px 0 #B9EE90; padding: 9px 8px 12px; }
  .c-tk .rc-h { color: var(--green-dk); margin-bottom: 7px; justify-content: center; }
  .c-tk .rc-pre { color: var(--green-dk); }

  /* ---- D: where is it in the example? ---- */
  .d-ex { border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 20px; padding: 12px 8px 14px; display: flex; flex-direction: column; gap: 10px; }
  .d-exh { font-size: 13px; font-weight: 800; color: #AFAFAF; text-align: center; }
  .d-ln { display: flex; flex-wrap: nowrap; justify-content: center; align-items: center; gap: .2em; font-size: 18px; white-space: nowrap; }
  .d-ln.big { font-size: 23px; }
  .d-ln.sm { font-size: 15px; }
  .d-tk {
    border: 2px solid transparent; border-bottom-width: 4px; background: transparent; border-radius: 11px; padding: 0 .25em 1px;
    font: 800 1em/1.5 var(--font); color: var(--ink); cursor: pointer; white-space: nowrap;
  }
  .d-ln.sm .d-tk { color: var(--gray); }
  .d-tk.paint { background: var(--cl); border-color: var(--cb); color: var(--ct); }
  .d-tk.no { background: var(--red-bg); color: var(--red-dk2); }
  .d-rule { margin-top: 18px; }
  .d-rule .rrow { align-items: center; gap: .4em; }
  .d-card {
    position: relative; min-width: 3em; min-height: 2.5em; padding: .2em .6em .1em; border-radius: .75em; box-sizing: border-box;
    border: 2px solid var(--line); border-bottom-width: 5px; background: #F7F7F7; color: #AFAFAF;
    font: 800 1em/1.4 var(--font); display: inline-flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;
  }
  .d-card .d-q { font-size: 1.3em; }
  .d-card.up { background: #fff; border-color: var(--cb); color: var(--ct); }
  .d-card.up.act { translate: 0 -5px; border-color: var(--c); }
  .d-card.found { background: var(--c); border-color: var(--cd); color: #fff; }
  .d-card small { font-size: .75em; opacity: .92; line-height: 1.2; }

  /* ---- E: play with it ---- */
  .e-goal {
    display: flex; align-items: center; gap: 8px; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 16px;
    padding: 6px 12px 5px; font-size: 15px; font-weight: 800; color: var(--gray); transition: background-color .3s, border-color .3s, color .3s;
  }
  .e-goal svg { width: 22px; height: 22px; flex-shrink: 0; }
  .e-goal b { color: var(--orange-dk); font-size: 18px; }
  .e-goal.won { background: var(--green-bg); border-color: var(--green-pale); color: var(--green-dk); }
  .e-goal.won b { color: var(--green-dk); }
  .e-res { display: flex; align-items: baseline; justify-content: center; gap: 10px; margin-top: 8px; }
  .e-res span { font-size: 15px; font-weight: 800; color: var(--gray); }
  .e-res b { font-size: 38px; font-weight: 800; color: var(--orange-dk); line-height: 1.1; min-width: 64px; text-align: center; }
  .e-pic { position: relative; height: 128px; display: flex; align-items: flex-end; justify-content: center; gap: 5px; }
  .e-tw { width: 28px; border-radius: 9px 9px 6px 6px; background: var(--blue); box-shadow: inset 0 -4px 0 var(--blue-dk); display: flex; justify-content: center; transition: height .35s cubic-bezier(.3,1.4,.5,1); }
  .e-tw span { color: #fff; font-size: 12.5px; font-weight: 800; padding-top: 3px; }
  .e-pic svg { overflow: visible; }
  .e-long { text-align: center; font-size: 14px; font-weight: 700; color: var(--gray); min-height: 22px; margin-top: 6px; white-space: nowrap; overflow: hidden; }
  .e-rule { margin-top: 8px; }
  .e-st { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .e-s { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .e-s .chip { font-size: 15px; }
  .e-ctl { display: flex; align-items: center; gap: 8px; }
  .e-b {
    width: 44px; height: 40px; border-radius: 12px; border: 2px solid var(--line); border-bottom-width: 4px; background: #fff;
    font: 800 24px/1 var(--font); color: var(--blue); padding: 0 0 3px; touch-action: manipulation;
  }
  .e-b:active { border-bottom-width: 2px; translate: 0 2px; }
  .e-v { min-width: 44px; text-align: center; font-size: 24px; font-weight: 800; color: var(--ink); }

  /* ---- F: teach your friend ---- */
  .f-chat {
    position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden;
    border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 22px; background: var(--surface-hover);
  }
  .f-hd { display: flex; align-items: center; gap: 9px; padding: 7px 12px; background: var(--snow); border-bottom: 2px solid var(--line); }
  .f-av { width: 34px; height: 34px; flex-shrink: 0; border-radius: 50%; background: var(--purple); box-shadow: inset 0 -3px 0 var(--purple-dk); color: var(--snow); display: grid; place-items: center; font-size: 17px; font-weight: 800; }
  .f-nm { display: flex; flex-direction: column; line-height: 1.25; }
  .f-nm b { font-size: 15.5px; }
  .f-nm small { font-size: 12px; font-weight: 800; color: var(--green-dk); }
  .f-msgs { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 10px 10px 8px; display: flex; flex-direction: column; gap: 7px; scrollbar-width: none; }
  .f-msgs::-webkit-scrollbar { display: none; }
  .f-b { max-width: 84%; box-sizing: border-box; padding: 5px 11px 4px; border-radius: 16px; font-size: 15px; font-weight: 700; line-height: 1.55; color: var(--ink); flex-shrink: 0; }
  .f-b b { color: var(--blue-dk); }
  .f-b.them { align-self: flex-start; background: var(--snow); border: 2px solid var(--line); border-bottom-width: 4px; border-start-start-radius: 5px; }
  .f-b.me { align-self: flex-end; background: var(--blue-light); border: 2px solid var(--blue-border); border-bottom-width: 4px; border-start-end-radius: 5px; color: var(--blue-dk); font-size: 17px; font-weight: 800; }
  .f-b.wide { width: 94%; max-width: 94%; padding: 8px 6px 6px; }
  .f-b.wide .rrow { font-size: 15px; }
  .f-b.wide .rc-pre { margin: 0 0 4px; font-size: 12.5px; }
  .f-tk { display: inline-flex; vertical-align: -1px; margin-inline-start: 7px; color: var(--gray-icon); transition: color .3s; }
  .f-tk svg { width: 17px; height: 11px; }
  .f-tk.read { color: var(--blue); }

    function weigh(btn) {

      const L = lv();
      tilt(angle(L, D.R));
      const tagFor = base.btn.parentElement.querySelector('.g-tag');
      if (L === D.R) { busy = true; c.t(level, 700); return; }
      const heavy = L > D.R;
      tagFor.textContent = (half ? '÷٢: ' : '') + (heavy ? 'أثقل' : 'أخف');
      tagFor.className = 'g-tag ' + (heavy ? 'hv' : 'lt');
      popIn(tagFor);
      if (D.mod && !half && heavy && !modShown) {
        modShown = true;
        const m = $('.g-mod', tray).parentElement; m.style.display = ''; popIn(m); c.t(() => hop($('.g-mod', tray), 12), 420);
        c.tip(L === 2 * D.R ? 'أثقل — وبالضبط <b>الضعف</b>! البالونة تشيل نصّه' : 'أثقل بكثير — البالونة <b>÷ ٢</b> تشيل نصّه');
        return;
      }
      if (ri === 0 && tries >= 3 && D.hint) { c.tip(D.hint); return; }
      c.tip(heavy ? 'أثقل — كفّتك نزلت. تحتاج شي <b>أخف</b>' : 'أخف — كفّتك طارت فوق. تحتاج شي <b>أثقل</b>');
    }
    function level() {
      const card = $('.g-card', lLoad);
      card.classList.add('ok');
      rVal.textContent = ar(D.R); lVal.textContent = ar(D.R);
      [rVal, lVal].forEach((v, j) => popIn(v, j * 120));
      hop(card, 14); hop($('.g-pile', rLoad), 10, 90);
      note(5); c.t(() => note(7), 110); buzz([15, 30, 15]);
      dots[ri].classList.remove('on'); dots[ri].classList.add('ok');
      c.tip((ri === 1 && tries === 1 ? 'من أول محاولة! ' : '') + D.won);
      if (ri === 0) c.t(() => round(1), 2100);
      else c.t(finish, 1700);
    }
    function finish() {
      anim(tray, [{ opacity: 1 }, { opacity: 0 }], { duration: 200, fill: 'forwards' });
      c.t(() => {
        tray.remove();
        c.tip('القاعدة ميزان: اللي قبل «=» يوزن اللي بعدها');
        const src = {};
        Object.keys(R.col).forEach(k => { src[k] = k === 's' ? $('.g-pile', rLoad) : $('.g-card', lLoad); });
        const ms = aRule(c, $('.g-rule', S), src, G.x);
        c.t(() => c.done(), ms);
      }, 220);
    }
    round(0);
  }

  /* ---------------- the shell ---------------- */
  const VERS = [
    { id: 'A', name: 'اعصرها بإيدك', mount: mountA,
      ar: 'الطالب يضغط الأرقام بنفسه فتنضم لبعض — والقاعدة تتركّب من اللي سوّاه.',
      en: 'Squash the long sum with your own taps: repeats stack into a pile, partners pair up to eleven, odd numbers wrap into a square. Then each word of the rule flies out of the thing the student just built.' },
    { id: 'B', name: 'آلة القاعدة', mount: mountB,
      ar: 'آلة تاكل الأمثلة وتطلع الجواب — بعد تجربتين يخمّن الطالب وش بتطلع، وبعدها ينكشف المكتوب عليها.',
      en: 'A friendly machine: drag two examples into its mouth and watch the plate fill with their numbers. On the third the machine stops and the student predicts the output; only then does the plate flip to the rule in words.' },
    { id: 'C', name: 'اسحب واختصر', mount: mountC,
      ar: 'يسحب الطالب الزر فتنطوي الطريقة الطويلة قدّام عينه إلى الحيلة، وعدّاد العمليات ينزل.',
      en: 'A slider under the thumb: the long way morphs into the shortcut as they drag (tiles stack, the row folds in half into pairs, a pyramid of dots becomes a square) while the operation counter falls. Let go early and it rewinds.' },
    { id: 'D', name: 'وين هي في المثال؟', mount: mountD,
      ar: 'القاعدة بطاقات مقلوبة — يقلب الطالب بطاقة ويلقى كلمتها في المثال، فتتلوّن الكلمة ومكانها بنفس اللون.',
      en: 'The rule as face-down cards: flip one, then tap where that word lives in the worked example. A right tap paints the card and every matching place in the example the same colour, so the rule ends colour-coded to the example. A wrong tap only shakes.' },
    { id: 'E', name: 'العب فيها', mount: mountE,
      ar: 'لعبة صغيرة: يغيّر الطالب الأرقام فتتغيّر الرسمة والقاعدة معه — وتحدّي يوصّله لرقم معيّن.',
      en: 'A toy: plus and minus change the numbers; a picture proof (towers, a staircase that is half a rectangle, a growing square), the long sum and the live rule all update with rolling numbers, and a small target makes them use the rule to hit it.' },
    { id: 'F', name: 'علّم خويك', mount: mountF,
      ar: 'خويك سعود يسألك في الشات — ترسل له الطريقة الأسرع بالأرقام، وبعدين تكتبها له بالكلام عشان يحفظها، ويختبرك على أرقام جديدة.',
      en: 'A chat with a friend who is stuck on the long sum: the student sends him a shortcut built from number tiles (he tries it and says if it works), then rewrites the same message in words so it works for any numbers, and answers his follow-up with new numbers. The rule ends up as a message the student wrote, and explaining to someone else is what makes it stick.' },
    { id: 'G', name: 'وازن الميزان', mount: mountG,
      ar: 'الجمع الطويل في كفة، والطالب يحط في كفّته الثانية لين يتوازن الميزان — يميل ويهتز مع كل محاولة، والقاعدة هي «=» الميزان.',
      en: 'A balance scale: the long sum sits as a pile of weights on one pan, and the student loads the other with a shortcut card. The beam springs and wobbles to say lighter or heavier (for the 1-to-n rule a ÷2 balloon lifts the double), until it levels; a second round must level on the first try, and then the words of the rule fly out of the two pans.' }
  ];
  const grid = $('#grid');
  grid.innerHTML = VERS.map(v => `<section class="ver" id="v${v.id}">
      <div class="ver-h"><b>${v.id}</b><span>${v.name}</span></div>
      <div class="phone">
        <div class="ph-top"><div class="pills">${Object.keys(RULES).map(k => `<button class="pill" data-rk="${k}">${RULES[k].tab}</button>`).join('')}</div>
          <button class="rp" aria-label="من جديد">${SVG.replay}</button></div>
        <div class="ph-kick"></div><h2 class="ph-h"></h2>
        <div class="stage"></div>
        <div class="ph-foot"><p class="tip"></p><button class="gobtn" disabled>متابعة</button></div>
      </div>
      <div class="cap"><p>${v.ar}</p><p class="en">${v.en}</p></div>
    </section>`).join('');

  VERS.forEach(v => {
    const root = $('#v' + v.id), stage = $('.stage', root), tipEl = $('.tip', root), go = $('.gobtn', root);
    let rk = 'rep', gen = 0, timers = [];
    function start() {
      const my = ++gen;
      timers.forEach(clearTimeout); timers = [];
      if (stage.getAnimations) stage.getAnimations({ subtree: true }).forEach(a => a.cancel());
      stage.innerHTML = '';
      $$('.pill', root).forEach(p => p.classList.toggle('on', p.dataset.rk === rk));
      const R = RULES[rk];
      $('.ph-kick', root).textContent = R.kick;
      $('.ph-h', root).innerHTML = R.h;
      go.disabled = true;
      const c = {
        rk, R, stage,
        alive: () => my === gen,
        tip: html => { tipEl.innerHTML = `<span>${html}</span>`; anim(tipEl, [{ opacity: 0, translate: '0 6px' }, { opacity: 1, translate: '0 0' }], { duration: 220 }); },
        t: (fn, ms) => { timers.push(setTimeout(() => { if (my === gen) fn(); }, RM ? ms * .15 : ms)); },
        done: () => { if (my !== gen) return; go.disabled = false; hop(go, 10); win(); buzz([20, 40, 30]); }
      };
      v.mount(c);
    }
    root.addEventListener('click', e => {
      const p = e.target.closest('.pill');
      if (p) { rk = p.dataset.rk; tap(); start(); return; }
      const r = e.target.closest('.rp');
      if (r) { tap(); anim($('svg', r), [{ rotate: '0deg' }, { rotate: '-360deg' }], { duration: 500, easing: 'cubic-bezier(.3,1.4,.5,1)' }); start(); return; }
      if (e.target.closest('.gobtn') && !go.disabled) { tap(); hop(go, 8); }
    });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(start); else start();
  });
})();
</script>
</body>
</html>
