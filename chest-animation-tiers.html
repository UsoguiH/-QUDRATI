<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فتح الصندوق — استنساخ حركة Duolingo</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Standalone clone of the Duolingo monthly-challenge chest opening,
   rebuilt frame-by-frame from "chest animation.mp4" (480×1044).
   Every coordinate below is in that reference frame; #stage is
   scaled uniformly to fit whatever viewport opens it.
   ============================================================ */
:root {
  --snow: #FCFCFC; --macaw: #1CB0F6; --macaw-dk: #1899D6; --sky: #54C4FC;
  --eel: #4B4B4B; --line: #E5E5E5;
  --wood: #C87800; --wood-dk: #B46800; --peach: #FCCCA4; --peach-dk: #ECB080; --latch: #FFEBDE;
  --tan: #ECC898; --plate: #E4E4E4;
  --bee: #FCC400; --bee-hi: #F8E46C; --bee-dk: #E6A800; --lid: #209CEC; --lid-dk: #1B8FE0; --lid-hi: #3AB0F4;
  --plate-blue: #48B0F0; --used-blue: #2494E4;
  --spark: #F8EC98; --comet: #F8E46C;
  --font: 'Baloo Bhaijaan 2', 'Segoe UI', Tahoma, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  background: var(--snow); font-family: var(--font); color: var(--eel);
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
  transition: background .32s ease;
}
body[data-bg="rare"] { background: #54C4FC; }
body[data-bg="epic"] { background: #9B5DE5; }
body[data-bg="legendary"] { background: #FF8C3A; }
#viewport { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
#stage { position: relative; width: 480px; height: 1044px; overflow: hidden; flex-shrink: 0; transform-origin: 50% 50%; }

/* ---- screens: Android-style push, new one slides in from the right ---- */
.scr { position: absolute; inset: 0; background: var(--snow); transform: translateX(100%); visibility: hidden; }
.scr.on { transform: none; visibility: visible; }
.scr.push-in  { visibility: visible; z-index: 3; animation: pushIn  .36s cubic-bezier(.2,.7,.2,1) both; box-shadow: -24px 0 48px rgba(0,0,0,.14); }
.scr.push-out { visibility: visible; z-index: 2; animation: pushOut .36s cubic-bezier(.2,.7,.2,1) both; }
@keyframes pushIn  { from { transform: translateX(100%); } to { transform: none; } }
@keyframes pushOut { from { transform: none; filter: brightness(1); } to { transform: translateX(-30%) scale(.96); filter: brightness(.84); } }

/* entrance choreography: when a screen arrives its pieces pop in one after another */
@keyframes popIn  { 0% { opacity: 0; transform: translateY(18px) scale(.86); } 60% { opacity: 1; transform: translateY(-3px) scale(1.04); } 100% { opacity: 1; transform: none; } }
@keyframes riseIn { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }

/* the glossy sheen that slides over Duolingo's call-to-action buttons */
.btn.cta { overflow: hidden; }
.btn.cta::after { content: ""; position: absolute; top: -10px; bottom: -10px; width: 64px; left: -90px; background: linear-gradient(100deg, rgba(255,255,255,0), rgba(255,255,255,.38), rgba(255,255,255,0)); transform: skewX(-18deg); animation: sheen 3.4s ease-in-out 1.4s infinite; pointer-events: none; }
@keyframes sheen { 0% { left: -90px; } 32%, 100% { left: 110%; } }

h1, h2, h3, p { margin: 0; }
button { font-family: var(--font); cursor: pointer; border: 0; background: none; padding: 0; color: inherit; }

/* Duolingo's 3D button: face + 4px lip */
.btn {
  display: block; width: 440px; height: 56px; margin: 0 auto; border-radius: 16px;
  background: var(--macaw); color: #fff; font-size: 17px; font-weight: 700;
  box-shadow: 0 4px 0 var(--macaw-dk); transition: transform .06s, box-shadow .06s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--macaw-dk); }

/* ============================================================
   Start screen — the monthly-challenge card the video begins on
   ============================================================ */
#s-start .qtitle { position: absolute; top: 178px; left: 0; right: 0; text-align: center; font-size: 26px; font-weight: 800; color: var(--macaw); }
.card { position: absolute; left: 20px; right: 20px; border: 2px solid var(--line); border-radius: 16px; background: #fff; }
#s-start .quests { top: 268px; }
.qrow { display: flex; align-items: center; gap: 14px; padding: 18px 16px; border-bottom: 2px solid var(--line); }
.qrow:last-child { border-bottom: 0; }
.qrow svg { width: 56px; height: 52px; flex-shrink: 0; overflow: visible; }
.qrow .qtxt { flex: 1; }
.qrow b { display: block; font-size: 16px; font-weight: 700; margin-bottom: 8px; }
.bar { position: relative; height: 18px; border-radius: 9px; background: var(--line); overflow: hidden; }
.bar i { position: absolute; top: 0; bottom: 0; right: 0; border-radius: 9px; background: var(--macaw); overflow: hidden; }
.bar i::after { content: ""; position: absolute; top: 4px; left: 8px; right: 8px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.35); }
.bar span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; }
.bar.low span { color: #AFAFAF; }
#s-start .month { top: 680px; height: 128px; display: flex; align-items: center; gap: 16px; padding: 0 16px; }
.avatar { width: 84px; height: 84px; border-radius: 50%; border: 3px solid var(--macaw); background: #DDF4FF; display: flex; align-items: center; justify-content: center; }
.avatar svg { width: 46px; height: 46px; }
.month b { display: block; font-size: 17px; margin-bottom: 4px; }
.month span { color: var(--macaw); font-weight: 700; font-size: 15px; }
#s-start .btn { position: absolute; bottom: 84px; left: 20px; }

/* arrival: title pops, rows rise in turn, each chest lands with a squash, bars fill and shine, button pops */
#s-start.enter .qtitle { animation: popIn .55s cubic-bezier(.3,1.5,.5,1) .12s both; }
#s-start.enter .quests { animation: riseIn .4s cubic-bezier(.2,.8,.3,1) .18s both; }
#s-start.enter .qrow { animation: riseIn .4s cubic-bezier(.2,.8,.3,1) both; }
#s-start.enter .qrow:nth-child(1) { animation-delay: .26s; }
#s-start.enter .qrow:nth-child(2) { animation-delay: .34s; }
#s-start.enter .qrow:nth-child(3) { animation-delay: .42s; }
#s-start.enter .qrow svg { animation: chestLand .55s cubic-bezier(.3,1.6,.5,1) both; }
#s-start.enter .qrow:nth-child(1) svg { animation-delay: .38s; }
#s-start.enter .qrow:nth-child(2) svg { animation-delay: .46s; }
#s-start.enter .qrow:nth-child(3) svg { animation-delay: .54s; }
@keyframes chestLand { 0% { transform: scale(.3) translateY(8px); } 55% { transform: scale(1.14, .88) translateY(3px); } 80% { transform: scale(.96, 1.06); } 100% { transform: none; } }
#s-start.enter .bar i { animation: barFill .7s cubic-bezier(.2,.8,.2,1) both; }
#s-start.enter .qrow:nth-child(1) .bar i { animation-delay: .5s; }
#s-start.enter .qrow:nth-child(2) .bar i { animation-delay: .58s; }
#s-start.enter .qrow:nth-child(3) .bar i { animation-delay: .66s; }
@keyframes barFill { from { width: 0; } }
.bar i::before { content: ""; position: absolute; top: 0; bottom: 0; width: 44px; left: -60px; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.6), rgba(255,255,255,0)); }
#s-start.enter .bar i::before { animation: barShine .55s ease-out 1.2s both; }
@keyframes barShine { from { left: -60px; } to { left: 100%; } }
#s-start.enter .month { animation: riseIn .4s cubic-bezier(.2,.8,.3,1) .5s both; }
#s-start.enter .btn { animation: popIn .5s cubic-bezier(.3,1.5,.5,1) .62s both; }
/* finished quests keep their chest alive: a quick eager wiggle every few seconds */
#s-start:not(.enter) .qrow.ready svg { animation: chestWig 4.2s ease-in-out var(--w, 0s) infinite; transform-origin: 50% 90%; }
@keyframes chestWig { 0%, 84%, 100% { transform: none; } 87% { transform: rotate(-7deg) scale(1.06); } 90% { transform: rotate(6deg) scale(1.06); } 93% { transform: rotate(-4deg) scale(1.03); } 96% { transform: rotate(2deg); } }

/* ============================================================
   Chest screen
   ============================================================ */
/* one rule set, four tiers: every tier only changes these properties */
#s-chest {
  cursor: pointer; background: var(--bg);
  --bg: var(--snow); --plate-c: #E4E4E4; --ttl-c: #C87800; --cap-c: #4B4B4B;
  --dot-c: #ECC898; --dot-live: #C87800; --dot-arrow: #fff; --dot-sh: #E4E4E1; --dot-glint: rgba(255,255,255,.45);
  --ground: rgba(0,0,0,.075); --flash: 255,226,110; --cone: 255,240,190; --cone-a1: .5; --cone-a2: .22; --fs: 440px; --kick: 1.025;
}
#s-chest.t-rare      { --bg: #54C4FC; --plate-c: #48B0F0; --ttl-c: #fff; --cap-c: #fff; --dot-c: #2494E4; --dot-live: #fff; --dot-arrow: #1CB0F6; --dot-sh: #3EAFF0; --dot-glint: rgba(28,176,246,.22); --ground: rgba(0,40,90,.16); --flash: 255,255,255; --cone: 255,255,255; --cone-a1: .92; --cone-a2: .4; }
#s-chest.t-epic      { --bg: #9B5DE5; --plate-c: #7F45C9; --ttl-c: #fff; --cap-c: #fff; --dot-c: #7A3FC4; --dot-live: #fff; --dot-arrow: #9B5DE5; --dot-sh: #8447D0; --dot-glint: rgba(155,93,229,.22); --ground: rgba(40,0,90,.22); --flash: 255,255,255; --cone: 255,255,255; --cone-a1: .92; --cone-a2: .4; --fs: 500px; --kick: 1.032; }
#s-chest.t-legendary { --bg: #FF8C3A; --plate-c: #E07020; --ttl-c: #fff; --cap-c: #fff; --dot-c: #E07A20; --dot-live: #fff; --dot-arrow: #FF8C3A; --dot-sh: #E87F2C; --dot-glint: rgba(255,140,58,.22); --ground: rgba(120,40,0,.2); --flash: 255,255,255; --cone: 255,255,255; --cone-a1: .95; --cone-a2: .45; --fs: 560px; --kick: 1.04; }
.ttl {
  position: absolute; top: 222px; left: 0; right: 0; text-align: center;
  font-size: 26px; font-weight: 800; color: var(--ttl-c); line-height: 1.2;
  transition: opacity .22s ease;
}
.ttl.hide { opacity: 0; }
.ttl.bump { animation: ttlBump .4s cubic-bezier(.3,1.6,.5,1); }
@keyframes ttlBump { 0% { transform: scale(1); } 40% { transform: scale(1.14) rotate(-2deg); } 70% { transform: scale(.98) rotate(1deg); } 100% { transform: scale(1); } }
#s-chest.enter .ttl { animation: popIn .5s cubic-bezier(.3,1.5,.5,1) .6s both; }
#s-chest.enter .dot { animation: popIn .45s cubic-bezier(.3,1.6,.5,1) both; }
#s-chest.enter .dot:nth-child(1) { animation-delay: .7s; }
#s-chest.enter .dot:nth-child(2) { animation-delay: .78s; }
#s-chest.enter .dot:nth-child(3) { animation-delay: .86s; }
#s-chest.enter .cap { animation: riseIn .45s cubic-bezier(.2,.8,.3,1) .92s both; }
#s-chest.opened { animation: kick .4s cubic-bezier(.2,.8,.3,1); }
@keyframes kick { 0% { transform: none; } 30% { transform: scale(1.015); } 100% { transform: none; } }

/* every tap: a glow flashes behind the chest, the screen kicks, the sparkles flare */
.flash {
  position: absolute; left: 240px; top: 440px; width: var(--fs); height: var(--fs); margin: calc(var(--fs) / -2) 0 0 calc(var(--fs) / -2); border-radius: 50%;
  pointer-events: none; z-index: 0; opacity: 0;
  background: radial-gradient(closest-side, rgba(var(--flash),.88), rgba(var(--flash),.35) 45%, rgba(var(--flash),0) 100%);
}
.flash.go { animation: flashPop .5s cubic-bezier(.2,.8,.3,1) both; }
@keyframes flashPop { 0% { opacity: 0; transform: scale(.35); } 30% { opacity: 1; transform: scale(1.05); } 100% { opacity: 0; transform: scale(1.3); } }
#s-chest.tapkick { animation: tapKick .36s cubic-bezier(.2,.8,.3,1); }
@keyframes tapKick { 0% { transform: none; } 22% { transform: scale(var(--kick)) translateY(-6px); } 100% { transform: none; } }
.sparks { transform-origin: 240px 450px; }
.sparks.flare { animation: sparkFlare .5s cubic-bezier(.2,.8,.3,1); }
@keyframes sparkFlare { 0% { transform: scale(1); } 30% { transform: scale(1.16); } 100% { transform: scale(1); } }

/* contact shadow on the floor: shrinks and fades while the chest is in the air */
.ground { position: absolute; left: 240px; top: 566px; width: 250px; height: 26px; margin: -13px 0 0 -125px; border-radius: 50%; background: var(--ground); filter: blur(3px); z-index: 1; pointer-events: none; }
.t-rare .ground { top: 570px; }

/* the chest lives in a 260×290 box; its plate's bottom is the floor */
.chestwrap { position: absolute; left: 110px; top: 285px; width: 260px; height: 290px; z-index: 2; }
.body { position: absolute; inset: 0; transform-origin: 50% 98%; will-change: transform; z-index: 2; }
.plate { position: absolute; left: 15px; top: 235px; width: 232px; height: 46px; border-radius: 14px; background: var(--plate-c); }
.t-rare .plate { left: 12px; top: 222px; width: 236px; height: 63px; border-radius: 16px; }
.box { position: absolute; inset: 0; will-change: transform; }
.box svg { position: absolute; left: 0; top: 0; width: 260px; height: 290px; overflow: visible; }
/* the glossy sweep across the closed chest, clipped to its silhouette */
.box .shine { transform-box: fill-box; transform-origin: center; animation: chestShine 3.8s ease-in-out .9s infinite; }
@keyframes chestShine { 0% { transform: translateX(0) skewX(-22deg); } 24%, 100% { transform: translateX(420px) skewX(-22deg); } }
.box svg.open { display: none; }
.opened .box svg.closed { display: none; }
.opened .box svg.open { display: block; }

/* light pouring out of the open chest: a soft pool at the mouth + a cone */
.glow {
  position: absolute; left: 130px; top: 150px; width: 320px; height: 240px; transform: translate(-50%,-50%);
  background: radial-gradient(closest-side, rgba(255,255,255,.95), rgba(255,255,255,.55) 42%, rgba(255,255,255,0) 100%);
  opacity: 0; pointer-events: none; z-index: 3;
}
.cone {
  position: absolute; left: 130px; bottom: 130px; width: 380px; height: 560px; transform: translateX(-50%);
  clip-path: polygon(32% 100%, 68% 100%, 100% 0, 0 0);
  background: linear-gradient(to top, rgba(var(--cone),var(--cone-a1)), rgba(var(--cone),var(--cone-a2)) 40%, rgba(var(--cone),0) 100%);
  opacity: 0; pointer-events: none; z-index: 1;
}
.opened .glow { animation: glowIn .25s ease-out forwards; }
.opened .cone { animation: coneIn .3s ease-out forwards, conePulse 1.1s ease-in-out .3s infinite; }
@keyframes glowIn { to { opacity: 1; } }
@keyframes coneIn { to { opacity: 1; } }
@keyframes conePulse { 0%, 100% { opacity: 1; } 50% { opacity: .78; } }

/* idle sparkles ringing the chest (4-point stars + tiny dots) */
.sparks { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
.sp { position: absolute; width: var(--s); height: var(--s); margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2); opacity: 0; animation: twinkle var(--d) ease-in-out var(--o) infinite; }
.sp svg { display: block; width: 100%; height: 100%; }
.sp.dot { border-radius: 50%; background: #fff; }
@keyframes twinkle {
  0%, 100% { opacity: 0; transform: scale(.25) rotate(-12deg) translateY(4px); }
  45%      { opacity: 1; transform: scale(1) rotate(8deg) translateY(-2px); }
  70%      { opacity: .9; transform: scale(.92) rotate(14deg) translateY(-6px); }
}

/* burst stars and rising motes (spawned by JS into .fx) */
.fx { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
.burst { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; animation: burstPop .46s cubic-bezier(.2,.8,.3,1) var(--o) both; }
.burst svg { display: block; width: 100%; height: 100%; }
@keyframes burstPop {
  0%   { opacity: 0; transform: translate(0,0) scale(0) rotate(0); }
  35%  { opacity: 1; transform: translate(calc(var(--dx) * .7), calc(var(--dy) * .7)) scale(1.25) rotate(20deg); }
  100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.4) rotate(45deg); }
}
.mote { position: absolute; width: 10px; height: 26px; margin: -13px 0 0 -5px; animation: moteRise var(--d) cubic-bezier(.15,.7,.3,1) both; }
.mote svg { display: block; width: 100%; height: 100%; }
@keyframes moteRise {
  0%   { opacity: 0; transform: translateY(0) scale(.5); }
  12%  { opacity: 1; transform: translateY(calc(var(--dy) * .12)) scale(1); }
  75%  { opacity: .9; }
  100% { opacity: 0; transform: translateY(var(--dy)) scale(.55); }
}

/* the comet arc that orbits the chest on every tap */
.arc { position: absolute; left: 0; top: 0; width: 480px; height: 1044px; pointer-events: none; z-index: 5; }

/* three chances: pale discs with an arrow; the live one is dark and hovers over its shadow */
.dots { position: absolute; top: 676px; left: 0; right: 0; height: 70px; display: flex; justify-content: center; gap: 38px; transition: opacity .28s ease; }
.dots.hide { opacity: 0; }
.dot { position: relative; width: 44px; height: 44px; }
.dot i {
  position: absolute; inset: 0; border-radius: 50%; background: var(--dot-c);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
  transition: background .12s ease;
}
/* a glint slides over the live dot; a spent one stamps down with a squash */
.dot.active i::after { content: ""; position: absolute; top: -6px; bottom: -6px; width: 12px; left: -24px; background: rgba(255,255,255,.45); transform: skewX(-20deg); animation: dotGlint 2.4s ease-in-out .7s infinite; }
.dot.active i::after { background: var(--dot-glint); }
@keyframes dotGlint { 0% { left: -24px; } 28%, 100% { left: 60px; } }
.dot.used i { animation: dotStamp .34s cubic-bezier(.3,1.4,.5,1); }
@keyframes dotStamp { 0% { transform: translateY(-8px) scale(1.5); } 55% { transform: translateY(3px) scale(1.15, .8); } 100% { transform: none; } }
.dot i svg { width: 22px; height: 22px; }
.dot i svg path { stroke: #fff; }
.dot .sh { position: absolute; left: 9px; right: 9px; bottom: -14px; height: 8px; border-radius: 50%; background: var(--dot-sh); opacity: 0; transition: opacity .15s; }
.dot.active i { background: var(--dot-live); animation: dotBob 1.1s ease-in-out infinite; }
.dot.active i svg path { stroke: var(--dot-arrow); }
.dot.active .sh { opacity: 1; animation: dotShade 1.1s ease-in-out infinite; }
.dot.active.pop i { animation: dotPop .3s cubic-bezier(.3,1.9,.5,1), dotBob 1.1s ease-in-out .3s infinite; }
.dot.used i svg { display: none; }
@keyframes dotBob   { 0%, 100% { transform: translateY(-8px); } 50% { transform: translateY(-11px); } }
@keyframes dotShade { 0%, 100% { transform: scaleX(1); opacity: 1; } 50% { transform: scaleX(.85); opacity: .8; } }
@keyframes dotPop   { 0% { transform: translateY(-8px) scale(.4); } 100% { transform: translateY(-8px) scale(1); } }

.cap { position: absolute; top: 782px; left: 0; right: 0; height: 40px; text-align: center; font-size: 20px; font-weight: 700; color: var(--cap-c); }
.cap span { position: absolute; left: 0; right: 0; top: 0; transition: opacity .16s ease; }
.cap span.hide { opacity: 0; }
.cap span.pop { animation: capPop .42s cubic-bezier(.3,1.8,.5,1); }
.cap span.pop.cta { animation: capPop .42s cubic-bezier(.3,1.8,.5,1), capPulse 1.3s ease-in-out .42s infinite; }
@keyframes capPop   { 0% { transform: translateY(10px) scale(.5); } 100% { transform: none; } }
@keyframes capPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }

/* the white wash that sweeps down over the open chest */
.wash {
  position: absolute; left: 0; right: 0; top: 0; height: 1044px; pointer-events: none; z-index: 8;
  background: linear-gradient(to bottom, #fff 0%, #fff 62%, rgba(255,255,255,0) 100%);
  transform: translateY(-110%);
}
.wash.go { transition: transform .45s linear; transform: translateY(0); }

/* ============================================================
   Reward screen — the pile of gems
   ============================================================ */
#s-reward { background: var(--snow); }
.counter { position: absolute; top: 82px; left: 22px; display: flex; align-items: center; gap: 6px; direction: rtl; font-size: 16px; font-weight: 800; color: var(--macaw); }
.counter svg { width: 20px; height: 22px; }
.rtitle { position: absolute; top: 246px; left: 0; right: 0; text-align: center; font-size: 26px; font-weight: 800; color: var(--macaw); opacity: 0; }
#s-reward.told .rtitle { opacity: 1; animation: popIn .55s cubic-bezier(.3,1.6,.5,1) both; }
/* the counter bumps as each flying gem lands in it */
.counter.bump { animation: counterBump .38s cubic-bezier(.3,1.6,.5,1); transform-origin: 80% 50%; }
@keyframes counterBump { 0% { transform: scale(1); } 35% { transform: scale(1.28) translateY(-3px); } 100% { transform: scale(1); } }
.flyer { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; pointer-events: none; z-index: 5; animation: flyX .6s cubic-bezier(.45,0,.55,1) var(--o) both; }
.flyer i { display: block; width: 100%; height: 100%; animation: flyY .6s cubic-bezier(.3,0,.7,1) var(--o) both; }
.flyer svg { display: block; width: 100%; height: 100%; }
@keyframes flyX { from { transform: translateX(0); } to { transform: translateX(var(--dx)); } }
@keyframes flyY { 0% { opacity: 0; transform: translateY(0) scale(.4); } 12% { opacity: 1; transform: translateY(-30px) scale(1.1); } 40% { transform: translateY(calc(var(--dy) * .3 - 90px)) scale(1); } 100% { opacity: 1; transform: translateY(var(--dy)) scale(.55); } }
/* the pile breathes once it has settled, and a single glint winks on one gem at a time */
#s-reward.told .pile { animation: pileBreathe 3.2s ease-in-out 1.2s infinite; }
@keyframes pileBreathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.022, .985); } }
.glint { position: absolute; width: 24px; height: 24px; margin: -12px 0 0 -12px; color: #fff; pointer-events: none; animation: glintPop .7s cubic-bezier(.2,.8,.3,1) both; }
.glint svg { display: block; width: 100%; height: 100%; }
@keyframes glintPop { 0% { opacity: 0; transform: scale(0) rotate(0); } 40% { opacity: 1; transform: scale(1) rotate(25deg); } 100% { opacity: 0; transform: scale(.3) rotate(60deg); } }
.pile { position: absolute; left: 240px; top: 555px; width: 0; height: 0; }
.pshadow { position: absolute; left: -105px; top: 18px; width: 210px; height: 30px; border-radius: 50%; background: var(--line); transform: scale(0); transition: transform .3s cubic-bezier(.3,1.4,.5,1); }
#s-reward.piled .pshadow { transform: scale(1); }
.gem { position: absolute; width: var(--gs, 104px); height: var(--gs, 104px); margin: calc(var(--gs, 104px) / -2) 0 0 calc(var(--gs, 104px) / -2); transform: scale(0) rotate(var(--r)); }
.gem svg { display: block; width: 100%; height: 100%; }
.gem.pop { animation: gemPop .42s cubic-bezier(.2,.8,.3,1) var(--o) forwards; }
.gem.jig { animation: gemJig .32s cubic-bezier(.3,1.3,.5,1) var(--o) both; }
/* each gem drops in and lands with a squash, then springs back */
@keyframes gemPop {
  0%   { opacity: 0; transform: translateY(-34px) scale(.2) rotate(var(--r)); }
  50%  { opacity: 1; transform: translateY(0) scale(1.14, .88) rotate(var(--r)); }
  75%  { transform: translateY(-5px) scale(.96, 1.06) rotate(var(--r)); }
  100% { opacity: 1; transform: translateY(0) scale(1) rotate(var(--r)); }
}
@keyframes gemJig { 0% { transform: scale(1) translateY(0) rotate(var(--r)); } 40% { transform: scale(1.1) translateY(-14px) rotate(var(--r)); } 100% { transform: scale(1) translateY(0) rotate(var(--r)); } }
.rfoot { position: absolute; left: 0; right: 0; bottom: 0; height: 240px; opacity: 0; pointer-events: none; transition: opacity .3s ease; }
#s-reward.told .rfoot { opacity: 1; pointer-events: auto; }
.rfoot .ad { position: absolute; top: 22px; left: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; }
.rfoot .ad svg { width: 22px; height: 22px; }
#s-reward.told .rfoot .ad { animation: popIn .5s cubic-bezier(.3,1.5,.5,1) .1s both; }
#s-reward.told .rfoot .link { animation: riseIn .4s cubic-bezier(.2,.8,.3,1) .26s both; }
#s-reward.told .rfoot .cont { animation: popIn .5s cubic-bezier(.3,1.5,.5,1) .1s both; }
#s-reward.told .rfoot .ad.gone { animation: fadeOut .25s ease both; pointer-events: none; }
@keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
.rfoot .link { position: absolute; top: 108px; left: 0; right: 0; text-align: center; font-size: 15px; font-weight: 700; color: var(--macaw); }
.rfoot .cont { position: absolute; top: 100px; left: 20px; }
#s-reward.big .ad, #s-reward.big .link { display: none; }
#s-reward:not(.big) .cont { display: none; }
.counter .num { display: inline-block; }
.counter .num.tick { animation: numTick .16s ease-out; }
@keyframes numTick { 0% { transform: translateY(-8px) scale(1.18); } 100% { transform: none; } }


/* tiny sound toggle, kept inside the empty status-bar band */
#mute { position: absolute; top: 18px; right: 18px; z-index: 20; width: 40px; height: 40px; border-radius: 50%; font-size: 18px; opacity: .55; }
#mute:hover { opacity: 1; }
#mute.pop { animation: popIn .35s cubic-bezier(.3,1.6,.5,1); }
</style>

  void show.offsetWidth; show.classList.add("pop"); if (text === CAPS[3]) show.classList.add("cta");
  Snd.pop();
}
function replay(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function startHop(track, delay) { ch.hop = { track, t0: now() + (delay || 0), from: ch.pose.slice(), dir: ch.dir }; ch.dir = -ch.dir; }

function loop() {
  if (!ch.running) return;
  const t = now();
  if (!ch.open) {
    /* the idle hop keeps a strict 2 s rhythm; a slot that lands mid-hop is skipped, never stacked */
    if (t >= ch.idleAt) { if (!ch.hop && !ch.pressed) { startHop(IDLE_HOP); Snd.hop(); } ch.idleAt += 2.0; }
    if (!ch.landed && t >= ch.landAt) { ch.landed = true; Snd.land(); }
    let pose = [0, 0, 1];
    if (ch.hop) {
      const dt = t - ch.hop.t0, v = evalTrack(ch.hop.track, dt);
      if (!v) ch.hop = null;
      else { const b = ch.hop.track === DROP ? 1 : clamp(dt / 0.07, 0, 1); pose = [lerp(ch.hop.from[0], v[0], b), lerp(ch.hop.from[1], v[1] * ch.hop.dir, b), lerp(ch.hop.from[2], v[2], b)]; }
    }
    /* holding the chest before the open: it hunkers down, wider and lower, and springs up on release */
    ch.charge = ch.pressed ? clamp((t - ch.pressT0) / 0.22, 0, 1) : 0;
    if (ch.charge) { const c = smooth(ch.charge); pose = [lerp(pose[0], 5, c), lerp(pose[1], 0, c) + Math.sin(t * 95) * 1.4 * c, lerp(pose[2], .9, c)]; }
    /* squash-and-stretch keeps its volume: whatever the height loses, the width gains */
    const sx = 1 + (1 - pose[2]) * 0.7;
    ch.pose = pose;
    body.style.transform = `translateY(${pose[0].toFixed(2)}px) rotate(${pose[1].toFixed(2)}deg) scale(${sx.toFixed(3)}, ${pose[2].toFixed(3)})`;
    const h = Math.max(0, -pose[0]);
    ground.style.transform = `scale(${clamp(1 - h * 0.004, .3, 1).toFixed(3)}, ${clamp(1 - h * 0.003, .4, 1).toFixed(3)})`; ground.style.opacity = clamp(1 - h * 0.013, 0, 1).toFixed(3);
  } else openStep(t - ch.openT0);
  if (ch.arc) drawArc(t - ch.arc.t0);
  requestAnimationFrame(loop);
}

/* ---- the comet: a tapered stroke chasing its head around a tilted ellipse ---- */
const ORBIT = { cx: 232, cy: 412, rx: 146, ry: 110, phi: -18 * Math.PI / 180, th0: 18 * Math.PI / 180, sweep: 270 * Math.PI / 180 };
function orbitPt(th) {
  const c = Math.cos(th), s = Math.sin(th), cp = Math.cos(ORBIT.phi), sp = Math.sin(ORBIT.phi);
  return [ORBIT.cx + ORBIT.rx * c * cp - ORBIT.ry * s * sp, ORBIT.cy + ORBIT.rx * c * sp + ORBIT.ry * s * cp];
}
function drawArc(t) {
  actx.clearRect(0, 0, 480, 1044);
  if (t > 0.25) { ch.arc = null; return; }
  const head = ORBIT.th0 - ORBIT.sweep * easeOut(t / 0.17, 2.3);
  const tail = ORBIT.th0 - ORBIT.sweep * easeOut((t - 0.055) / 0.16, 2.3);
  if (tail - head < 0.02) return;
  actx.strokeStyle = KIND[ch.kind].comet; actx.lineCap = "round"; actx.lineJoin = "round";
  const fade = t > 0.2 ? 1 - (t - 0.2) / 0.05 : 1;
  /* two comets chase each other around the chest, the second one lighter and thinner */
  [[0, 1, 26], [Math.PI, .8, 18]].forEach(([off, a, w]) => {
    const N = 44, pts = [];
    for (let i = 0; i <= N; i++) pts.push(orbitPt(lerp(tail, head, i / N) + off));
    actx.globalAlpha = fade * a;
    for (let i = 0; i < N; i++) {
      actx.lineWidth = 3 + w * Math.pow((i + 1) / N, 0.8);
      actx.beginPath(); actx.moveTo(pts[i][0], pts[i][1]); actx.lineTo(pts[i + 1][0], pts[i + 1][1]); actx.stroke();
    }
  });
  actx.globalAlpha = 1;
}

/* ---- taps ---- */
function tap() {
  if (!ch.running || ch.open || (ch.hop && ch.hop.track === DROP)) return;
  if (ch.taps < 3) {
    ch.taps++;
    dots[ch.taps - 1].classList.remove("active"); dots[ch.taps - 1].classList.add("used");
    if (ch.taps < 3) { dots[ch.taps].classList.add("active", "pop"); }
    setCap(CAPS[ch.taps]); Snd.stamp();
    ttl.classList.remove("bump"); void ttl.offsetWidth; ttl.classList.add("bump");
    replay(flash, "go"); replay(sparks, "flare"); replay(chestEl, "tapkick");
    ch.arc = { t0: now() }; startHop(TAP_HOP); Snd.tap();
    if (ch.taps === 3) setTimeout(() => { if (ch.taps === 3 && !ch.open) { dotsRow.classList.add("hide"); setCap(CAPS[3]); chestEl.classList.add("ready"); Snd.ready(); } }, 250);
  }
}
/* the video fades the title on press and opens on release */
chestEl.addEventListener("pointerdown", e => {
  if (e.target.closest("#mute")) return;
  if (!ch.running || ch.open || (ch.hop && ch.hop.track === DROP)) return;
  if (ch.taps < 3) { tap(); return; }
  ch.pressed = true; ch.pressT0 = now(); ttl.classList.add("hide"); chestEl.classList.add("charging"); Snd.charge();
});
const release = () => { if (ch.pressed && !ch.open) { ch.pressed = false; openChest(); } };
chestEl.addEventListener("pointerup", release);
chestEl.addEventListener("pointercancel", release);
chestEl.addEventListener("pointerleave", release);

/* ---- opening ---- */
function openChest() {
  ch.open = true; ch.openT0 = now(); ch.hop = null; ch.arc = null; ch.popped = false; ch.openSy = ch.pose[2]; actx.clearRect(0, 0, 480, 1044);
  chestEl.classList.add("ready"); chestEl.classList.remove("charging"); ttl.classList.add("hide"); capA.classList.add("hide"); capB.classList.add("hide");
  ground.style.transform = ""; ground.style.opacity = "";
}
function pop() {
  ch.popped = true; chestEl.classList.add("opened"); Snd.open(); replay(flash, "go");
  if (ORDER.indexOf(ch.kind) >= 2) Snd.fanfare();
  [[-62, -40], [-22, -84], [30, -66], [72, -34], [4, -22]].forEach((p, i) => {
    const e = document.createElement("span"); e.className = "burst"; e.style.cssText = `left:130px;top:150px;--dx:${p[0]}px;--dy:${p[1]}px;--o:${i * .04}s;color:#fff`;
    e.innerHTML = STAR; fx.appendChild(e);
  });
}
function openStep(t) {
  /* anticipation: the chest crouches for 0.12 s, then pops open and stretches tall */
  if (t < 0.12) {
    const u = smooth(t / 0.12), sy = lerp(ch.openSy, .82, u);
    body.style.transform = `translateY(${(7 * u).toFixed(1)}px) scale(${(1 + (1 - sy) * .7).toFixed(3)}, ${sy.toFixed(3)})`;
    return;
  }
  if (!ch.popped) pop();
  const dt = t - 0.12;
  const lift = -48 * easeOut(dt / 0.1, 3);
  const ft = Math.max(0, dt - 0.13), fall = 1200 * ft * ft;
  const st = dt < 0.14 ? lerp(1.14, 1, smooth(dt / 0.14)) : 1;
  body.style.transform = `translateY(${fall.toFixed(1)}px) scale(${(2 - st).toFixed(3)}, ${st.toFixed(3)})`;
  box.style.transform = `translateY(${lift.toFixed(1)}px)`;
  while (ch.nextMote <= dt && dt < 0.72) {
    const e = document.createElement("span"); e.className = "mote";
    e.style.cssText = `left:${(130 + rnd(-64, 64)).toFixed(0)}px;top:${(150 + fall + lift).toFixed(0)}px;--dy:${(-rnd(240, 560)).toFixed(0)}px;--d:${rnd(.9, 1.35).toFixed(2)}s`;
    e.innerHTML = MOTE; fx.appendChild(e);
    ch.nextMote += 0.07;
  }
  if (dt >= 0.5 && !ch.washed) { ch.washed = true; wash.classList.add("go"); }
  if (dt >= 1.25 && !ch.done) { ch.done = true; ch.running = false; showReward(); }
}

/* ============================================================
   Reward screen
   ============================================================ */
const rewardEl = $("#s-reward"), pile = $(".pile", rewardEl), numEl = $(".num", rewardEl), rtitle = $(".rtitle", rewardEl), counter = $(".counter", rewardEl);
let glintTimer = 0;
function bumpCounter() { counter.classList.remove("bump"); void counter.offsetWidth; counter.classList.add("bump"); Snd.clink(); }
/* three gems leave the top of the pile and arc into the counter; the count ticks up as they land */
function flyGems(n) {
  const top = PILES[n][0], sx = 240 + top[0], sy = 555 + top[1] - 20, tx = 92, ty = 93;
  for (let i = 0; i < 3; i++) {
    const f = document.createElement("span"); f.className = "flyer";
    f.style.cssText = `left:${sx + (i - 1) * 14}px;top:${sy}px;--dx:${tx - sx - (i - 1) * 14}px;--dy:${ty - sy}px;--o:${(i * .1).toFixed(2)}s`;
    f.innerHTML = `<i>${GEM}</i>`; rewardEl.appendChild(f);
    setTimeout(() => { f.remove(); bumpCounter(); }, 600 + i * 100);
  }
}
/* one glint at a time, on a random gem of the pile */
function startGlints() {
  stopGlints();
  glintTimer = setInterval(() => {
    const gems = $$(".gem", pile); if (!gems.length) return;
    const g = gems[Math.floor(Math.random() * gems.length)], e = document.createElement("span"); e.className = "glint";
    e.style.cssText = `left:${parseFloat(g.style.left) - 18}px;top:${parseFloat(g.style.top) - 24}px`;
    e.innerHTML = STAR; pile.appendChild(e); setTimeout(() => e.remove(), 800);
  }, 1900);
}
function stopGlints() { clearInterval(glintTimer); glintTimer = 0; $$(".glint", pile).forEach(e => e.remove()); }
function clearFlyers() { $$(".flyer", rewardEl).forEach(e => e.remove()); }
/* [x, y, rotation°, dark]: back gems sit in shadow and are drawn first */
const PILES = {
  4: [[0, -98, -8], [40, -72, 6, 1], [-33, -68, 10], [-60, -12, -6], [43, -12, 6]],
  12: [[4, -150, -6], [48, -110, 8, 1], [-42, -106, -10], [-88, -62, 4, 1], [86, -60, -6, 1], [0, -64, 7], [-60, -12, -5], [96, -16, 5, 1], [30, -14, -8], [-14, -6, 4]]
};
/* bigger piles are stacked as a pyramid, top row first (drawn at the back), with a little scatter */
function pyramid(rows, size, seed) {
  const out = [], R = rows.length;
  rows.forEach((n, r) => { for (let i = 0; i < n; i++) {
    const j = Math.sin(seed + r * 7.3 + i * 13.1) * size * .16, v = Math.cos(seed * 3 + r * 5.1 + i * 9.7) * size * .09;
    out.push([Math.round((i - (n - 1) / 2) * size * .82 + j), Math.round(-size * .12 - (R - 1 - r) * size * .46 + v), ((i + r) % 2 ? 1 : -1) * (4 + (i * 5 + r * 3) % 9), (r < R - 1 && (i + r) % 2) ? 1 : 0]);
  } });
  return out;
}
PILES[24] = pyramid([1, 2, 3, 4, 5], 84, 1);
PILES[40] = pyramid([1, 2, 3, 4, 5, 6], 72, 2);
function showReward() {
  const k = KIND[ch.kind], n = k.gems, from = ch.total, spots = PILES[n], stagger = n <= 4 ? 0.06 : n <= 12 ? 0.035 : 0.03;
  rewardEl.classList.remove("told", "piled"); rewardEl.classList.toggle("big", ch.kind !== "common");
  $(".ad", rewardEl).classList.remove("gone");
  rtitle.style.top = k.titleTop + "px";
  pile.style.setProperty("--gs", k.size + "px");
  const shadowW = n <= 12 ? 210 : Math.round(spots.reduce((m, p) => Math.max(m, Math.abs(p[0])), 0) * 2 + k.size);
  const psh = $(".pshadow", pile); psh.style.width = shadowW + "px"; psh.style.left = (-shadowW / 2) + "px";
  rtitle.textContent = "+" + toAr(n) + (n === 4 ? " جواهر" : " جوهرة");
  numEl.textContent = toAr(from);
  $$(".gem", pile).forEach(g => g.remove());
  spots.forEach(([x, y, rot, dark], i) => {
    const g = document.createElement("span"); g.className = "gem pop";
    g.style.cssText = `left:${x}px;top:${y}px;--r:${rot}deg;--o:${(0.05 + i * stagger).toFixed(3)}s`; g.innerHTML = dark ? GEM_DARK : GEM; pile.appendChild(g);
  });
  rewardEl.classList.add("on"); cur = rewardEl; setBg(rewardEl);
  chestEl.classList.remove("on");
  setTimeout(() => rewardEl.classList.add("piled"), 60);
  const last = 0.05 + (spots.length - 1) * stagger + 0.42;
  stopGlints(); clearFlyers();
  setTimeout(() => { ch.total = from + n; rewardEl.classList.add("told"); Snd.gems(); flyGems(n); setTimeout(() => countTo(from, from + n, 0.3), 600); startGlints(); }, (last + 0.2) * 1000);
  setTimeout(() => $$(".gem", pile).forEach((g, i) => { g.classList.remove("pop"); g.style.transform = "scale(1) rotate(var(--r))"; g.style.setProperty("--o", (i * .03).toFixed(2) + "s"); g.classList.add("jig"); }), (last + 0.35) * 1000);
  setTimeout(() => showChest.reset(), 400);
}
showChest.reset = () => { chestEl.classList.remove("opened"); body.style.transform = ""; box.style.transform = ""; fx.innerHTML = ""; };
/* the counter climbs in discrete ticks, each one a small hop of the number */
function countTo(a, b, dur) {
  const steps = clamp(Math.abs(b - a), 1, 12);
  for (let i = 1; i <= steps; i++) setTimeout(() => { numEl.textContent = toAr(Math.round(lerp(a, b, i / steps))); replay(numEl, "tick"); Snd.tick(); }, i * dur * 1000 / steps);
}
$(".ad", rewardEl).addEventListener("click", e => {
  const b = e.currentTarget; if (b.classList.contains("gone")) return;
  b.classList.add("gone"); countTo(ch.total, ch.total + 15, 0.4); ch.total += 15; Snd.gems(); bumpCounter();
});
const next = () => { stopGlints(); clearFlyers(); const i = ORDER.indexOf(ch.kind); if (i < ORDER.length - 1) { go(chestEl, null); showChest(ORDER[i + 1]); } else go($("#s-start")); };
$(".link", rewardEl).addEventListener("click", next);
$(".cont", rewardEl).addEventListener("click", next);
$("#b-start").addEventListener("click", () => { ctx(); go(chestEl); showChest("common"); });


/* ---- deep links for screenshots: #common #rare #open #reward #reward12 ---- */
const h = location.hash.slice(1);
const REWARD_HASH = { reward: "common", reward12: "rare", rewardepic: "epic", rewardlegendary: "legendary" };
if (ORDER.includes(h)) { chestEl.classList.add("on"); $("#s-start").classList.remove("on"); cur = chestEl; showChest(h); setBg(chestEl); }
else if (h === "open") { chestEl.classList.add("on"); $("#s-start").classList.remove("on"); cur = chestEl; showChest("common"); ch.taps = 3; dotsRow.classList.add("hide"); chestEl.classList.add("ready"); setTimeout(openChest, 300); }
else if (REWARD_HASH[h]) { ch.kind = REWARD_HASH[h]; $("#s-start").classList.remove("on"); showReward(); }
else if (h.startsWith("auto")) {
  /* scripted run for frame captures: three taps a second apart, then press and release */
  chestEl.classList.add("on"); $("#s-start").classList.remove("on"); cur = chestEl; showChest(h.slice(4) || "common"); setBg(chestEl);
  [1.3, 2.2, 3.0].forEach(t => setTimeout(tap, t * 1000));
  setTimeout(() => { ch.pressed = true; ttl.classList.add("hide"); }, 3600);
  setTimeout(release, 3900);
}
})();
