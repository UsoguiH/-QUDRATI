<!DOCTYPE html>
<!-- Screenshot/dev harness: seeds state to skip the disclaimer and
     jumps to a screen via #path / #stats / #settings / #lesson / #pop / #done / #fb / #fbgood / #fail / #intro
     (the full hash table is in CLAUDE.md) -->
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>قدراتي — معاينة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>
  window.onerror = function (msg, src, line, col) {
    var d = document.createElement("div");
    d.style.cssText = "position:fixed;top:0;left:0;right:0;background:#FF4B4B;color:#fff;font:14px monospace;padding:8px;z-index:9999;direction:ltr;white-space:pre-wrap";
    d.textContent = "JS ERROR: " + msg + "\n" + (src || "").split("/").pop() + ":" + line + ":" + col;
    (document.body || document.documentElement).appendChild(d);
  };
  /* This harness overwrites the real save, so it may only run where development
     happens: a local server, a file:// open, the LAN address the dev server prints,
     or an explicit ?dev=1. Anywhere else it is a stray link and we hand the visitor
     the actual app instead of wiping their progress. */
  var DEV_HOST = (function () {
    var h = location.hostname;
    return h === "" || h === "localhost" || h === "127.0.0.1" || h === "[::1]" || h === "::1"
      || /^192\.168\./.test(h) || /^10\./.test(h) || /^172\.(1[6-9]|2\d|3[01])\./.test(h)
      || /\.local$/.test(h) || /[?&]dev=1(&|$)/.test(location.search);
  })();
  if (!DEV_HOST) location.replace("index.html" + location.hash);
  if (DEV_HOST) {
  var examIn43 = new Date(Date.now() + 43 * 864e5);
  var tdy = new Date(), todayK = tdy.getFullYear() + "-" + (tdy.getMonth() + 1) + "-" + tdy.getDate();
  var lwk = Math.floor((new Date(new Date().setHours(0, 0, 0, 0)) - new Date(2026, 0, 4)) / (7 * 864e5));
  var lghosts = ["عبدالله", "نورة", "فهد", "ريم", "خالد", "لمى", "تركي", "جواهر", "عمر", "هند", "سلمان", "رنا", "بدر", "ليان"].map(function (n, i) { return { n: n, base: 30 + i * 9, rate: 18 + (i * 7) % 40 }; });
  localStorage.setItem("qudratState", JSON.stringify({
    league: { week: lwk, base: 527 - 240, ghosts: lghosts },
    daily: { day: todayK, n: location.hash === "#chest" || location.hash === "#chestready" ? 10 : location.hash === "#claimed" ? 10 : 6, claimed: location.hash === "#claimed" },
    v: 1, disclaimer: true, track: "sci", sound: true,
    introSeen: location.hash !== "#intro" && location.hash !== "#welcome" && location.hash.indexOf("#ob-") !== 0,
    /* the first run as a new student meets it: no name yet, so «ابدأ الآن» walks
       through every step (a saved name skips hello, the taste, the journey and
       the name card — which made the new first run look unchanged) */
    user: location.hash === "#login" || location.hash === "#welcome" || location.hash === "#level" || location.hash.indexOf("#ob-") === 0 ? null : { name: "سارة", guest: false },
    xp: 527, totalXp: location.hash.indexOf("#earncross") === 0 ? 1190 : 850, tierSeen: 1,
    streak: { count: 12, last: null },
    /* #warm is the first lesson anyone ever plays, and the app decides that by
       "no lesson has been played" — so that hash seeds a save with none. */
    lessons: ["#warm", "#warmdone"].includes(location.hash) || location.hash.indexOf("#learn") === 0 || location.hash.indexOf("#place") === 0 || location.hash.indexOf("#ob-") === 0 || location.hash === "#welcome" || location.hash === "#level" ? {} : { "numbers.fractions": { stars: 3, plays: 1 } },
    /* a believable fortnight for the stats week card and its pie: four days
       practised this week, three the week before */
    days: (function () { var o = {}, m = new Date(new Date().setHours(0, 0, 0, 0));
      [[0, 12], [1, 8], [3, 15], [5, 6], [8, 9], [10, 7], [12, 11]].forEach(function (p) {
        var d = new Date(m); d.setDate(d.getDate() - p[0]); o[d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate()] = p[1]; });
      return o; })(),
    qstats: { "oo-01": { r: 6, w: 2 }, "oo-02": { r: 4, w: 1 }, "cn-01": { r: 2, w: 3 }, "ge-ang-01": { r: 7, w: 1 } },
    mistakes: location.hash === "#reviewempty" ? {} : { "bigsum-01": 1000, "keylaws-02": 2000, "decimals-01": 3000, "angles-01": 4000 },
    examAsked: location.hash !== "#exam",
    exam: ["#exam", "#noexam"].includes(location.hash) ? null
      : examIn43.getFullYear() + "-" + String(examIn43.getMonth() + 1).padStart(2, "0") + "-" + String(examIn43.getDate()).padStart(2, "0")
  }));
  }
</script>
</head>
<body>
  <div class="app-shell">
    <nav id="sidebar" class="sidebar" aria-label="التنقل الرئيسي"></nav>
    <div id="app" class="app"></div>
    <aside id="aside" class="aside" aria-label="ملخص تقدمك"></aside>
  </div>
  <script src="js/data/skills.js"></script>
  <script src="js/data/numbers.js"></script>
  <script src="js/data/ratios.js"></script>
  <script src="js/data/geometry.js"></script>
  <script src="js/data/teach.js"></script>
  <script src="js/data/teach-figures.js"></script>
  <script src="js/data/learn.js"></script>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      let h = location.hash.replace("#", "") || "path";
      /* a trailing "cap" freezes every animation so a headless screenshot catches the
         settled screen (#donecap, #mockdonecap …); rankcap / earncrosscap keep their own */
      if (h.endsWith("cap") && h.indexOf("rankcap") !== 0 && h !== "earncrosscap") {
        const st = document.createElement("style"); st.textContent = "*{animation:none!important;transition:none!important}";
        document.head.appendChild(st); h = h.slice(0, -3);
      }
      if (h.indexOf("streak") === 0) { A.go("path"); A.debugStreak(parseInt(h.replace("streak", "")) || 7); }
      else if (["stats", "settings", "mock", "league", "review"].includes(h)) A.go(h);
      else if (h === "reviewempty") A.go("review");
      else if (h === "reviewdo") A.startReview();
      else if (h === "frz") { // freeze all anims so any app screen captures at any budget
        const st = document.createElement("style"); st.textContent = "*{animation:none!important;transition:none!important}";
        document.head.appendChild(st); A.go("league");
      }
      else if (h === "rankup") { A.go("league"); A.debugRankUp(2); }
      else if (h === "earncross") { A.go("league"); A.debugEarn(50); }
      else if (h.indexOf("rankcap") === 0 || h === "earncrosscap") { // screenshot helper: pin the celebration's rest pose
        // the scene is a canvas simulation now, so freezing CSS animations no
        // longer stops it — the veil's own reduced-motion path composes the
        // settled frame in one draw, which is exactly what a still wants
        const st = document.createElement("style");
        st.textContent = "*{animation:none!important;transition:none!important}"
          + ".rankup-veil{opacity:1!important}"
          + ".ru-kicker,.ru-title,.ru-sub,.ru-foot{opacity:1!important;transform:none!important}";
        document.head.appendChild(st);
        A.go("league");
        if (h === "earncrosscap") A.debugEarn(50);            // REAL crossing path → flushRankUp → showRankUp
        else A.debugRankUp(parseInt(h.replace("rankcap", "")) || 2);
      }
      else if (h === "chest") A.openChest();
      else if (h === "mocktest") A.startMock();
      else if (h === "mockdone") {
        A.startMock();
        for (let s = 0; s < 2; s++) {
          const total = document.querySelectorAll(".qn-chip").length;
          for (let i = 0; i < total; i++) {
            A.mockGo(i);
            const q = A.debugMock();
            const n = q.format === "comparison" ? 4 : q.choices.length;
            A.mockSelect(i % 3 === 0 ? (q.answer + 1) % n : q.answer);
          }
          A.mockEndSection();
          if (s === 0) A.mockNextSection();
        }
      }
      else if (h === "gold" || h === "blue" || h === "fx") {
        const d = window.QBANK.numbers;
        A.startLesson("numbers", d.lessons[0].key); A.beginQuestions();
        setTimeout(function () { A.fxDemo(h === "fx" ? null : h); }, 700);
      }
      else if (h === "lesson" || h === "questbanner") {
        const d = window.QBANK.numbers;
        A.startLesson("numbers", d.lessons[0].key); A.beginQuestions();
        if (h === "questbanner") setTimeout(A.questBanner, 400);
      } else if (h === "pathpay" || h === "pathgold") {
        /* back on the path after a short lesson: the node jumps, flips and
           lands in its sparkles (#pathpay), or comes out of the flip gold as
           its last lesson is done (#pathgold) */
        A.debugPathPay(h === "pathgold");
      } else if (h === "pop") {
        const node = document.querySelector(".node:not(.node-locked):not(.node-done)");
        if (node) node.click();
      } else if (h === "fab") {
        const d = window.QBANK.numbers;
        A.startLesson("numbers", d.lessons[0].key); A.beginQuestions();
      } else if (h === "teach" || h === "teachrule" || h === "teachcheck") {
        /* the taught lesson (skills.bigsum): #teach = the opening card, #teachrule = first rule card,
           #teachcheck = the quick check answered wrong */
        A.startLesson("skills", "bigsum");
        if (h !== "teach") A.teachNext();
        if (h === "teachcheck") { A.teachNext(); A.teachNext(); A.teachPick(0); }
      } else if (h === "warm" || h === "warmdone") {
        /* the very first screen a new student ever sees: the warm-up question,
           asked before any rule (the seed above gave this hash an unplayed
           save, which is what turns it on). #warmdone answers it right. */
        A.startLesson("skills", "bigsum");
        if (h === "warmdone") A.teachPick(1);
      } else if (h.indexOf("learn") === 0) {
        /* a short lesson, as a new student meets it: #learn = the first one of the
           first node, #learn3 = the third, #learn-skills.keylaws-2 = any node's any
           lesson. #learnwin finishes the first one and shows its win screen (#learnwinmiss
           with two misses); #learnmore
           goes on to the progress screen after it. */
        const m = /^learn(?:-([a-z]+)\.([a-z]+))?-?(\d+)?(winmiss|win|more)?$/.exec(h) || [];
        const dk = m[1] || "skills", lk = m[2] || "bigsum", li = m[3] ? parseInt(m[3], 10) - 1 : 0;
        A.startLearn(dk, lk, li);
        if (m[4]) A.debugLearnFinish(m[4] === "winmiss" ? 2 : 0);   // #learnwinmiss: two missed, the green banner
        if (m[4] === "more") A.winMore();   // #learnmore: the «تقدّمك اليوم» screen after it
      } else if (h === "book") {
        A.go("path"); A.openBook("skills", "bigsum");
      } else if (h === "unitbook") {
        A.go("path"); A.openUnitBook("skills");
      } else if (h === "rules") {
        /* the lesson intro («قبل ما نبدأ») — lesson 25 carries the angle-numbering key */
        A.startLesson("geometry", "parallel");
      } else if (h === "level") {
        A.levelReplay();   // «كم تعرف عن القسم الكمي؟»
      } else if (h === "welcome") {
        A.go("path"); document.getElementById("app").innerHTML = ""; A.welcomeReplay();
      } else if (h.indexOf("ob-") === 0) {
        A.obReplay(h.slice(3));   // #ob-hello / #ob-journey / #ob-level / #ob-goal / #ob-name / #ob-value / #ob-start / #ob-splash / #ob-pintro
      } else if (h === "placeintro") {
        A.placeIntroReplay();
      } else if (h === "place" || h === "placeweak" || h === "placegood" || h === "placemid" || h === "placegap") {
        /* the level test: #place runs it, #placeweak misses everything (eight
           questions: block A of each unit), #placegood answers everything right,
           #placemid passes the first two units and misses from there, #placegap
           misses unit 1 and passes the rest — the last four land on the result */
        A.startPlacement();
        if (h !== "place") for (let n = 0; n < 20 && A.debugCurrent(); n++) {
          const q = A.debugCurrent(), k = q.format === "comparison" ? 4 : q.choices.length;
          const right = h === "placegood" || (h === "placemid" && n < 8) || (h === "placegap" && q.id.split("-")[0] !== "bigsum" && n > 1);
          if (A.debugPlace(right ? q.answer : (q.answer + 1) % k) !== "ok") break;
        }
      } else if (h === "intro") {
        A.introReplay();   // the seed already cleared introSeen for #intro
      } else if (h === "fb" || h === "fbgood") {
        const d = window.QBANK.numbers;
        /* every lesson teaches cards now, so renderSession() opens one instead
           of a question and neither feedback sheet was reachable */
        A.debugTeachAll("numbers." + d.lessons[0].key);
        A.startLesson("numbers", d.lessons[0].key); A.beginQuestions();
        /* pick DELIBERATELY: choices are shuffled per serve, so index 0 landed on the
           good sheet or the bad one at random and neither screen was reachable on demand */
        const q = A.debugCurrent();
        const n = q.format === "comparison" ? 4 : q.choices.length;
        A.pick(h === "fbgood" ? q.answer : (q.answer + 1) % n);
        A.check();
      } else if (h === "method") {
        const d = window.QBANK.skills;
        A.startLesson("skills", d.lessons[0].key); A.beginQuestions();
        A.showMethod();
      } else if (h === "done") {
        const d = window.QBANK.numbers;
        A.startLesson("numbers", d.lessons[0].key); A.beginQuestions();
        for (let i = 0; i < 200 && document.querySelector(".choices .choice"); i++) {
          A.pick(A.debugCurrent().answer); A.check(); A.next();
        }
      } else if (h === "fail") {
        const d = window.QBANK.numbers;
        A.startLesson("numbers", d.lessons[0].key); A.beginQuestions();
        /* was a hardcoded 3, which stopped matching the day LEVEL_HEARTS became 5.
           Keep missing until the fail screen is actually on-screen. */
        for (let i = 0; i < 12 && document.querySelector(".choices .choice"); i++) {
          const q = A.debugCurrent();
          A.pick((q.answer + 1) % (q.format === "comparison" ? 4 : q.choices.length));
          A.check(); A.next();
        }
      }
    })();
  </script>
</body>
</html>
